    <h3 class="subheading block">1 · Summarise, from a source you supply</h3>
    <p>Give it the text — your notes, a page you have typed up, a document the teacher shared — and ask
    for a summary <em>of that</em>. A summary of a source you provided can be checked line by line
    against the source. A summary of "what you know about photosynthesis" cannot be checked against
    anything.</p>
    <pre class="code code--wrap">Here are my notes on the water cycle. Summarise them in six
bullet points, using only what is in the notes. If something
important is missing from my notes, list it separately at the end.</pre>

    <h3 class="subheading block">2 · Make practice questions</h3>
    <p>This is the technique with the best evidence behind it, and the one students use least. Testing
    yourself teaches more than rereading does.</p>
    <pre class="code code--wrap">Write eight questions on levers for a 2.º ESO test: four recall,
three that need a calculation, one that asks me to explain why.
Put the answers at the end, not next to the questions.</pre>
    <p class="text-quiet">Answer them on paper before you look at the answers. Then check the model's
    answers too — a wrong answer key is worse than no answer key.</p>

    <h3 class="subheading block">3 · Find the gap</h3>
    <p>Ask it to make you explain, rather than explaining to you. It is uncomfortable and it works.</p>
    <pre class="code code--wrap">I am going to explain series and parallel circuits to you in my
own words. Ask me one question at a time. After each answer, tell
me what I got wrong or left out, in one sentence.</pre>

    <h3 class="subheading block">4 · Plan the revision</h3>
    <p>Break a topic into sessions, with a limit you set yourself. You are the one who knows how much
    time there actually is.</p>
    <pre class="code code--wrap">I have four evenings before a test on mechanisms, and 40 minutes
each evening. Plan the four sessions. Each one: what to revise,
one thing to practise, and one question to check I got it.</pre>

    <h3 class="subheading block">5 · Contrast</h3>
    <p>The technique from Section 4, used deliberately. Ask for the argument against, ask for what a
    critic would say, or paste in what a real source says and ask where the two disagree.</p>
    <pre class="code code--wrap">Here is what my textbook says about the causes of the industrial
revolution. Here is what you said. List the points where they
disagree, and do not try to smooth them over.</pre>
    <p class="text-quiet">Where they disagree is exactly where you should look it up. That is a good
    afternoon's work found in one question.</p>
  </div>
</section>

<!-- ===================== 8. Honest work ===================== -->
<section id="s8" class="section-open" data-session="2">
  <span class="label">Section 8</span>
  <h2 class="heading">Honest work</h2>

  <div class="block">
    <p>The line is not "AI or no AI". It is about who did the thinking, and about whether you said what
    you used.</p>

    <div class="split block">
      <div>
        <h3 class="heading-2xs">Help</h3>
        <ul class="text-quiet">
          <li>Asking for an explanation of something you did not follow in class.</li>
          <li>Asking it to make practice questions and answering them yourself.</li>
          <li>Asking what is wrong with a paragraph you wrote, then rewriting it yourself.</li>
          <li>Asking for the counter-argument to your own opinion.</li>
          <li>Asking it to check your spelling in a language you are learning.</li>
        </ul>
      </div>
      <div>
        <h3 class="heading-2xs">Not help</h3>
        <ul class="text-quiet">
          <li>Handing in text you did not write as though you wrote it.</li>
          <li>Copying an answer you cannot explain if you are asked about it tomorrow.</li>
          <li>Using it in an assessment where the teacher said not to.</li>
          <li>Generating a source or a quotation instead of finding one.</li>
          <li>Using it and not saying you used it.</li>
        </ul>
      </div>
    </div>

      <p><strong>The test you can apply yourself.</strong> Could you explain this out loud, right now,
      without the screen, to somebody who asks you a question about it? If yes, the tool helped you
      learn. If no, it did the work instead of you, and the mark you get for it will be a lie that only
      lasts until the next test.</p>
    </div>

    <h3 class="subheading block">Saying what you used</h3>
    <p>Declaring it is not a punishment and it is not an admission of anything. It is what people do
    with any tool or source. A single line at the end of the work is enough:</p>
    <pre class="code code--wrap">AI use: I used [tool] on 14 October to make practice questions
and to check my spelling. The text is mine.</pre>
    <p class="text-quiet">If your teacher has said no AI for a particular task, then it is no AI, and
    that is the end of it. Different tasks have different rules for good reasons — a task that is
    measuring whether <em>you</em> can write a paragraph is measuring nothing if a model writes it.</p>
  </div>

  <div class="activity">
    <span class="label">Activity 1.2</span>
    <h3 class="heading-2xs">Draw the line</h3>
    <dl>
      <dt>Do</dt><dd>Sort ten described situations into <em>honest help</em>, <em>not honest</em> and
      <em>depends</em>, and for every one you put in <em>depends</em>, write the single condition that
      decides it.</dd>
      <dt>With</dt><dd>The card set from your teacher, and the two lists above.</dd>
      <dt>How</dt><dd>Groups of four, 20 minutes, then 10 minutes comparing with another group. Where
      two groups disagree, both explain before either changes its mind.</dd>
      <dt>Hand in</dt><dd>The sorted set on paper, with a written <strong>condition</strong> for each
      card in <em>depends</em>.</dd>
      <dt>Marked on</dt><dd>The conditions, not the sorting. "Depends on whether the teacher allowed
      it" and "depends on whether you could explain it afterwards" are good conditions. "Depends on the
      situation" is not a condition.</dd>
    </dl>
  </div>
</section>

<!-- ===================== 9. Five things worth knowing ===================== -->
<section id="s9" class="section-open" data-session="3">
  <span class="label">Section 9</span>
  <h2 class="heading">Five things worth knowing before you type</h2>

  <div class="block">
    <p>None of these is a reason not to use the tools. All five are things you would want somebody to
    have told you. Each one ends with a rule you can actually follow.</p>

    <h3 class="subheading block">1 · Bias: the patterns include the ones nobody wanted</h3>
    <p>The model learnt patterns from text and images that people made. People are not neutral, and
    neither is what they wrote. If most of the training text about nurses uses "she" and most of the
    text about engineers uses "he", the model will predict exactly that, because that is what the
    pattern says. <span class="term">Bias</span> here is not the machine having an opinion. It is the
    machine repeating an imbalance in its <span class="term">training data</span> — and repeating it
    with the same confident tone as everything else.</p>
    <p>It shows up most in anything about people: examples, names, images, who gets described as
    "typical", which country an example is set in, which language is treated as the default.</p>
    <div class="notice">
      <p><strong>Rule.</strong> When an answer is about people, ask who is missing from it. "Give me
      three more examples, from three different countries" costs you five seconds and changes what you
      hand in.</p>
    </div>

    <h3 class="subheading block">2 · Privacy: the prompt is not a private thought</h3>
    <p>What you type is sent to a company's computers. Depending on the service and the account, it may
    be stored, may be read by a person checking for problems, and may be used to improve the system.
    That is not a scandal; it is how the service works, and the school's agreement with the provider is
    what sets the terms.</p>
    <p>What matters is what you put in it. Personal data about other people is not yours to hand over,
    and that includes the friend you are asking for advice about.</p>
    <div class="notice">
      <p><strong>Rule.</strong> Never type a full name, an address, a phone number, a photograph of a
      person, a mark, a medical detail or anything about a classmate. If you would not read the message
      out to the class, do not send it. If you need a real example, invent the names.</p>
    </div>

    <h3 class="subheading block">3 · Authorship: who owns what comes out</h3>
    <p>Two separate questions live here, and mixing them is what causes arguments.</p>
    <p>The first is what went <em>in</em>: models learnt from text and images made by people, mostly
    without those people being asked. Whether that is fair, and whether it should be paid for, is being
    argued in courts in several countries right now, and it is not settled.</p>
    <p>The second is what comes <em>out</em>: in Spain, copyright law gives authorship to the natural
    person who creates a work. A program is not an author. So a text a model produced is not "your
    work" in the sense your own writing is, whatever the tool's terms of use let you do with it.</p>
    <div class="notice">
      <p><strong>Rule.</strong> Never present generated text or images as your own creation. Say what
      you used and what you asked for, as in Section 8 — and if you use a generated image in a piece of
      work, caption it as generated.</p>
    </div>

    <h3 class="subheading block">4 · Environmental cost: an answer is not free</h3>
    <p>Every answer is produced by computers in a data centre. Those machines use electricity, and
    keeping them cool uses electricity and, in many designs, water. Training a large model costs far
    more than answering one question, but the questions are asked billions of times, and it adds up.</p>
    <p>You will find very different figures quoted for all of this, so treat any specific number you
    see with the same suspicion this unit has been teaching you all along, and check who measured it
    and what exactly they measured. The direction is not in doubt even where the numbers are.</p>
    <div class="notice">
      <p><strong>Rule.</strong> Do not generate for the sake of generating. One well-built prompt
      instead of eight vague ones is better work, faster, and cheaper for everybody — which is a rare
      combination.</p>
    </div>

    <h3 class="subheading block">5 · Age and consent: why you use the school's account</h3>
    <p>In Spain, a person must be <span class="formula">14</span> before they can agree on their own to
    a service processing their personal data. That is set by article 7 of the Spanish data protection
    law, <span class="term">LOPDGDD</span> (Organic Law 3/2018). Below 14, a parent or guardian has to
    agree. Some of you in this room are 13, and the rule does not care that the others are not.</p>
    <p>That is exactly why the school gives you an <span class="term">institutional account</span>. The
    school has an agreement with the provider, made for education, under which the school decides what
    is processed and why. A <span class="term">personal account</span> you open yourself has none of
    that behind it.</p>
    <div class="notice">
      <p><strong>Rule.</strong> Every AI activity in this subject is done with the account the school
      gave you. Never with a personal account, never with a parent's account, and never with somebody
      else's. If your account does not work, tell the teacher — do not work around it.</p>
    </div>
  </div>
</section>

<!-- ===================== 10. Debate ===================== -->
<section id="s10" class="section-open" data-session="3">
  <span class="label">Section 10 · A question, not a conclusion</span>
  <h2 class="heading">Debate: will AI take your job?</h2>

  <div class="block">
    <p>You will hear a slogan: <em>"AI will not take your job, but someone who knows how to use it well
    might."</em> It is repeated so often that it sounds like a finding. It is not. It is one opinion,
    it is contested, and it is a good thing to argue about — which is what this section is for.
    Nothing below is the answer.</p>

    <div class="split block">
      <div>
        <span class="code-label">The case for the slogan</span>
        <ul class="text-quiet">
          <li>Every earlier tool that automated part of a job — the spreadsheet, the cash machine, the
          word processor — changed the job more than it removed it.</li>
          <li>Somebody has to decide what to ask for, judge whether the answer is any good, and take
          responsibility for it. Those are not automated by making the writing faster.</li>
          <li>When the tedious part of a job gets cheaper, people often buy more of the whole thing,
          not less.</li>
        </ul>
      </div>
      <div>
        <span class="code-label">The case against it</span>
        <ul class="text-quiet">
          <li>"Changed, not removed" is cold comfort if it is your job that is removed, in your town,
          this year. Averages are not people.</li>
          <li>This wave is aimed at the part of work that used to be the way in: the junior tasks that
          people learnt on. Removing the first rung is not the same as changing the ladder.</li>
          <li>The slogan is convenient for the companies selling the tools, and that is a reason to
          examine it, not to dismiss it.</li>
          <li>Nobody predicting the effects of a new technology has a good track record, in either
          direction.</li>
        </ul>
      </div>
    </div>

    <div class="notice">
      <p><strong>What is actually known.</strong> Much less than the confident voices on both sides
      suggest. Serious studies disagree with each other, they measure different things, and most of
      them are about tasks rather than whole jobs. If somebody tells you the answer with no hedging,
      that alone is worth noticing.</p>
    </div>
  </div>

  <div class="activity">
    <span class="label">Activity 1.3</span>
    <h3 class="heading-2xs">Argue the side you were given</h3>
    <dl>
      <dt>Do</dt><dd>Debate the question "does knowing how to use AI protect your future job?" Your
      side is assigned, not chosen, and you argue it whether or not you agree with it.</dd>
      <dt>With</dt><dd>Ten minutes of preparation and three written arguments per team. You may use an
      AI tool to find the arguments <strong>for the other side</strong>, and you must say which ones
      came from it.</dd>
      <dt>How</dt><dd>Two teams, 25 minutes: 10 preparing, 3 minutes each to open, 6 for questions
      between teams, 3 to close.</dd>
      <dt>Hand in</dt><dd>A <strong>one-page note</strong>, written after the debate and individually,
      giving the strongest argument from the side you were <em>not</em> on, and saying whether the
      debate changed your view and why.</dd>
      <dt>Marked on</dt><dd>Whether the argument from the other side is stated in its strongest form
      rather than as an easy target, and whether your reasons are reasons and not just a preference.
      Changing your mind is not worth more marks than not changing it.</dd>
    </dl>
  </div>
</section>

<hr class="rule" data-session="3">

<!-- ===================== 11. Quiz ===================== -->
<section id="s11" class="section-open" data-session="3">
  <span class="label">Section 11</span>
  <h2 class="heading">Check what you know</h2>
  <p class="block--tight text-quiet">Eight questions. Every answer, right or wrong, tells you why.
  Nothing here is a mark and nobody else sees it.</p>

  <div class="quiz" data-widget="quiz">

    <div class="quiz__q" data-question="q1">
      <p class="quiz__stem"><span class="quiz__num">1</span>Which sentence describes what a generative
      model actually does?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="It has learnt patterns from an enormous amount of text and predicts the most likely continuation. Every other behaviour you notice — the fluency, the confidence, the occasional invention — follows from that one mechanism.">It predicts the most likely continuation of the text it is given</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="It does not search a store of facts. That is why it cannot tell you where an answer came from, and why asking it for a source can produce a reference that does not exist.">It looks the answer up in a database of facts</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="The brain metaphor is the one this unit sets out to remove. It predicts patterns; it does not think, and there is no opinion behind the words.">It thinks about the question the way a person does</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Some tools do search the web and then write about what they found, but that is a feature bolted on around the model. The model itself is predicting text.">It reads the internet each time you ask it something</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q2">
      <p class="quiz__stem"><span class="quiz__num">2</span>Your phone's spam filter learnt to spot
      junk mail from thousands of examples that people had labelled. What is it?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Machine learning: nobody wrote the rules, the system worked the pattern out from labelled examples. It is AI, and it is not generative — it classifies rather than produces.">Machine learning</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A rule-based system is one where a person wrote every rule by hand. Early spam filters worked that way; this one learnt from examples instead.">A rule-based system</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Generative AI produces something new. A spam filter sorts what already exists into two piles.">Generative AI</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="It is artificial intelligence, and one of the kinds you use most often without noticing. That was rather the point of Section 2.">Not AI at all</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q3">
      <p class="quiz__stem"><span class="quiz__num">3</span>A model states, with complete confidence,
      a fact that turns out to be invented. What is that called, and why did it happen?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="A hallucination, and it happened because the model optimises for what is plausible, not for what is true. The sentence fitted the pattern perfectly; nothing in the machine was ever checking it against reality.">A hallucination — it produced what was plausible, not what was true</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Lying needs an intention to deceive, and there is nothing in the model that could hold one. Calling it lying makes you expect a motive, and there is none to find.">A lie — the model decided to deceive you</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Nothing is broken. This is the machine working exactly as designed, in a case where the likely-looking answer happens to be false — which is why it will keep happening.">A bug — the software is broken and needs fixing</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A bad prompt makes a vague or unhelpful answer more likely, but a perfectly clear prompt can still get an invented fact back. The cause is the mechanism, not your wording.">A prompt error — you asked the question badly</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q4">
      <p class="quiz__stem"><span class="quiz__num">4</span>An AI tool gives you the height of a
      mountain. Which of these counts as checking it?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="A named, responsible source that exists independently of the answer — the atlas in the room qualifies, and you can point at the page. That is the whole test.">Looking it up in the atlas on the classroom shelf</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Asking the same model again is not an independent source. It will predict the most likely continuation of your doubt, which is usually an apology and a different number — right or wrong.">Asking the same tool "are you sure about that?"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Asking a second model gives you a second prediction, not a source. Two machines agreeing tells you the pattern is common, not that it is true.">Asking a different AI tool the same question</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A confident tone is worth nothing here, and Section 3 is about exactly that: a wrong answer sounds identical to a right one. That is why the verification sheet has a column for how sure it sounded.">Reading it again — it sounded very sure</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q5">
      <p class="quiz__stem"><span class="quiz__num">5</span>In a prompt, which of these is the
      <em>context</em> rather than the audience?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Context is the situation around the task: what you have already tried, what you know, what it is for, what limits you have. It is what makes the answer fit you and not just fit somebody of your age.">"I have a test on Friday and I keep confusing two of the stages"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="That is the audience: who will read the answer. Useful, but it tells the model nothing about your situation.">"For a 13-year-old in 2.º ESO"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="That is the format: what the answer should look like. Also worth saying, and also not the context.">"In five bullet points, under 120 words"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="That is the role: who the model should write as. It is the R of the five parts.">"Act as a geography teacher"</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q6">
      <p class="quiz__stem"><span class="quiz__num">6</span>The first answer is too long and uses a
      word you do not know. What is the best next message?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Say what is wrong, then what to do instead. The conversation keeps everything that came before, so a short precise correction beats a long new prompt every time.">"Too long. Cut it to five sentences and replace 'aeroelastic' with plain words"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Repeating the same prompt gets you another answer of the same kind. Nothing you said has changed, so nothing about the prediction changes much either.">Send the same prompt again and hope for a better answer</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Starting from nothing throws away the useful part of what you already have. Iterating means improving this answer, not replacing the whole conversation.">Start a new conversation and write a completely new prompt</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Accepting the first answer is the commonest mistake in this unit. The first answer is a draft, exactly like the first draft of anything you write.">Accept it — the first answer is what the tool thinks is best</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q7">
      <p class="quiz__stem"><span class="quiz__num">7</span>Which of these should never go into a
      prompt?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Personal data about another person is not yours to hand over — a name with a mark attached is exactly the case the rule exists for. Invent the names when you need a real-looking example.">A classmate's name together with the mark they got</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Your own notes on a topic are fine, and pasting them in is the best way to get a summary you can actually check against something.">Your own notes on the water cycle</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Saying what you already know is context, and it is what makes the answer fit you. It is not personal data in the sense the rule is about.">A description of what you already understand and what you do not</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="An invented character in an invented situation is exactly what you should use when you need a realistic example. That is the workaround, not the problem.">An invented name in a made-up example</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q8">
      <p class="quiz__stem"><span class="quiz__num">8</span>Why does this school insist on
      institutional accounts for AI activities?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="In Spain a person must be 14 to consent on their own to their data being processed (article 7 of the LOPDGDD), and part of a 2.º ESO group is 13. The school's account works under the school's own agreement with the provider, made for education.">Because under 14 you cannot give that consent yourself, and the school's agreement covers it</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="It is not about ability. Personal accounts work perfectly well; the question is who agreed to what, on whose behalf, and under which agreement.">Because personal accounts are not good enough for schoolwork</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Nobody is reading your conversations to mark you. The reason is data protection law and the agreement the school has with the provider.">So that teachers can read everything you type</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Cost is not the reason, and it would not change the legal position if it were. The 14-year threshold in article 7 of the LOPDGDD is what decides this.">Because the school account is cheaper</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <p class="quiz__score" data-score role="status" aria-live="polite"></p>
    <div class="btn-row no-print">
      <button class="btn btn--ghost btn--small" type="button" data-quiz-reset>Answer them again</button>
    </div>
  </div>
</section>

<section id="sa" class="section-open" data-session="always">
  <span class="label">Annexe A · Replaceable</span>
  <h2 class="heading">The tool this school has enabled: Copilot</h2>

  <div class="block">
    <div class="notice">
      <p><strong>This annexe is the only part of Unit 1 tied to one product.</strong> Everything else
      in the unit works with any tool that generates text. If the school changes tool, this page is
      replaced and the rest of the unit stays exactly as it is.</p>
    </div>

    <h3 class="subheading block">Signing in</h3>
    <p>Use the <strong>institutional account the school gave you</strong>, and nothing else. If you are
    already signed in with a personal account, sign out first and check which account you are using
    before you type anything: it is usually shown at the top of the window. If the account does not
    work, tell your teacher rather than reaching for another one.</p>

    <h3 class="subheading block">The five techniques of Section 7, here</h3>
    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">How each of the five study techniques is used in this tool</caption>
        <thead>
          <tr><th scope="col">Technique</th><th scope="col">How you do it here</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>1 · Summarise from a source</td>
            <td>Paste your notes into the message, or attach the file if the school's setup allows
            attachments, and ask for a summary <em>of that text only</em>.</td>
          </tr>
          <tr>
            <td>2 · Practice questions</td>
            <td>Ask in one message, with the number, the type and where the answers should go. Answer
            on paper before you look.</td>
          </tr>
          <tr>
            <td>3 · Find the gap</td>
            <td>Ask it to question you one at a time. Keep the conversation going rather than starting
            a new one for each question.</td>
          </tr>
          <tr>
            <td>4 · Plan the revision</td>
            <td>Give it the real number of evenings and the real number of minutes. A plan built on
            invented time is useless.</td>
          </tr>
          <tr>
            <td>5 · Contrast</td>
            <td>This tool can search the web and show links with its answers. That helps — and it means
            you now have two things to check, the claim and whether the link really says it.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <h3 class="subheading block">Three cautions specific to this tool</h3>
    <ul class="text-quiet">
      <li><strong>Links are not proof.</strong> When an answer comes with links, open one. A link that
      exists is not the same as a link that says what the answer claims it says. This is the best
      possible way to practise Section 4, because the checking is one click away.</li>
      <li><strong>Check which account is signed in</strong> every time, especially on a shared computer
      or a family device.</li>
      <li><strong>Features move.</strong> Buttons, menu names and what is switched on for your account
      change over time and are decided by the school. If something described here is not where it says,
      that is expected — the techniques in Section 7 do not depend on it.</li>
    </ul>

    <p class="text-quieter">Last checked against the school's configuration in September 2026. If you
    are reading this much later, assume the details have moved.</p>
  </div>
</section>
