<script>/* =========================================================================
   App TyD 2.º ESO — widgets
   1. Ordenar código desordenado (arrastrar y soltar, y también por teclado).
   2. Tabla de traza rellenable, con comprobación celda a celda.
   3. Autoevaluación con retroalimentación razonada por opción.
   4. Cazador de instrucciones defectuosas (etiquetar el fallo y reescribir).
   5. Emparejar pseudocódigo con diagrama de flujo.
   Todos se declaran en el HTML del tema con atributos data-*.
   ========================================================================= */
(function () {
  'use strict';

  var TyDWidgets = {};

  function progress() {
    return window.TyDProgress || {
      read: function () { return {}; }, write: function () {},
      isDone: function () { return false; }, setDone: function () {}, clearAll: function () {}
    };
  }

  function say(el, text, state) {
    el.textContent = text;
    el.className = 'widget__result' + (state ? ' widget__result--' + state : '');
  }

  /* Mensaje de un widget, con valor por defecto.
     Los textos de resultado de cada widget se escribieron para el tema que
     lo estrenó, y fuera de ese tema no valen. Cualquier tema puede
     sustituirlos con un atributo data-* en el <div> del widget, igual que
     data-ok-note y data-no-note ya hacían en el widget de ordenar. */
  function note(root, attr, fallback) {
    var v = root.getAttribute(attr);
    return (v === null || v === '') ? fallback : v;
  }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* =======================================================================
     1. Ordenar código desordenado
     <div class="widget" data-widget="order" data-id="...">
       <ol class="order-list" data-items>
         <li data-order="1">START</li> …
     ======================================================================= */

  function initOrder(root, themeKey) {
    var list = root.querySelector('[data-items]');
    if (!list) return;

    var result = root.querySelector('[data-result]');
    var items = Array.prototype.slice.call(list.querySelectorAll('li'));
    var total = items.length;
    var dragged = null;

    /* Se desordena al cargar, comprobando que no salga ya ordenado. */
    var mixed = shuffle(items);
    var same = mixed.every(function (li, i) { return li === items[i]; });
    if (same && total > 1) { mixed.push(mixed.shift()); }
    mixed.forEach(function (li) { list.appendChild(li); });

    items.forEach(function (li, i) {
      li.className = 'order-item';
      li.setAttribute('draggable', 'true');
      li.setAttribute('tabindex', '0');
      li.setAttribute('role', 'listitem');

      var text = li.textContent;
      li.textContent = '';

      var handle = document.createElement('span');
      handle.className = 'order-item__handle';
      handle.setAttribute('aria-hidden', 'true');
      handle.innerHTML = '<svg viewBox="0 0 10 16" width="10" height="16" focusable="false">' +
        '<g fill="currentColor">' +
        '<circle cx="2" cy="3" r="1.3"></circle><circle cx="8" cy="3" r="1.3"></circle>' +
        '<circle cx="2" cy="8" r="1.3"></circle><circle cx="8" cy="8" r="1.3"></circle>' +
        '<circle cx="2" cy="13" r="1.3"></circle><circle cx="8" cy="13" r="1.3"></circle>' +
        '</g></svg>';

      var body = document.createElement('span');
      body.className = 'order-item__text';
      body.textContent = text;

      var moves = document.createElement('span');
      moves.className = 'order-move';

      var up = document.createElement('button');
      up.type = 'button';
      up.innerHTML = '&#8593;';
      up.setAttribute('aria-label', 'Move "' + text + '" up');

      var down = document.createElement('button');
      down.type = 'button';
      down.innerHTML = '&#8595;';
      down.setAttribute('aria-label', 'Move "' + text + '" down');

      var mark = document.createElement('span');
      mark.className = 'order-item__mark';
      mark.setAttribute('data-mark', '');

      moves.appendChild(up);
      moves.appendChild(down);

      li.appendChild(handle);
      li.appendChild(body);
      li.appendChild(moves);
      li.appendChild(mark);

      up.addEventListener('click', function () { move(li, -1); up.focus(); });
      down.addEventListener('click', function () { move(li, 1); down.focus(); });

      /* Teclado sobre la propia línea: flechas para moverla. */
      li.addEventListener('keydown', function (ev) {
        if (ev.target !== li) return;
        if (ev.key === 'ArrowUp') { ev.preventDefault(); move(li, -1); li.focus(); }
        if (ev.key === 'ArrowDown') { ev.preventDefault(); move(li, 1); li.focus(); }
      });

      li.addEventListener('dragstart', function (ev) {
        dragged = li;
        li.setAttribute('aria-grabbed', 'true');
        try {
          ev.dataTransfer.effectAllowed = 'move';
          ev.dataTransfer.setData('text/plain', text);
        } catch (e) { /* navegadores que no aceptan setData aquí */ }
      });
      li.addEventListener('dragend', function () {
        dragged = null;
        li.removeAttribute('aria-grabbed');
        clearOver();
      });
      li.addEventListener('dragover', function (ev) {
        if (!dragged || dragged === li) return;
        ev.preventDefault();
        clearOver();
        li.classList.add('order-item--over');
      });
      li.addEventListener('drop', function (ev) {
        if (!dragged || dragged === li) return;
        ev.preventDefault();
        var nodes = Array.prototype.slice.call(list.children);
        var from = nodes.indexOf(dragged);
        var to = nodes.indexOf(li);
        if (from < to) { list.insertBefore(dragged, li.nextSibling); }
        else { list.insertBefore(dragged, li); }
        clearOver();
        reset();
      });
    });

    function clearOver() {
      Array.prototype.forEach.call(list.children, function (n) { n.classList.remove('order-item--over'); });
    }

    function move(li, delta) {
      var nodes = Array.prototype.slice.call(list.children);
      var i = nodes.indexOf(li);
      var j = i + delta;
      if (j < 0 || j >= nodes.length) return;
      if (delta < 0) { list.insertBefore(li, nodes[j]); }
      else { list.insertBefore(li, nodes[j].nextSibling); }
      reset();
    }

    function reset() {
      Array.prototype.forEach.call(list.children, function (n) {
        n.classList.remove('order-item--ok', 'order-item--no');
        var m = n.querySelector('[data-mark]');
        if (m) m.textContent = '';
      });
      if (result) say(result, '', null);
    }

    function check() {
      var nodes = Array.prototype.slice.call(list.children);
      var right = 0;
      nodes.forEach(function (n, i) {
        var want = Number(n.getAttribute('data-order'));
        var ok = want === i + 1;
        if (ok) right++;
        n.classList.remove('order-item--ok', 'order-item--no');
        n.classList.add(ok ? 'order-item--ok' : 'order-item--no');
        var m = n.querySelector('[data-mark]');
        if (m) m.textContent = ok ? 'in place' : 'move me';
      });

      /* El comentario de cierre depende del tema: se puede fijar en el HTML
         con data-ok-note y data-no-note. Por defecto habla de pseudocódigo. */
      if (right === total) {
        say(result, 'All ' + total + ' lines are in the right order. ' + (root.getAttribute('data-ok-note') ||
          'Read it once more from START to END and check that every variable is read before it is used.'), 'ok');
        remember(true);
      } else {
        say(result, right + ' of ' + total + ' lines are in the right place. ' + (root.getAttribute('data-no-note') ||
          'The lines marked "move me" break a dependency: something is used before it exists, or a block is closed before it is opened.'), 'no');
        remember(false);
      }
    }

    function remember(solved) {
      var id = root.getAttribute('data-id');
      if (!id || !themeKey) return;
      var p = progress();
      var data = p.read(themeKey);
      data.widgets = data.widgets || {};
      data.widgets[id] = solved ? 'solved' : 'tried';
      p.write(themeKey, data);
    }

    var checkBtn = root.querySelector('[data-check]');
    if (checkBtn) checkBtn.addEventListener('click', check);

    var shuffleBtn = root.querySelector('[data-shuffle]');
    if (shuffleBtn) {
      shuffleBtn.addEventListener('click', function () {
        shuffle(Array.prototype.slice.call(list.children)).forEach(function (n) { list.appendChild(n); });
        reset();
      });
    }
  }

  /* =======================================================================
     2. Tabla de traza rellenable
     <div class="widget" data-widget="trace" data-id="...">
       <table class="trace"> … <td data-answer="4">  ⇒ celda a rellenar
                                <td data-fixed="true">  ⇒ celda dada
     ======================================================================= */

  function normalise(s) {
    return String(s)
      .trim()
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .replace(/^["']|["']$/g, '')
      .replace(/^£/, '')
      .replace(/,/g, '.');
  }

  function initTrace(root, themeKey) {
    var table = root.querySelector('table');
    if (!table) return;
    var result = root.querySelector('[data-result]');
    var cells = Array.prototype.slice.call(table.querySelectorAll('td[data-answer]'));

    cells.forEach(function (td, i) {
      var answer = td.getAttribute('data-answer');
      var input = document.createElement('input');
      input.type = 'text';
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('spellcheck', 'false');
      input.setAttribute('inputmode', td.getAttribute('data-mode') || 'text');
      input.placeholder = td.getAttribute('data-placeholder') || '';
      var label = td.getAttribute('data-label');
      if (label) { input.setAttribute('aria-label', label); }
      else { input.setAttribute('aria-label', 'Value ' + (i + 1)); }
      input.setAttribute('data-answer', answer);
      td.textContent = '';
      td.appendChild(input);

      input.addEventListener('input', function () {
        input.removeAttribute('data-state');
        if (result) say(result, '', null);
      });
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); check(); }
      });
    });

    function check() {
      var right = 0, blank = 0;
      var inputs = table.querySelectorAll('input[data-answer]');
      Array.prototype.forEach.call(inputs, function (input) {
        var want = input.getAttribute('data-answer');
        var alts = want.split('|').map(normalise);
        var got = normalise(input.value);
        if (!got) { blank++; input.removeAttribute('data-state'); return; }
        var ok = alts.indexOf(got) !== -1;
        input.setAttribute('data-state', ok ? 'ok' : 'no');
        input.setAttribute('aria-invalid', ok ? 'false' : 'true');
        if (ok) right++;
      });

      var n = inputs.length;
      if (right === n) {
        say(result, note(root, 'data-ok-note', 'Every cell matches. That is what the computer would hold in memory at each step — you have just run the algorithm by hand.'), 'ok');
        remember(true);
      } else if (blank === n) {
        say(result, note(root, 'data-blank-note', 'Nothing to check yet. Start at step 1 and write down what each variable holds after that line runs.'), null);
      } else {
        say(result, right + ' of ' + n + ' cells match. ' + note(root, 'data-no-note', 'Go back to the first cell with a red outline: a variable only changes on the line that writes to it, and it keeps its value on every line that does not.'), 'no');
        remember(false);
      }
    }

    function remember(solved) {
      var id = root.getAttribute('data-id');
      if (!id || !themeKey) return;
      var p = progress();
      var data = p.read(themeKey);
      data.widgets = data.widgets || {};
      data.widgets[id] = solved ? 'solved' : 'tried';
      p.write(themeKey, data);
    }

    var checkBtn = root.querySelector('[data-check]');
    if (checkBtn) checkBtn.addEventListener('click', check);

    var clearBtn = root.querySelector('[data-clear]');
    if (clearBtn) {
      clearBtn.addEventListener('click', function () {
        Array.prototype.forEach.call(table.querySelectorAll('input[data-answer]'), function (input) {
          input.value = '';
          input.removeAttribute('data-state');
          input.removeAttribute('aria-invalid');
        });
        if (result) say(result, '', null);
      });
    }

    var revealBtn = root.querySelector('[data-reveal]');
    if (revealBtn) {
      revealBtn.addEventListener('click', function () {
        Array.prototype.forEach.call(table.querySelectorAll('input[data-answer]'), function (input) {
          input.value = input.getAttribute('data-answer').split('|')[0];
          input.setAttribute('data-state', 'ok');
        });
        if (result) say(result, note(root, 'data-reveal-note', 'This is the completed trace. Cover it up and fill the table again from an empty sheet — copying it teaches nothing, running it does.'), null);
      });
    }
  }

  /* =======================================================================
     3. Autoevaluación
     Cada opción lleva data-feedback. La correcta, además, data-correct.
     ======================================================================= */

  function initQuiz(root, themeKey) {
    var questions = Array.prototype.slice.call(root.querySelectorAll('[data-question]'));
    var score = root.querySelector('[data-score]');
    var answered = {};

    var p = progress();
    var saved = (themeKey ? p.read(themeKey) : {}).quiz || {};

    questions.forEach(function (q, qi) {
      var id = q.getAttribute('data-question') || ('q' + (qi + 1));
      var options = Array.prototype.slice.call(q.querySelectorAll('[data-feedback]'));
      var box = q.querySelector('[data-feedback-box]');

      options.forEach(function (opt, oi) {
        var key = document.createElement('span');
        key.className = 'quiz-option__key';
        key.setAttribute('aria-hidden', 'true');
        key.textContent = String.fromCharCode(65 + oi);
        opt.insertBefore(key, opt.firstChild);

        opt.addEventListener('click', function () { answer(id, q, options, opt, box); });
      });

      if (saved[id] !== undefined && options[saved[id]]) {
        answer(id, q, options, options[saved[id]], box, true);
      }
    });

    function answer(id, q, options, chosen, box, silent) {
      if (answered[id]) return;
      answered[id] = true;

      var ok = chosen.hasAttribute('data-correct');
      options.forEach(function (opt) {
        opt.disabled = true;
        if (opt === chosen) {
          opt.classList.add(ok ? 'quiz-option--chosen-ok' : 'quiz-option--chosen-no');
        } else if (opt.hasAttribute('data-correct')) {
          opt.classList.add('quiz-option--reveal');
          if (!opt.querySelector('.quiz-option__tag')) {
            var tag = document.createElement('span');
            tag.className = 'quiz-option__tag';
            tag.textContent = 'the right answer';
            opt.appendChild(tag);
          }
        }
      });

      if (box) {
        box.hidden = false;
        box.className = 'quiz__feedback ' + (ok ? 'quiz__feedback--ok' : 'quiz__feedback--no');
        var verdict = document.createElement('span');
        verdict.className = 'quiz__verdict ' + (ok ? 'quiz__verdict--ok' : 'quiz__verdict--no');
        verdict.textContent = ok ? 'Right. ' : 'Not this one. ';
        box.textContent = '';
        box.appendChild(verdict);
        box.appendChild(document.createTextNode(chosen.getAttribute('data-feedback')));
        if (!ok) {
          var right = null;
          options.forEach(function (o) { if (o.hasAttribute('data-correct')) right = o; });
          if (right && right.getAttribute('data-feedback')) {
            box.appendChild(document.createTextNode(' The answer that works is the one labelled "' +
              (right.querySelector('.quiz-option__key') ? right.querySelector('.quiz-option__key').textContent : '') +
              '": ' + right.getAttribute('data-feedback')));
          }
        }
      }

      var index = options.indexOf(chosen);
      if (themeKey && !silent) {
        var data = p.read(themeKey);
        data.quiz = data.quiz || {};
        data.quiz[id] = index;
        p.write(themeKey, data);
      }
      updateScore();
    }

    function updateScore() {
      if (!score) return;
      var done = 0, right = 0;
      questions.forEach(function (q, qi) {
        var id = q.getAttribute('data-question') || ('q' + (qi + 1));
        if (!answered[id]) return;
        done++;
        var chosen = q.querySelector('.quiz-option--chosen-ok');
        if (chosen) right++;
      });
      score.textContent = done + ' of ' + questions.length + ' answered · ' + right + ' right first time. ' +
        'This is not a mark: it is stored in this browser only.';
    }

    var again = root.querySelector('[data-quiz-reset]');
    if (again) {
      again.addEventListener('click', function () {
        if (themeKey) {
          var data = p.read(themeKey);
          delete data.quiz;
          p.write(themeKey, data);
        }
        window.location.reload();
      });
    }

    updateScore();
  }

  /* =======================================================================
     4. Cazador de instrucciones defectuosas  (tema 2)
     <div class="widget" data-widget="hunt" data-id="hunt-atomic"
          data-vocab="no-verb:No action verb|vague:Too vague to follow|…">
       <ol class="hunt" data-items>
         <li data-faults="no-verb vague"
             data-verbs="pick up|take|collect"
             data-must="marker|pen; shelf|table"
             data-hint="which pen; where it is"
             data-model="Pick up the black marker from the shelf.">
           <p class="hunt__bad">Do the drawing thing</p>
         </li>
     El widget construye solo las etiquetas de fallo, el campo de reescritura
     y el resultado por línea. Se comprueban dos cosas distintas: qué falla
     (selección exacta) y la reescritura (reglas mecánicas declaradas en el
     propio HTML, no adivinación).
     ======================================================================= */

  function parseVocab(spec) {
    var out = [];
    String(spec || '').split('|').forEach(function (pair) {
      var bits = pair.split(':');
      if (bits.length < 2) return;
      out.push({ id: bits[0].trim(), label: bits.slice(1).join(':').trim() });
    });
    return out;
  }

  function tidy(s) {
    return String(s).toLowerCase().replace(/[“”"']/g, '').replace(/\s+/g, ' ').trim();
  }

  function initHunt(root, themeKey) {
    var list = root.querySelector('[data-items]');
    if (!list) return;

    var vocab = parseVocab(root.getAttribute('data-vocab'));
    var result = root.querySelector('[data-result]');
    var items = Array.prototype.slice.call(list.querySelectorAll('li'));

    items.forEach(function (li, i) {
      li.className = 'hunt__item';
      var bad = li.querySelector('.hunt__bad');
      var badText = bad ? bad.textContent.trim() : ('Instruction ' + (i + 1));
      if (bad && !bad.querySelector('.hunt__cross')) {
        var cross = document.createElement('span');
        cross.className = 'hunt__cross';
        cross.setAttribute('aria-hidden', 'true');
        cross.textContent = '×';
        bad.insertBefore(cross, bad.firstChild);
      }

      var tags = document.createElement('div');
      tags.className = 'hunt__tags';
      tags.setAttribute('role', 'group');
      tags.setAttribute('aria-label', 'What is wrong with: ' + badText);

      vocab.forEach(function (v) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'hunt__tag';
        b.setAttribute('data-fault', v.id);
        b.setAttribute('aria-pressed', 'false');
        b.textContent = v.label;
        b.addEventListener('click', function () {
          var on = b.getAttribute('aria-pressed') === 'true';
          b.setAttribute('aria-pressed', on ? 'false' : 'true');
          resetItem(li);
        });
        tags.appendChild(b);
      });
      li.appendChild(tags);

      var wrap = document.createElement('div');
      wrap.className = 'hunt__rewrite';
      var lab = document.createElement('label');
      lab.className = 'hunt__label';
      var labId = 'hunt-' + (root.getAttribute('data-id') || 'x') + '-' + (i + 1);
      lab.setAttribute('for', labId);
      lab.textContent = 'Rewrite it as one atomic instruction';
      var input = document.createElement('input');
      input.type = 'text';
      input.id = labId;
      input.setAttribute('data-rewrite', '');
      input.setAttribute('autocomplete', 'off');
      input.setAttribute('spellcheck', 'false');
      input.placeholder = 'Action verb + object + detail';
      input.addEventListener('input', function () { resetItem(li); });
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); check(); }
      });
      wrap.appendChild(lab);
      wrap.appendChild(input);
      li.appendChild(wrap);

      var note = document.createElement('p');
      note.className = 'hunt__note';
      note.setAttribute('data-note', '');
      note.hidden = true;
      li.appendChild(note);

      var say2 = document.createElement('p');
      say2.className = 'hunt__verdict';
      say2.setAttribute('data-item-result', '');
      say2.setAttribute('role', 'status');
      say2.setAttribute('aria-live', 'polite');
      li.appendChild(say2);
    });

    function resetItem(li) {
      li.classList.remove('hunt__item--ok', 'hunt__item--no');
      var v = li.querySelector('[data-item-result]');
      if (v) { v.textContent = ''; v.className = 'hunt__verdict'; }
      if (result) say(result, '', null);
    }

    function chosen(li) {
      var out = [];
      Array.prototype.forEach.call(li.querySelectorAll('.hunt__tag'), function (b) {
        if (b.getAttribute('aria-pressed') === 'true') out.push(b.getAttribute('data-fault'));
      });
      return out.sort();
    }

    function wanted(li) {
      return String(li.getAttribute('data-faults') || '').split(/\s+/)
        .filter(function (s) { return s; }).sort();
    }

    /* Reglas mecánicas sobre la reescritura. Devuelve null si pasa todas. */
    function rewriteProblem(li) {
      var input = li.querySelector('[data-rewrite]');
      var raw = input ? input.value : '';
      var text = tidy(raw);
      if (!text) return 'Write your own version of the instruction before checking.';
      if (/\band\b/.test(text)) {
        return 'It still contains "and", so it is still two instructions. Split it and keep the first one.';
      }
      var verbs = String(li.getAttribute('data-verbs') || '').split('|')
        .map(function (v) { return tidy(v); }).filter(function (v) { return v; });
      if (verbs.length) {
        var starts = verbs.some(function (v) { return text.indexOf(v) === 0; });
        if (!starts) {
          return 'Begin with an action verb. Here one of these works: ' + verbs.join(', ') + '.';
        }
      }
      var groups = String(li.getAttribute('data-must') || '').split(';')
        .map(function (g) { return g.trim(); }).filter(function (g) { return g; });
      /* data-hint lleva una pista por grupo, en el mismo orden y con el mismo
         separador. Sin pista se nombra la primera alternativa del grupo. */
      var hints = String(li.getAttribute('data-hint') || '').split(';')
        .map(function (h) { return h.trim(); });
      for (var i = 0; i < groups.length; i++) {
        var alts = groups[i].split('|').map(function (a) { return tidy(a); });
        var hit = alts.some(function (a) { return a && text.indexOf(a) !== -1; });
        if (!hit) {
          return 'A machine still could not follow it. It needs to say ' + (hints[i] || alts[0]) + '.';
        }
      }
      return null;
    }

    function check() {
      var right = 0;
      items.forEach(function (li) {
        var got = chosen(li).join(' ');
        var want = wanted(li).join(' ');
        var tagsOk = got === want;
        var problem = rewriteProblem(li);
        var ok = tagsOk && !problem;
        var v = li.querySelector('[data-item-result]');
        li.classList.remove('hunt__item--ok', 'hunt__item--no');
        li.classList.add(ok ? 'hunt__item--ok' : 'hunt__item--no');
        if (v) {
          v.className = 'hunt__verdict hunt__verdict--' + (ok ? 'ok' : 'no');
          if (ok) {
            v.textContent = 'Atomic. One verb, one object, one action.';
          } else if (!tagsOk) {
            v.textContent = got
              ? 'Not the faults this one has. Read it again as a machine would: what exactly would you not know how to do?'
              : 'Say what is wrong with it first: choose every label that applies.';
          } else {
            v.textContent = problem;
          }
        }
        if (ok) right++;
      });

      var n = items.length;
      if (right === n) {
        say(result, 'All ' + n + ' rewritten. Every one of them now names an action, a thing and enough detail for someone who cannot guess.', 'ok');
        remember(true);
      } else {
        say(result, right + ' of ' + n + ' are atomic. Work down the lines marked in red: the label says what is wrong, and the note under each line says what the rewrite is still missing.', 'no');
        remember(false);
      }
    }

    function reveal() {
      items.forEach(function (li) {
        var model = li.getAttribute('data-model');
        var note = li.querySelector('[data-note]');
        if (model && note) {
          note.hidden = false;
          note.textContent = 'One way to write it: ' + model;
        }
        var want = wanted(li);
        Array.prototype.forEach.call(li.querySelectorAll('.hunt__tag'), function (b) {
          if (want.indexOf(b.getAttribute('data-fault')) !== -1) b.classList.add('hunt__tag--answer');
        });
      });
      if (result) {
        say(result, 'These are model answers, not the only right ones. Compare yours line by line: if yours names the action, the thing and the detail, yours is good too.', null);
      }
    }

    function remember(solved) {
      var id = root.getAttribute('data-id');
      if (!id || !themeKey) return;
      var p = progress();
      var data = p.read(themeKey);
      data.widgets = data.widgets || {};
      data.widgets[id] = solved ? 'solved' : 'tried';
      p.write(themeKey, data);
    }

    var checkBtn = root.querySelector('[data-check]');
    if (checkBtn) checkBtn.addEventListener('click', check);
    var revealBtn = root.querySelector('[data-reveal]');
    if (revealBtn) revealBtn.addEventListener('click', reveal);
  }


  /* =======================================================================
     5. Emparejar pseudocódigo con diagrama de flujo  (tema 4)
     <div class="widget" data-widget="match" data-id="match-structures"
          data-options="A|B|C|D"
          data-notes="A:a straight line of boxes|B:a diamond with two paths|…"
          data-lead="Diagram" data-item-noun="algorithm">   <!-- sustantivos del tema -->
       <ol class="match" data-items>
         <li data-answer="B" data-why="Why B is the one that fits.">
           <pre class="code">…</pre>
         </li>
     El widget construye solo la fila de letras, el veredicto de cada línea y
     el resultado. Una sola letra por línea. Cuando la letra es la equivocada,
     el veredicto dice qué es lo que el alumnado ha elegido —de data-notes—,
     no «incorrecto»: es la misma regla de §2.3 aplicada a un widget.
     ======================================================================= */

  function parsePairs(spec) {
    var out = [];
    String(spec || '').split('|').forEach(function (pair) {
      var bits = pair.split(':');
      if (bits.length < 2) return;
      out.push({ id: bits[0].trim(), text: bits.slice(1).join(':').trim() });
    });
    return out;
  }

  function initMatch(root, themeKey) {
    var list = root.querySelector('[data-items]');
    if (!list) return;

    var result = root.querySelector('[data-result]');
    /* El tema 4 empareja algoritmos con diagramas; el tema 7, piezas con
       vistas. Los dos sustantivos son datos del tema, no del widget. */
    var lead = note(root, 'data-lead', 'Diagram');
    var noun = note(root, 'data-item-noun', 'algorithm');
    var letters = String(root.getAttribute('data-options') || '').split('|')
      .map(function (s) { return s.trim(); }).filter(function (s) { return s; });
    var notes = {};
    parsePairs(root.getAttribute('data-notes')).forEach(function (p) { notes[p.id] = p.text; });

    var items = Array.prototype.slice.call(list.querySelectorAll('li'));

    items.forEach(function (li, i) {
      li.className = 'match__item';

      var opts = document.createElement('div');
      opts.className = 'match__opts';
      opts.setAttribute('role', 'group');
      opts.setAttribute('aria-label', 'Which ' + lead.toLowerCase() + ' matches ' + noun + ' ' + (i + 1) + '?');

      var leadEl = document.createElement('span');
      leadEl.className = 'match__lead';
      leadEl.textContent = lead;
      opts.appendChild(leadEl);

      letters.forEach(function (letter) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'match__opt';
        b.setAttribute('data-option', letter);
        b.setAttribute('aria-pressed', 'false');
        b.textContent = letter;
        b.setAttribute('aria-label', lead + ' ' + letter + ' for ' + noun + ' ' + (i + 1));
        b.addEventListener('click', function () {
          var on = b.getAttribute('aria-pressed') === 'true';
          Array.prototype.forEach.call(opts.querySelectorAll('.match__opt'), function (o) {
            o.setAttribute('aria-pressed', 'false');
            o.classList.remove('match__opt--answer');
          });
          b.setAttribute('aria-pressed', on ? 'false' : 'true');
          resetItem(li);
        });
        opts.appendChild(b);
      });

      li.appendChild(opts);

      var verdict = document.createElement('p');
      verdict.className = 'match__verdict';
      verdict.setAttribute('data-item-result', '');
      verdict.setAttribute('role', 'status');
      verdict.setAttribute('aria-live', 'polite');
      li.appendChild(verdict);
    });

    function resetItem(li) {
      li.classList.remove('match__item--ok', 'match__item--no');
      var v = li.querySelector('[data-item-result]');
      if (v) { v.textContent = ''; v.className = 'match__verdict'; }
      if (result) say(result, '', null);
    }

    function chosen(li) {
      var picked = li.querySelector('.match__opt[aria-pressed="true"]');
      return picked ? picked.getAttribute('data-option') : '';
    }

    function check() {
      var right = 0, blank = 0;
      items.forEach(function (li) {
        var got = chosen(li);
        var want = String(li.getAttribute('data-answer') || '').trim();
        var v = li.querySelector('[data-item-result]');
        li.classList.remove('match__item--ok', 'match__item--no');

        if (!got) {
          blank++;
          if (v) { v.className = 'match__verdict'; v.textContent = 'Choose ' + (/^[aeiou]/i.test(lead) ? 'an ' : 'a ') + lead.toLowerCase() + ' for this one.'; }
          return;
        }
        var ok = got === want;
        if (ok) right++;
        li.classList.add(ok ? 'match__item--ok' : 'match__item--no');
        if (v) {
          v.className = 'match__verdict match__verdict--' + (ok ? 'ok' : 'no');
          v.textContent = ok
            ? (li.getAttribute('data-why') || 'That is the one.')
            : (lead + ' ' + got + ' is ' + (notes[got] || 'a different shape') +
               '. ' + note(root, 'data-wrong-tail', 'Read your lines again and ask what shape they draw.'));
        }
      });

      var n = items.length;
      if (right === n) {
        say(result, 'All ' + n + ' matched. ' + note(root, 'data-ok-note', 'Every line of pseudocode became one symbol, and the arrows did the work that reading downwards did on paper.'), 'ok');
        remember(true);
      } else if (blank === n) {
        say(result, note(root, 'data-blank-note', 'Nothing to check yet. Take one algorithm at a time and ask two questions: is there a diamond, and is there an arrow that goes backwards?'), null);
      } else {
        say(result, right + ' of ' + n + ' matched. ' + note(root, 'data-no-note', 'The clue is never the wording: it is whether the algorithm has a decision, and whether anything sends the flow back to a place it has already been.'), 'no');
        remember(false);
      }
    }

    function reveal() {
      items.forEach(function (li) {
        var want = String(li.getAttribute('data-answer') || '').trim();
        Array.prototype.forEach.call(li.querySelectorAll('.match__opt'), function (o) {
          if (o.getAttribute('data-option') === want) o.classList.add('match__opt--answer');
        });
        var v = li.querySelector('[data-item-result]');
        if (v && li.getAttribute('data-why')) {
          v.className = 'match__verdict';
          v.textContent = lead + ' ' + want + '. ' + li.getAttribute('data-why');
        }
      });
      if (result) {
        say(result, note(root, 'data-reveal-note', 'These are the matches. Cover them up and do it once more from the pseudocode alone — the point is being able to see the shape, not to remember four letters.'), null);
      }
    }

    function remember(solved) {
      var id = root.getAttribute('data-id');
      if (!id || !themeKey) return;
      var p = progress();
      var data = p.read(themeKey);
      data.widgets = data.widgets || {};
      data.widgets[id] = solved ? 'solved' : 'tried';
      p.write(themeKey, data);
    }

    var checkBtn = root.querySelector('[data-check]');
    if (checkBtn) checkBtn.addEventListener('click', check);
    var revealBtn = root.querySelector('[data-reveal]');
    if (revealBtn) revealBtn.addEventListener('click', reveal);
  }


  /* =======================================================================
     6. Glosario buscable  (temas 6, 8, 9, 10 y glosario global de la app)
     <div class="widget" data-widget="glossary" data-id="gloss-structures"
          data-unit="Structures">
       <input type="search" data-search>
       <dl class="glossary__list" data-items>
         <div class="glossary__item"><dt>Term</dt><dd>Definition.</dd></div>
     El filtro busca en el término Y en la definición, que es lo que permite
     escribir «twist» y encontrar «torsion». Sin resultados no es un error:
     el mensaje dice qué hacer (CONVENCIONES.md §2.3).
     El mismo componente sirve para el glosario de un tema y para el global,
     que app.js construye clonando los .glossary__item de todos los temas.
     ======================================================================= */

  function initGlossary(root) {
    var list = root.querySelector('[data-items]');
    var input = root.querySelector('[data-search]');
    var result = root.querySelector('[data-result]');
    if (!list || !input) return;

    var items = Array.prototype.slice.call(list.querySelectorAll('.glossary__item'));
    items.forEach(function (it) {
      var dt = it.querySelector('dt');
      var dd = it.querySelector('dd');
      /* La etiqueta de unidad que el glosario global añade dentro del <dt>
         es metadato, no definición: si entra en el índice, buscar
         «flowchart» devuelve las quince entradas de la unidad 4 y buscar
         «electricity» las treinta y tres de la 10. El contrato de
         CONVENCIONES §4bis dice término y definición, y solo eso
         (hallazgo A96). */
      var termText = '';
      if (dt) {
        Array.prototype.forEach.call(dt.childNodes, function (n) {
          if (n.nodeType === 1 && n.classList && n.classList.contains('glossary__unit')) return;
          termText += n.textContent;
        });
      }
      var text = (termText + ' ' + (dd ? dd.textContent : ''));
      it.setAttribute('data-text', text.toLowerCase().replace(/\s+/g, ' '));
    });

    var total = items.length;
    var noun = total === 1 ? ' term' : ' terms';

    function apply() {
      var raw = input.value.trim();
      var q = raw.toLowerCase();
      var shown = 0;
      items.forEach(function (it) {
        var hit = !q || it.getAttribute('data-text').indexOf(q) !== -1;
        it.hidden = !hit;
        if (hit) shown++;
      });
      if (!result) return;
      if (!q) {
        say(result, total + noun + ' in this list.', null);
      } else if (shown === 0) {
        say(result, 'Nothing matches "' + raw + '". ' +
          note(root, 'data-none-note',
               'Try a shorter word, or a word from the definition rather than the name of the term.'), 'no');
      } else {
        say(result, shown + ' of ' + total + ' shown for "' + raw + '".', 'ok');
      }
    }

    input.addEventListener('input', apply);
    input.addEventListener('search', apply);
    apply();
  }

  /* ---------- Arranque ---------------------------------------------------- */

  TyDWidgets.init = function (root, themeKey) {
    if (!root) return;
    Array.prototype.forEach.call(root.querySelectorAll('[data-widget="order"]'), function (n) {
      initOrder(n, themeKey);
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-widget="trace"]'), function (n) {
      initTrace(n, themeKey);
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-widget="hunt"]'), function (n) {
      initHunt(n, themeKey);
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-widget="match"]'), function (n) {
      initMatch(n, themeKey);
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-widget="glossary"]'), function (n) {
      initGlossary(n);
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-widget="quiz"]'), function (n) {
      initQuiz(n, themeKey);
    });
  };

  window.TyDWidgets = TyDWidgets;
}());
</script>
<script>/* =========================================================================
   App TyD 2.º ESO — motor
   Router por hash, registro de temas, progreso local y constelación de fondo.
   JavaScript plano, sin dependencias, sin red.
   ========================================================================= */
(function () {
  'use strict';

  /* ---------- 1. Registro de temas ---------------------------------------
     Los diez slugs son fijos (CONVENCIONES.md §4.2). Un tema existe en la
     compilación si hay un <template data-theme="slug"> en el documento.     */

  var THEMES = [
    { n: '01', slug: 'learn-with-ai',            title: 'Learn with AI' },
    { n: '02', slug: 'think-like-a-machine',     title: 'Think Like a Machine' },
    { n: '03', slug: 'writing-pseudocode',       title: 'Writing Pseudocode' },
    { n: '04', slug: 'algorithms-and-flowcharts', title: 'Algorithms and Flowcharts' },
    { n: '05', slug: 'block-programming',        title: 'Block Programming' },
    { n: '06', slug: 'your-digital-world',       title: 'Your Digital World' },
    { n: '07', slug: 'drawing-ideas',            title: 'Drawing Ideas' },
    { n: '08', slug: 'structures',               title: 'Structures' },
    { n: '09', slug: 'mechanisms',               title: 'Mechanisms' },
    { n: '10', slug: 'electricity',              title: 'Electricity' }
  ];

  function themeKey(t) { return t.n + '-' + t.slug; }

  function templateFor(key) {
    return document.querySelector('template[data-theme="' + key + '"]');
  }

  function findTheme(key) {
    for (var i = 0; i < THEMES.length; i++) {
      if (themeKey(THEMES[i]) === key) return THEMES[i];
    }
    return null;
  }

  /* ---------- 2. Progreso ------------------------------------------------
     Prefijo tyd2eso: (CONVENCIONES.md §4.4). Local al navegador. Nunca es
     un registro de calificación, y así se dice en la interfaz.             */

  var PREFIX = 'tyd2eso:';
  var storeWorks = (function () {
    try {
      window.localStorage.setItem(PREFIX + 'test', '1');
      window.localStorage.removeItem(PREFIX + 'test');
      return true;
    } catch (e) { return false; }
  }());

  var Progress = {
    read: function (key) {
      if (!storeWorks) return {};
      try {
        var raw = window.localStorage.getItem(PREFIX + 'progress:' + key);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    },
    write: function (key, data) {
      if (!storeWorks) return;
      try {
        window.localStorage.setItem(PREFIX + 'progress:' + key, JSON.stringify(data));
      } catch (e) { /* cuota llena o almacenamiento bloqueado: se sigue sin guardar */ }
    },
    isDone: function (key) { return this.read(key).done === true; },
    setDone: function (key, value) {
      var data = this.read(key);
      data.done = !!value;
      data.at = new Date().toISOString().slice(0, 10);
      this.write(key, data);
    },
    clearAll: function () {
      if (!storeWorks) return;
      try {
        var kill = [];
        for (var i = 0; i < window.localStorage.length; i++) {
          var k = window.localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) kill.push(k);
        }
        for (var j = 0; j < kill.length; j++) window.localStorage.removeItem(kill[j]);
      } catch (e) { /* nada que hacer */ }
    }
  };

  window.TyDProgress = Progress;

  /* ---------- 3. Navegación ---------------------------------------------- */

  var navList = document.getElementById('nav-list');
  var progressCount = document.getElementById('progress-count');

  function renderNav() {
    if (!navList) return;
    navList.innerHTML = '';
    var done = 0;
    var available = 0;

    THEMES.forEach(function (t) {
      var key = themeKey(t);
      var exists = !!templateFor(key);
      var isDone = Progress.isDone(key);
      if (exists) available++;
      if (isDone) done++;

      var li = document.createElement('li');
      li.className = 'nav__item';

      var a = document.createElement('a');
      a.className = 'nav__link';
      a.href = '#/' + key;
      a.setAttribute('data-link', '');
      if (!exists) a.setAttribute('data-pending', '');

      var num = document.createElement('span');
      num.className = 'nav__num';
      num.textContent = t.n;

      var label = document.createElement('span');
      label.textContent = t.title;

      var dot = document.createElement('span');
      dot.className = 'nav__dot' + (isDone ? ' nav__dot--done' : '');
      dot.setAttribute('aria-hidden', 'true');

      var sr = document.createElement('span');
      sr.className = 'visually-hidden';
      sr.textContent = isDone ? ' — finished' : (exists ? '' : ' — not written yet');

      a.appendChild(num);
      a.appendChild(label);
      a.appendChild(dot);
      a.appendChild(sr);
      li.appendChild(a);
      navList.appendChild(li);
    });

    /* Glosario global de la app (fase 6.5 del plan). No es una unidad: va
       al final de la lista, sin número y sin punto de progreso.            */
    var gli = document.createElement('li');
    gli.className = 'nav__item';
    var ga = document.createElement('a');
    ga.className = 'nav__link';
    ga.href = '#/glossary';
    ga.setAttribute('data-link', '');
    var gnum = document.createElement('span');
    gnum.className = 'nav__num';
    gnum.textContent = 'A\u2013Z';
    var glabel = document.createElement('span');
    glabel.textContent = 'Glossary';
    ga.appendChild(gnum);
    ga.appendChild(glabel);
    gli.appendChild(ga);
    navList.appendChild(gli);

    if (progressCount) {
      if (!storeWorks) {
        progressCount.textContent = 'This browser is not saving progress.';
      } else {
        progressCount.textContent = done + ' of ' + available +
          (available === 1 ? ' available unit' : ' available units') + ' marked as finished.';
      }
    }
    markCurrent();
  }

  function markCurrent() {
    var key = currentKey();
    var links = navList ? navList.querySelectorAll('a') : [];
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('href') === '#/' + key) {
        links[i].setAttribute('aria-current', 'page');
      } else {
        links[i].removeAttribute('aria-current');
      }
    }
  }

  /* ---------- 3bis. Modo sesión (CONVENCIONES.md §4ter) --------------------
     Se oculta con el atributo hidden, no con una clase, para que lo oculto
     salga también del árbol de accesibilidad. Una unidad que sessions.json no
     declara no tiene barra y se renderiza igual que antes.                 */

  var SESSIONS = (window.TyDSessions && window.TyDSessions.units) || {};
  var session = null;

  function sessionFromHash() {
    var h = window.location.hash || '', q = h.indexOf('?');
    var m = q < 0 ? null : /(?:^|&)session=([^&]*)/.exec(h.slice(q + 1));
    return m ? m[1] : null;
  }

  function sessionStore(key, value) {
    if (!storeWorks) return null;
    var k = PREFIX + 'session:' + key;
    try {
      if (value === undefined) return window.localStorage.getItem(k);
      if (value === 'all') { window.localStorage.removeItem(k); } else { window.localStorage.setItem(k, value); }
    } catch (e) { /* cuota llena o almacenamiento bloqueado */ }
    return null;
  }

  function mountSessions(root, key, list) {
    var header = root.querySelector('.theme-open');
    if (!header) return;
    var bar = el('nav', 'sessions');
    bar.setAttribute('aria-label', 'Sessions in this unit');
    bar.appendChild(el('span', 'label sessions__label', 'This unit, day by day'));
    var row = el('div', 'sessions__row'), buttons = [];

    function addBtn(value, text, hint) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sessions__btn';
      b.setAttribute('data-session-btn', value);
      b.setAttribute('aria-pressed', 'false');
      b.appendChild(document.createTextNode(text));
      b.appendChild(el('span', 'visually-hidden', hint));
      b.addEventListener('click', function () { selectSession(value, true); });
      row.appendChild(b);
      buttons.push(b);
    }

    addBtn('all', 'All', ' \u2014 the whole unit, every session');
    list.forEach(function (s) {
      addBtn(String(s.n), String(s.n), ' \u2014 session ' + s.n + ', day ' + s.day + ': ' + s.title);
    });
    bar.appendChild(row);

    var note = el('p', 'sessions__now');
    note.setAttribute('role', 'status');
    note.setAttribute('aria-live', 'polite');
    bar.appendChild(note);

    header.parentNode.insertBefore(bar, header.nextSibling);
    session = { key: key, list: list, root: root, buttons: buttons, note: note, current: 'all' };
  }

  /* Una sesión que no está en el contrato enseña la unidad entera: es lo que
     cabe esperar de un enlace caducado, y no un error. */
  function selectSession(value, fromUser) {
    if (!session) return;
    var list = session.list, found = null, i;
    for (i = 0; i < list.length; i++) if (String(list[i].n) === String(value)) found = list[i];
    value = found ? String(found.n) : 'all';

    if (fromUser) sessionStore(session.key, value);

    var each = function (sel, fn) { Array.prototype.forEach.call(session.root.querySelectorAll(sel), fn); };
    each('[data-session]', function (n) {
      var v = n.getAttribute('data-session');
      n.hidden = !(!found || v === 'always' || v === value);
    });
    /* El índice que la unidad trae arriba enseña solo lo que se va a ver. */
    each('.theme-open .toc a[data-scroll]', function (a) {
      var to = session.root.querySelector('#' + a.getAttribute('data-scroll'));
      a.parentNode.hidden = !!(to && to.hidden);
    });
    session.buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-session-btn') === value ? 'true' : 'false');
    });
    session.note.textContent = found
      ? 'Session ' + found.n + ' of ' + list.length + ' \u00b7 day ' + found.day + ' \u00b7 ' +
        found.title + '. The rest of the unit is hidden.'
      : 'Showing the whole unit \u00b7 ' + list.length + ' sessions.';
    session.current = value;
    if (!fromUser) return;

    var first = session.root.querySelector('section[data-session]:not([hidden])');
    if (first) {
      var head = first.querySelector('h1, h2, h3') || first;
      head.setAttribute('tabindex', '-1');
      head.focus();
    }
    /* El hash es el enlace que se pega en la pizarra. Se escribe en location,
       no con replaceState, que Chrome prohíbe sobre file://; el hashchange que
       provoca lo absorbe el router sin volver a renderizar. */
    var want = '#/' + session.key + (found ? '?session=' + value : '');
    if (window.location.hash !== want) window.location.hash = want;
  }

  /* ---------- 4. Router --------------------------------------------------- */

  var view = document.getElementById('view');
  var main = document.getElementById('main');

  function currentKey() {
    var h = window.location.hash || '';
    if (h.indexOf('#/') !== 0) return '';
    return h.slice(2).split('?')[0];
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function renderHome() {
    /* Salir de una unidad con sesión activa sin pasar por renderTheme() —a Home, al
       glosario o a una unidad bloqueada (renderMissing)— deja `session` con la unidad
       anterior. Si luego se vuelve a esa misma unidad, el atajo de más abajo
       ("misma unidad, solo cambia ?session=N") la confunde con un cambio de filtro y no
       repinta la vista. Las tres funciones que no son renderTheme() reinician `session`. */
    session = null;
    document.title = 'Technology and Digitalisation · 2.º ESO';
    var tpl = document.getElementById('tpl-home');
    view.className = 'wrap';
    clear(view);
    view.appendChild(tpl.content.cloneNode(true));

    var toc = view.querySelector('#home-toc');
    THEMES.forEach(function (t) {
      var key = themeKey(t);
      var exists = !!templateFor(key);
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#/' + key;
      a.setAttribute('data-link', '');
      var left = document.createElement('span');
      left.innerHTML = '';
      left.appendChild(document.createTextNode(t.title));
      if (!exists) {
        var pending = document.createElement('span');
        pending.className = 'text-quieter';
        pending.textContent = ' — not written yet';
        left.appendChild(pending);
      } else if (Progress.isDone(key)) {
        var ok = document.createElement('span');
        ok.className = 'text-accent';
        ok.textContent = ' — finished';
        left.appendChild(ok);
      }
      var n = document.createElement('span');
      n.className = 'toc__n';
      n.textContent = t.n;
      a.appendChild(left);
      a.appendChild(n);
      li.appendChild(a);
      toc.appendChild(li);
    });

    var gliH = document.createElement('li');
    var gaH = document.createElement('a');
    gaH.href = '#/glossary';
    gaH.setAttribute('data-link', '');
    var gleft = document.createElement('span');
    gleft.appendChild(document.createTextNode('Glossary'));
    var gquiet = document.createElement('span');
    gquiet.className = 'text-quieter';
    gquiet.textContent = ' \u2014 every keyword, searchable';
    gleft.appendChild(gquiet);
    var gn = document.createElement('span');
    gn.className = 'toc__n';
    gn.textContent = 'A\u2013Z';
    gaH.appendChild(gleft);
    gaH.appendChild(gn);
    gliH.appendChild(gaH);
    toc.appendChild(gliH);

    /* La llamada a la acción apunta al primer tema que exista. */
    var cta = view.querySelector('#home-cta');
    if (cta) {
      var first = null;
      for (var i = 0; i < THEMES.length; i++) {
        if (templateFor(themeKey(THEMES[i]))) { first = THEMES[i]; break; }
      }
      if (first) {
        cta.setAttribute('href', '#/' + themeKey(first));
        cta.textContent = 'Start with Unit ' + Number(first.n) + ' · ' + first.title;
      } else {
        cta.setAttribute('hidden', '');
      }
    }

    startConstellations(view);
  }

  /* ---------- 4bis. Glosario global --------------------------------------
     Se construye en tiempo de ejecución clonando los .glossary__item de
     todos los temas compilados, así que un tema nuevo entra en el glosario
     por el hecho de tener su sección de Keywords: no hay lista que
     mantener aparte. Un mismo término definido en dos unidades aparece dos
     veces, con su etiqueta de unidad, que es información y no un error:
     «resistance» no significa lo mismo en estructuras que en electricidad.
     Filtra el mismo widget de src/widgets.js que usan los temas.          */

  function collectGlossary() {
    var out = [];
    THEMES.forEach(function (t) {
      var tpl = templateFor(themeKey(t));
      if (!tpl) return;
      var nodes = tpl.content.querySelectorAll('[data-widget="glossary"] .glossary__item');
      Array.prototype.forEach.call(nodes, function (n) {
        var dt = n.querySelector('dt');
        out.push({ theme: t, term: dt ? dt.textContent.trim() : '', node: n });
      });
      /* Un tema anterior al prompt 6 puede traer sus keywords como una lista
         de definiciones dentro de una tarjeta de referencia. Marcada con
         data-glossary-source, entra en el glosario global sin reescribirla. */
      var pairs = tpl.content.querySelectorAll('[data-glossary-source] dl');
      Array.prototype.forEach.call(pairs, function (dl) {
        var kids = dl.children, term = null;
        for (var i = 0; i < kids.length; i++) {
          if (kids[i].tagName === 'DT') { term = kids[i]; continue; }
          if (kids[i].tagName === 'DD' && term) {
            var item = document.createElement('div');
            item.className = 'glossary__item';
            item.appendChild(term.cloneNode(true));
            item.appendChild(kids[i].cloneNode(true));
            out.push({ theme: t, term: term.textContent.trim(), node: item });
            term = null;
          }
        }
      });
      /* El tema 4 trae su vocabulario como tabla de dos columnas y su texto
         dice al alumnado que esas palabras alimentan el glosario buscable.
         Lo decía sin que fuera verdad: el glosario global solo leía listas
         de definiciones. Se lee también la tabla marcada, sin reescribir
         una sola palabra del tema (hallazgo A95). */
      var tables = tpl.content.querySelectorAll('table[data-glossary-source]');
      Array.prototype.forEach.call(tables, function (table) {
        var rows = table.querySelectorAll('tbody tr');
        Array.prototype.forEach.call(rows, function (tr) {
          var cells = tr.children;
          if (cells.length < 2) return;
          var item = document.createElement('div');
          item.className = 'glossary__item';
          var dt = document.createElement('dt');
          dt.textContent = cells[0].textContent.trim();
          var dd = document.createElement('dd');
          dd.textContent = cells[1].textContent.trim();
          if (!dt.textContent || !dd.textContent) return;
          item.appendChild(dt);
          item.appendChild(dd);
          out.push({ theme: t, term: dt.textContent, node: item });
        });
      });
    });
    out.sort(function (a, b) {
      return a.term.toLowerCase().localeCompare(b.term.toLowerCase(), 'en');
    });
    return out;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderGlossary() {
    session = null; /* ver nota en renderHome() */
    document.title = 'Glossary · T&D 2\u00ba ESO';
    view.className = 'wrap';
    clear(view);

    var entries = collectGlossary();

    var head = el('header', 'theme-open');
    var hero = el('div', 'theme-open__hero');
    var intro = el('div', 'theme-open__intro');
    intro.appendChild(el('p', 'theme-open__num', 'All ten units'));
    intro.appendChild(el('h1', 'heading-lg', 'Glossary'));
    intro.appendChild(el('p', 'lede block',
      'Every keyword defined anywhere in this app, in one alphabetical list. ' +
      'The search box reads the definitions as well as the terms, so a word you ' +
      'half remember is usually enough.'));
    hero.appendChild(intro);
    head.appendChild(hero);
    view.appendChild(head);

    view.appendChild(el('hr', 'rule'));

    var sec = el('section', 'section-open');
    var widget = el('div', 'widget');
    widget.setAttribute('data-widget', 'glossary');
    widget.setAttribute('data-id', 'gloss-all');
    widget.setAttribute('data-none-note',
      'Try a shorter word, or a word from the definition rather than the name of the term. ' +
      'You can also type a unit name, such as Mechanisms.');

    var whead = el('div', 'widget__head');
    whead.appendChild(el('h2', 'widget__title', entries.length + ' terms'));
    whead.appendChild(el('p', 'widget__intro',
      'Each entry says which unit it comes from. A term that appears twice is ' +
      'defined twice on purpose: the same word can mean different things in two subjects.'));
    widget.appendChild(whead);

    var label = el('label', 'glossary__search');
    var sr = el('span', 'visually-hidden', 'Search every keyword in the app');
    var input = document.createElement('input');
    input.type = 'search';
    input.setAttribute('data-search', '');
    input.setAttribute('autocomplete', 'off');
    input.placeholder = 'Type a word, such as twist, teeth or per second';
    label.appendChild(sr);
    label.appendChild(input);
    widget.appendChild(label);

    var dl = el('dl', 'glossary__list');
    dl.setAttribute('data-items', '');
    entries.forEach(function (e) {
      var item = e.node.cloneNode(true);
      var dt = item.querySelector('dt');
      if (dt) {
        dt.appendChild(document.createTextNode(' '));
        var tag = el('span', 'glossary__unit', 'Unit ' + Number(e.theme.n) + ' \u00b7 ' + e.theme.title);
        dt.appendChild(tag);
      }
      dl.appendChild(item);
    });
    widget.appendChild(dl);

    var res = el('p', 'widget__result');
    res.setAttribute('data-result', '');
    res.setAttribute('role', 'status');
    res.setAttribute('aria-live', 'polite');
    widget.appendChild(res);

    sec.appendChild(widget);

    if (!entries.length) {
      sec.appendChild(el('p', 'text-quiet',
        'No unit with a keyword list has been compiled into this file yet.'));
    }

    view.appendChild(sec);

    if (window.TyDWidgets && window.TyDWidgets.init) window.TyDWidgets.init(view, null);
  }

  function renderMissing(theme) {
    session = null; /* ver nota en renderHome() */
    var tpl = document.getElementById('tpl-missing').content.cloneNode(true);
    tpl.querySelector('[data-slot="num"]').textContent = 'Unit ' + Number(theme.n);
    tpl.querySelector('[data-slot="title"]').textContent = theme.title;
    document.title = theme.title + ' · T&D 2º ESO';
    view.className = 'wrap';
    clear(view);
    view.appendChild(tpl);
  }

  function renderTheme(theme) {
    var key = themeKey(theme);
    var tpl = templateFor(key);
    if (!tpl) { renderMissing(theme); return; }

    document.title = theme.title + ' · T&D 2º ESO';
    view.className = 'wrap';
    clear(view);
    view.appendChild(tpl.content.cloneNode(true));

    /* Pie común: marcar como terminado e ir al siguiente tema. */
    var foot = document.getElementById('tpl-theme-foot').content.cloneNode(true);
    var nextLink = foot.querySelector('[data-next]');
    var idx = THEMES.indexOf(theme);
    var next = null;
    for (var i = idx + 1; i < THEMES.length; i++) {
      if (templateFor(themeKey(THEMES[i]))) { next = THEMES[i]; break; }
    }
    if (next && nextLink) {
      nextLink.setAttribute('href', '#/' + themeKey(next));
      nextLink.textContent = 'Next: ' + next.title;
    }
    var btn = foot.querySelector('[data-mark-done]');
    view.appendChild(foot);
    syncDoneButton(btn, key);
    btn.addEventListener('click', function () {
      Progress.setDone(key, !Progress.isDone(key));
      syncDoneButton(btn, key);
      renderNav();
    });

    startConstellations(view);
    if (window.TyDWidgets && window.TyDWidgets.init) window.TyDWidgets.init(view, key);

    /* La barra se monta con el árbol entero a la vista: cada widget se
       inicializa con todas sus preguntas y ningún contador ve el filtro. */
    session = null;
    if (SESSIONS[key] && SESSIONS[key].length) {
      mountSessions(view, key, SESSIONS[key]);
      selectSession(sessionFromHash() || sessionStore(key), false);
    }
  }

  function syncDoneButton(btn, key) {
    if (!btn) return;
    var done = Progress.isDone(key);
    btn.textContent = done ? 'Finished — click to undo' : 'Mark this unit as finished';
    btn.className = done ? 'btn btn--ghost' : 'btn';
    btn.setAttribute('aria-pressed', done ? 'true' : 'false');
  }

  function route(opts) {
    var key = currentKey();
    if (!key) {
      renderHome();
    } else if (key === 'glossary') {
      renderGlossary();
    } else {
      var theme = findTheme(key);
      if (theme) { renderTheme(theme); } else { window.location.hash = '#/'; return; }
    }
    markCurrent();
    if (opts && opts.focus) {
      main.focus();
      window.scrollTo(0, 0);
    }
    closeNavOnMobile();
  }

  window.addEventListener('hashchange', function () {
    var h = window.location.hash || '';
    /* Solo las rutas empiezan por '#/'. Cualquier otra ancla —el enlace
       «Skip to content», que apunta a #main— no navega: mueve el foco y ya.
       Sin esto, saltar al contenido devolvía al alumnado a la portada, que es
       justo lo contrario de lo que hace ese enlace (hallazgo A86). */
    if (h && h.indexOf('#/') !== 0) {
      if (main) { main.focus(); }
      return;
    }
    /* Misma unidad y solo cambia ?session=N: se filtra sin volver a
       renderizar, que perdería el estado de los widgets y la posición. */
    if (session && currentKey() === session.key) {
      selectSession(sessionFromHash(), false);
      markCurrent();
      return;
    }
    route({ focus: true });
  });

  /* ---------- 5. Menú en pantallas estrechas ------------------------------ */

  var navToggle = document.getElementById('nav-toggle');
  var navPanel = document.getElementById('nav-panel');

  function isNarrow() { return window.matchMedia('(max-width: 860px)').matches; }

  function closeNavOnMobile() {
    if (isNarrow() && navPanel && navToggle) {
      navPanel.hidden = true;
      navToggle.setAttribute('aria-expanded', 'false');
    }
  }
  function syncNavForWidth() {
    if (!navPanel || !navToggle) return;
    if (isNarrow()) {
      if (navToggle.getAttribute('aria-expanded') !== 'true') navPanel.hidden = true;
    } else {
      navPanel.hidden = false;
    }
  }
  if (navToggle) {
    navToggle.addEventListener('click', function () {
      var open = navToggle.getAttribute('aria-expanded') === 'true';
      navToggle.setAttribute('aria-expanded', open ? 'false' : 'true');
      navPanel.hidden = open;
    });
  }
  window.addEventListener('resize', syncNavForWidth);

  /* ---------- 6. Reinicio del progreso ------------------------------------ */

  var resetBtn = document.getElementById('reset-progress');
  if (resetBtn) {
    resetBtn.addEventListener('click', function () {
      if (resetBtn.getAttribute('data-confirm') !== 'yes') {
        resetBtn.setAttribute('data-confirm', 'yes');
        resetBtn.textContent = 'Click again to erase';
        window.setTimeout(function () {
          resetBtn.removeAttribute('data-confirm');
          resetBtn.textContent = 'Reset progress';
        }, 4000);
        return;
      }
      /* clearAll se lleva tyd2eso:session:<slug>, que lleva el mismo prefijo.
         Falta el hash, que si no seguiría pidiendo una sesión. */
      Progress.clearAll();
      var here = currentKey();
      if (here && sessionFromHash() !== null) window.location.hash = '#/' + here;
      resetBtn.removeAttribute('data-confirm');
      resetBtn.textContent = 'Progress erased';
      window.setTimeout(function () { resetBtn.textContent = 'Reset progress'; }, 2500);
      renderNav();
      route({ focus: false });
    });
  }

  /* ---------- 7. Constelación ---------------------------------------------
     Gesto de marca del sistema Dala. Solo en portada y aperturas de tema,
     nunca detrás de texto, detenida con prefers-reduced-motion.            */

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  function startConstellations(root) {
    var canvases = root.querySelectorAll('canvas[data-constellation]');
    for (var i = 0; i < canvases.length; i++) constellation(canvases[i]);
  }

  function constellation(canvas) {
    var ctx;
    try { ctx = canvas.getContext('2d'); } catch (e) { return; }
    if (!ctx) return;

    var colours = ['#8052ff', '#ffb829', '#15846e', '#b39dff', '#5b8cff'];
    var particles = [];
    var raf = null;
    var w = 0, h = 0, dpr = 1;

    function size() {
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return false;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = rect.width; h = rect.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return true;
    }

    function seed() {
      particles = [];
      var count = Math.min(220, Math.round((w * h) / 1400));
      for (var i = 0; i < count; i++) {
        /* Nube orgánica: más densa en el centro del lienzo. */
        var a = Math.random() * Math.PI * 2;
        var r = Math.pow(Math.random(), 0.6);
        particles.push({
          x: w * 0.5 + Math.cos(a) * r * w * 0.46,
          y: h * 0.5 + Math.sin(a) * r * h * 0.42,
          s: 2 + Math.random() * 3.4,
          c: colours[Math.floor(Math.random() * colours.length)],
          o: 0.18 + Math.random() * 0.5,
          vx: (Math.random() - 0.5) * 0.09,
          vy: (Math.random() - 0.5) * 0.09
        });
      }
    }

    function triangle(p) {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - p.s);
      ctx.lineTo(p.x + p.s, p.y + p.s);
      ctx.lineTo(p.x - p.s, p.y + p.s);
      ctx.closePath();
      ctx.strokeStyle = p.c;
      ctx.globalAlpha = p.o;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function paint() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < particles.length; i++) triangle(particles[i]);
      ctx.globalAlpha = 1;
    }

    function step() {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
      }
      paint();
      raf = window.requestAnimationFrame(step);
    }

    function stop() { if (raf) { window.cancelAnimationFrame(raf); raf = null; } }

    function run() {
      stop();
      if (!size()) return;
      seed();
      if (reduceMotion.matches) { paint(); } else { step(); }
    }

    run();

    var resizeTimer = null;
    function onResize() {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(function () {
        if (document.body.contains(canvas)) { run(); } else { stop(); window.removeEventListener('resize', onResize); }
      }, 200);
    }
    window.addEventListener('resize', onResize);

    if (reduceMotion.addEventListener) {
      reduceMotion.addEventListener('change', run);
    } else if (reduceMotion.addListener) {
      reduceMotion.addListener(run);
    }
  }

  /* ---------- 8. Enlaces internos de sección ------------------------------
     El hash lo usa el router, así que el índice de un tema no puede usarlo:
     se desplaza con JavaScript y se lleva el foco al destino.              */

  document.addEventListener('click', function (ev) {
    var link = ev.target.closest ? ev.target.closest('[data-scroll]') : null;
    if (!link) return;
    ev.preventDefault();
    var target = document.getElementById(link.getAttribute('data-scroll'));
    if (!target) return;
    target.setAttribute('tabindex', '-1');
    target.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
    target.focus({ preventScroll: true });
  });

  /* ---------- 9. Impresión de la tarjeta de referencia --------------------- */

  document.addEventListener('click', function (ev) {
    var trigger = ev.target.closest ? ev.target.closest('[data-print-refcard]') : null;
    if (!trigger) return;
    ev.preventDefault();
    var card = document.querySelector('.refcard-page');
    if (!card) return;
    var branch = card.closest('section') || card;
    branch.classList.add('print-only');
    /* Material de referencia, no contenido de un día: se imprime tapada. */
    if (branch.hidden) { branch.hidden = false; branch.setAttribute('data-unhid', ''); }
    document.body.classList.add('print-refcard');
    window.setTimeout(function () { window.print(); }, 30);
  });

  window.addEventListener('afterprint', function () {
    document.body.classList.remove('print-refcard');
    var branch = document.querySelector('.print-only');
    if (branch) {
      branch.classList.remove('print-only');
      if (branch.hasAttribute('data-unhid')) { branch.removeAttribute('data-unhid'); branch.hidden = true; }
    }
  });

  /* ---------- 10. Arranque ------------------------------------------------- */

  syncNavForWidth();
  renderNav();
  route({ focus: false });
}());
</script>
</body>
</html>
