      <figcaption>Writing the prompt is not the skill. Reading the answer and knowing exactly what is
      wrong with it — that is the skill, and it is the same one you use on your own work.</figcaption>
    </figure>

    <h3 class="subheading block">Three rounds on one prompt</h3>

    <span class="code-label">Round 1 · you ask</span>
    <pre class="code code--wrap">Act as a science teacher. Explain how a lever multiplies force,
for a 13-year-old in 2.º ESO, in under 150 words.</pre>
    <p class="text-quiet">What comes back is decent and general, and uses a see-saw. You have already
    done see-saws.</p>

    <span class="code-label">Round 2 · you say what is wrong</span>
    <pre class="code code--wrap">Too abstract, and I already understand see-saws. Use a pair of
pliers instead, give me the actual numbers for a 15 cm handle and
a 3 cm jaw, and keep it to five sentences.</pre>
    <p class="text-quiet">Notice the shape of that message: <strong>what is wrong</strong>, then
    <strong>what to do instead</strong>. No "please can you", no repeating the original prompt.</p>

    <span class="code-label">Round 3 · you push it further</span>
    <pre class="code code--wrap">Good. Now turn the last two sentences into three questions with
answers, so I can test myself. Make the third one harder than
anything you have said so far.</pre>
    <p class="text-quiet">Three short messages, and you have a tailored explanation and a self-test.
    The first prompt could never have produced this, because you did not know what you wanted until you
    saw what you did not want.</p>

    <div class="notice">
      <p><strong>Four things worth saying on the second try.</strong> "Shorter, and cut the
      introduction." · "You have used a word I do not know: replace it and explain it." · "Give me the
      opposite argument as strongly as you can." · "Which part of that answer are you least sure about,
      and what would I have to check?" The last one does not make the answer true — but it does tend to
      point you at the sentence worth checking first.</p>
    </div>
  </div>
</section>

<!-- ===================== 7. Five ways to study with it ===================== -->
<section id="s7" class="section-open" data-session="2">
  <span class="label">Section 7 · Techniques, not products</span>
  <h2 class="heading">Five ways to study with it</h2>

  <div class="block">

    techniques have survived every one of them so far, because they are about how you study, not about
    which button you press. If you want the one this school has enabled, that is Annexe A, and it is
    the only part of this unit tied to a product.</p>

    <h3 class="subheading block">1 · Summarise, from a source you supply</h3>
    <p>Give it the text — your notes, a page you have typed up, a document the teacher shared — and ask
    for a summary <em>of that</em>. A summary of a source you provided can be checked line by line
    against the source. A summary of "what you know about photosynthesis" cannot be checked against
    anything.</p>
    <pre class="code code--wrap">Here are my notes on the water cycle. Summarise them in six
bullet points, using only what is in the notes. If something
important is missing from my notes, list it separately at the end.</pre>

    <h3 class="subheading block">2 · Make practice questions</h3>
    <p>This is the technique with the best evidence behind it, and the one students use least. Testing
    yourself teaches more than rereading does.</p>
    <pre class="code code--wrap">Write eight questions on levers for a 2.º ESO test: four recall,
three that need a calculation, one that asks me to explain why.
Put the answers at the end, not next to the questions.</pre>
    <p class="text-quiet">Answer them on paper before you look at the answers. Then check the model's
    answers too — a wrong answer key is worse than no answer key.</p>

    <h3 class="subheading block">3 · Find the gap</h3>
    <p>Ask it to make you explain, rather than explaining to you. It is uncomfortable and it works.</p>
    <pre class="code code--wrap">I am going to explain series and parallel circuits to you in my
own words. Ask me one question at a time. After each answer, tell
me what I got wrong or left out, in one sentence.</pre>

    <h3 class="subheading block">4 · Plan the revision</h3>
    <p>Break a topic into sessions, with a limit you set yourself. You are the one who knows how much
    time there actually is.</p>
    <pre class="code code--wrap">I have four evenings before a test on mechanisms, and 40 minutes
each evening. Plan the four sessions. Each one: what to revise,
one thing to practise, and one question to check I got it.</pre>

    <h3 class="subheading block">5 · Contrast</h3>
    <p>The technique from Section 4, used deliberately. Ask for the argument against, ask for what a
    critic would say, or paste in what a real source says and ask where the two disagree.</p>
    <pre class="code code--wrap">Here is what my textbook says about the causes of the industrial
revolution. Here is what you said. List the points where they
disagree, and do not try to smooth them over.</pre>
    <p class="text-quiet">Where they disagree is exactly where you should look it up. That is a good
    afternoon's work found in one question.</p>
  </div>
</section>

<!-- ===================== 8. Honest work ===================== -->
<section id="s8" class="section-open" data-session="2">
  <span class="label">Section 8</span>
  <h2 class="heading">Honest work</h2>

  <div class="block">
    <p>The line is not "AI or no AI". It is about who did the thinking, and about whether you said what
    you used.</p>

    <div class="split block">
      <div>
        <h3 class="heading-2xs">Help</h3>
        <ul class="text-quiet">
          <li>Asking for an explanation of something you did not follow in class.</li>
          <li>Asking it to make practice questions and answering them yourself.</li>
          <li>Asking what is wrong with a paragraph you wrote, then rewriting it yourself.</li>
          <li>Asking for the counter-argument to your own opinion.</li>
          <li>Asking it to check your spelling in a language you are learning.</li>
        </ul>
      </div>
      <div>
        <h3 class="heading-2xs">Not help</h3>
        <ul class="text-quiet">
          <li>Handing in text you did not write as though you wrote it.</li>
          <li>Copying an answer you cannot explain if you are asked about it tomorrow.</li>
          <li>Using it in an assessment where the teacher said not to.</li>
          <li>Generating a source or a quotation instead of finding one.</li>
          <li>Using it and not saying you used it.</li>
        </ul>
      </div>
    </div>

      <p><strong>The test you can apply yourself.</strong> Could you explain this out loud, right now,
      without the screen, to somebody who asks you a question about it? If yes, the tool helped you
      learn. If no, it did the work instead of you, and the mark you get for it will be a lie that only
      lasts until the next test.</p>
    </div>

    <h3 class="subheading block">Saying what you used</h3>
    <p>Declaring it is not a punishment and it is not an admission of anything. It is what people do
    with any tool or source. A single line at the end of the work is enough:</p>
    <pre class="code code--wrap">AI use: I used [tool] on 14 October to make practice questions
and to check my spelling. The text is mine.</pre>
    <p class="text-quiet">If your teacher has said no AI for a particular task, then it is no AI, and
    that is the end of it. Different tasks have different rules for good reasons — a task that is
    measuring whether <em>you</em> can write a paragraph is measuring nothing if a model writes it.</p>
  </div>

  <div class="activity">
    <span class="label">Activity 1.2</span>
    <h3 class="heading-2xs">Draw the line</h3>
    <dl>
      <dt>Do</dt><dd>Sort ten described situations into <em>honest help</em>, <em>not honest</em> and
      <em>depends</em>, and for every one you put in <em>depends</em>, write the single condition that
      decides it.</dd>
      <dt>With</dt><dd>The card set from your teacher, and the two lists above.</dd>
      <dt>How</dt><dd>Groups of four, 20 minutes, then 10 minutes comparing with another group. Where
      two groups disagree, both explain before either changes its mind.</dd>
      <dt>Hand in</dt><dd>The sorted set on paper, with a written <strong>condition</strong> for each
      card in <em>depends</em>.</dd>
      <dt>Marked on</dt><dd>The conditions, not the sorting. "Depends on whether the teacher allowed
      it" and "depends on whether you could explain it afterwards" are good conditions. "Depends on the
      situation" is not a condition.</dd>
    </dl>
  </div>
</section>

<!-- ===================== 9. Five things worth knowing ===================== -->
<section id="s9" class="section-open" data-session="3">
  <span class="label">Section 9</span>
  <h2 class="heading">Five things worth knowing before you type</h2>

  <div class="block">
    <p>None of these is a reason not to use the tools. All five are things you would want somebody to
    have told you. Each one ends with a rule you can actually follow.</p>

    <h3 class="subheading block">1 · Bias: the patterns include the ones nobody wanted</h3>
    <p>The model learnt patterns from text and images that people made. People are not neutral, and
    neither is what they wrote. If most of the training text about nurses uses "she" and most of the
    text about engineers uses "he", the model will predict exactly that, because that is what the
    pattern says. <span class="term">Bias</span> here is not the machine having an opinion. It is the
    machine repeating an imbalance in its <span class="term">training data</span> — and repeating it
    with the same confident tone as everything else.</p>
    <p>It shows up most in anything about people: examples, names, images, who gets described as
    "typical", which country an example is set in, which language is treated as the default.</p>
    <div class="notice">
      <p><strong>Rule.</strong> When an answer is about people, ask who is missing from it. "Give me
      three more examples, from three different countries" costs you five seconds and changes what you
      hand in.</p>
    </div>

    <h3 class="subheading block">2 · Privacy: the prompt is not a private thought</h3>
    <p>What you type is sent to a company's computers. Depending on the service and the account, it may
    be stored, may be read by a person checking for problems, and may be used to improve the system.
    That is not a scandal; it is how the service works, and the school's agreement with the provider is
    what sets the terms.</p>
    <p>What matters is what you put in it. Personal data about other people is not yours to hand over,
    and that includes the friend you are asking for advice about.</p>
    <div class="notice">
      <p><strong>Rule.</strong> Never type a full name, an address, a phone number, a photograph of a
      person, a mark, a medical detail or anything about a classmate. If you would not read the message
      out to the class, do not send it. If you need a real example, invent the names.</p>
    </div>

    <h3 class="subheading block">3 · Authorship: who owns what comes out</h3>
    <p>Two separate questions live here, and mixing them is what causes arguments.</p>
    <p>The first is what went <em>in</em>: models learnt from text and images made by people, mostly
    without those people being asked. Whether that is fair, and whether it should be paid for, is being
    argued in courts in several countries right now, and it is not settled.</p>
    <p>The second is what comes <em>out</em>: in Spain, copyright law gives authorship to the natural
    person who creates a work. A program is not an author. So a text a model produced is not "your
    work" in the sense your own writing is, whatever the tool's terms of use let you do with it.</p>
    <div class="notice">
      <p><strong>Rule.</strong> Never present generated text or images as your own creation. Say what
      you used and what you asked for, as in Section 8 — and if you use a generated image in a piece of
      work, caption it as generated.</p>
    </div>

    <h3 class="subheading block">4 · Environmental cost: an answer is not free</h3>
    <p>Every answer is produced by computers in a data centre. Those machines use electricity, and
    keeping them cool uses electricity and, in many designs, water. Training a large model costs far
    more than answering one question, but the questions are asked billions of times, and it adds up.</p>
    <p>You will find very different figures quoted for all of this, so treat any specific number you
    see with the same suspicion this unit has been teaching you all along, and check who measured it
    and what exactly they measured. The direction is not in doubt even where the numbers are.</p>
    <div class="notice">
      <p><strong>Rule.</strong> Do not generate for the sake of generating. One well-built prompt
      instead of eight vague ones is better work, faster, and cheaper for everybody — which is a rare
      combination.</p>
    </div>

    <h3 class="subheading block">5 · Age and consent: why you use the school's account</h3>
    <p>In Spain, a person must be <span class="formula">14</span> before they can agree on their own to
    a service processing their personal data. That is set by article 7 of the Spanish data protection
    law, <span class="term">LOPDGDD</span> (Organic Law 3/2018). Below 14, a parent or guardian has to
    agree. Some of you in this room are 13, and the rule does not care that the others are not.</p>
    <p>That is exactly why the school gives you an <span class="term">institutional account</span>. The
    school has an agreement with the provider, made for education, under which the school decides what
    is processed and why. A <span class="term">personal account</span> you open yourself has none of
    that behind it.</p>
    <div class="notice">
      <p><strong>Rule.</strong> Every AI activity in this subject is done with the account the school
      gave you. Never with a personal account, never with a parent's account, and never with somebody
      else's. If your account does not work, tell the teacher — do not work around it.</p>
    </div>
  </div>
</section>

<!-- ===================== 10. Debate ===================== -->
<section id="s10" class="section-open" data-session="3">
  <span class="label">Section 10 · A question, not a conclusion</span>
  <h2 class="heading">Debate: will AI take your job?</h2>

  <div class="block">
    <p>You will hear a slogan: <em>"AI will not take your job, but someone who knows how to use it well
    might."</em> It is repeated so often that it sounds like a finding. It is not. It is one opinion,
    it is contested, and it is a good thing to argue about — which is what this section is for.
    Nothing below is the answer.</p>

    <div class="split block">
      <div>
        <span class="code-label">The case for the slogan</span>
        <ul class="text-quiet">
          <li>Every earlier tool that automated part of a job — the spreadsheet, the cash machine, the
          word processor — changed the job more than it removed it.</li>
          <li>Somebody has to decide what to ask for, judge whether the answer is any good, and take
          responsibility for it. Those are not automated by making the writing faster.</li>
          <li>When the tedious part of a job gets cheaper, people often buy more of the whole thing,
          not less.</li>
        </ul>
      </div>
      <div>
        <span class="code-label">The case against it</span>
        <ul class="text-quiet">
          <li>"Changed, not removed" is cold comfort if it is your job that is removed, in your town,
          this year. Averages are not people.</li>
          <li>This wave is aimed at the part of work that used to be the way in: the junior tasks that
          people learnt on. Removing the first rung is not the same as changing the ladder.</li>
          <li>The slogan is convenient for the companies selling the tools, and that is a reason to
          examine it, not to dismiss it.</li>
          <li>Nobody predicting the effects of a new technology has a good track record, in either
          direction.</li>
        </ul>
      </div>
    </div>

    <div class="notice">
      <p><strong>What is actually known.</strong> Much less than the confident voices on both sides
      suggest. Serious studies disagree with each other, they measure different things, and most of
      them are about tasks rather than whole jobs. If somebody tells you the answer with no hedging,
      that alone is worth noticing.</p>
    </div>
  </div>

  <div class="activity">
    <span class="label">Activity 1.3</span>
    <h3 class="heading-2xs">Argue the side you were given</h3>
    <dl>
      <dt>Do</dt><dd>Debate the question "does knowing how to use AI protect your future job?" Your
      side is assigned, not chosen, and you argue it whether or not you agree with it.</dd>
      <dt>With</dt><dd>Ten minutes of preparation and three written arguments per team. You may use an
      AI tool to find the arguments <strong>for the other side</strong>, and you must say which ones
      came from it.</dd>
      <dt>How</dt><dd>Two teams, 25 minutes: 10 preparing, 3 minutes each to open, 6 for questions
      between teams, 3 to close.</dd>
      <dt>Hand in</dt><dd>A <strong>one-page note</strong>, written after the debate and individually,
      giving the strongest argument from the side you were <em>not</em> on, and saying whether the
      debate changed your view and why.</dd>
      <dt>Marked on</dt><dd>Whether the argument from the other side is stated in its strongest form
      rather than as an easy target, and whether your reasons are reasons and not just a preference.
      Changing your mind is not worth more marks than not changing it.</dd>
    </dl>
  </div>
</section>

<!-- ===================== 11. Quiz ===================== -->
<section id="s11" class="section-open" data-session="3">
  <span class="label">Section 11</span>
  <h2 class="heading">Check what you know</h2>
  <p class="block--tight text-quiet">Eight questions. Every answer, right or wrong, tells you why.
  Nothing here is a mark and nobody else sees it.</p>

  <div class="quiz" data-widget="quiz">

    <div class="quiz__q" data-question="q1b">
      <p class="quiz__stem"><span class="quiz__num">1</span>Which sentence describes what a generative
      model actually does?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="It does not search a store of facts. That is why it cannot tell you where an answer came from, and why asking it for a source can produce a reference that does not exist.">It retrieves the answer from a stored database of facts and copies it out</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="It has learnt patterns from an enormous amount of text and predicts the most likely continuation. Every other behaviour you notice — the fluency, the confidence, the occasional invention — follows from that one mechanism.">It predicts the most likely continuation of the text it is given</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="The brain metaphor is the one this unit sets out to remove. It predicts patterns; it does not think, and there is no opinion behind the words.">It reasons about the question the way a thinking person would</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Some tools do search the web and then write about what they found, but that is a feature bolted on around the model. The model itself is predicting text.">It searches the web each time you ask, then summarises the results</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q2b">
      <p class="quiz__stem"><span class="quiz__num">2</span>Your phone's spam filter learnt to spot
      junk mail from thousands of examples that people had labelled. What is it?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Generative AI produces something new. A spam filter sorts what already exists into two piles.">Generative AI</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A rule-based system is one where a person wrote every rule by hand. Early spam filters worked that way; this one learnt from examples instead.">A rule-based system</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Checking senders against a list is how the very first filters worked, and it is a rule-based idea. This filter was never given a list: it learnt what junk looks like from labelled examples, so it can catch messages nobody has seen before.">A list of known junk senders</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Machine learning: nobody wrote the rules, the system worked the pattern out from labelled examples. It is AI, and it is not generative — it classifies rather than produces.">Machine learning</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q3b">
      <p class="quiz__stem"><span class="quiz__num">3</span>A model states, with complete confidence,
      a fact that turns out to be invented. What is that called, and why did it happen?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="A hallucination, and it happened because the model optimises for what is plausible, not for what is true. The sentence fitted the pattern perfectly; nothing in the machine was ever checking it against reality.">A hallucination — it gave what was plausible, not what was true</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Lying needs an intention to deceive, and there is nothing in the model that could hold one. Calling it lying makes you expect a motive, and there is none to find.">A lie — the model chose to say something it knew was false</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Training texts do contain mistakes, but that is not the cause here. The model would invent a fact even if every text it learnt from were true, because it assembles plausible sentences rather than recalling checked ones.">A data error — someone put the wrong fact into its training texts</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A bad prompt makes a vague or unhelpful answer more likely, but a perfectly clear prompt can still get an invented fact back. The cause is the mechanism, not your wording.">A prompt error — your wording was too vague, so it filled the gap</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q4b">
      <p class="quiz__stem"><span class="quiz__num">4</span>An AI tool gives you the height of a
      mountain. Which of these counts as checking it?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Asking the same model again is not an independent source. It will predict the most likely continuation of your doubt, which is usually an apology and a different number — right or wrong.">Asking the same tool "are you sure about that?"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Asking a second model gives you a second prediction, not a source. Two machines agreeing tells you the pattern is common, not that it is true.">Asking a different AI tool the same question</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="A named, responsible source that exists independently of the answer — the atlas in the room qualifies, and you can point at the page. That is the whole test.">Looking it up in the atlas on the classroom shelf</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A model asked for a source will give you one that looks right, and it can invent a reference that does not exist. A source only counts if you can find it yourself, independently of the tool.">Asking the tool for its source, then trusting that</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q5b">
      <p class="quiz__stem"><span class="quiz__num">5</span>In a prompt, which of these is the
      <em>context</em> rather than the audience?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="That is the audience: who will read the answer. Useful, but it tells the model nothing about your situation.">"Write it for a 13-year-old pupil in 2.º ESO"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="That is the format: what the answer should look like. Also worth saying, and also not the context.">"Use five bullet points, under 120 words in total"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="That is the role: who the model should write as. It is the R of the five parts.">"Answer as a geography teacher explaining to a class"</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Context is the situation around the task: what you have already tried, what you know, what it is for, what limits you have. It is what makes the answer fit you and not just fit somebody of your age.">"I have a test on Friday and mix up two stages"</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q6b">
      <p class="quiz__stem"><span class="quiz__num">6</span>The first answer is too long and uses a
      word you do not know. What is the best next message?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="A vague nudge gives the model nothing to act on. It may shorten the answer, lengthen it, or keep the hard word — you have not said which. Say what is wrong and what you want instead.">Reply "Can you do better?" and let the tool decide what to fix</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Say what is wrong, then what to do instead. The conversation keeps everything that came before, so a short precise correction beats a long new prompt every time.">"Cut it to five sentences and explain 'aeroelastic' simply"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Repeating the same prompt gets you another answer of the same kind. Nothing you said has changed, so nothing about the prediction changes much either.">Send the same prompt again and hope the next answer is better</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Starting from nothing throws away the useful part of what you already have. Iterating means improving this answer, not replacing the whole conversation.">Start a new conversation and write a completely new prompt</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q7b">
      <p class="quiz__stem"><span class="quiz__num">7</span>Which of these should never go into a
      prompt?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Personal data about another person is not yours to hand over — a name with a mark attached is exactly the case the rule exists for. Invent the names when you need a real-looking example.">A classmate's name together with the mark they got in the test</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Your own notes on a topic are fine, and pasting them in is the best way to get a summary you can actually check against something.">Your own notes on the water cycle, copied from your exercise book</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Saying what you already know is context, and it is what makes the answer fit you. It is not personal data in the sense the rule is about.">A description of what you already understand and what you do not</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="An invented character in an invented situation is exactly what you should use when you need a realistic example. That is the workaround, not the problem.">A made-up name in an invented example about a school trip</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q8b">
      <p class="quiz__stem"><span class="quiz__num">8</span>Why does this school insist on
      institutional accounts for AI activities?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Nobody is reading your conversations to mark you. The reason is data protection law and the agreement the school has with the provider.">So that teachers can read what you type and spot anyone who cheats</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Some school accounts do come with extra settings, but that is a bonus, not the reason. The reason is consent: part of a 2.º ESO group is under 14, and the school's agreement with the provider is what covers them.">Because the school's versions of the tools are safer and filter the answers</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="In Spain a person must be 14 to consent on their own to their data being processed (article 7 of the LOPDGDD), and part of a 2.º ESO group is 13. The school's account works under the school's own agreement with the provider, made for education.">Under 14 you cannot consent yourself; the school's agreement covers you</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="The law does not forbid personal accounts, and the age that matters in Spain is 14, not 16. It is about who can give consent for data to be processed, not about who may own an account.">Because the law does not allow anyone under 16 to hold a personal AI account</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <p class="quiz__score" data-score role="status" aria-live="polite"></p>
    <div class="btn-row no-print">
      <button class="btn btn--ghost btn--small" type="button" data-quiz-reset>Answer them again</button>
    </div>
  </div>
</section>

<section id="sa" class="section-open" data-session="always">
  <span class="label">Annexe A · Replaceable</span>
  <h2 class="heading">The tool this school has enabled: Copilot</h2>

  <div class="block">
    <div class="notice">
      <p><strong>This annexe is the only part of Unit 1 tied to one product.</strong> Everything else
      in the unit works with any tool that generates text. If the school changes tool, this page is
      replaced and the rest of the unit stays exactly as it is.</p>
    </div>

    <h3 class="subheading block">Signing in</h3>
    <p>Use the <strong>institutional account the school gave you</strong>, and nothing else. If you are
    already signed in with a personal account, sign out first and check which account you are using
    before you type anything: it is usually shown at the top of the window. If the account does not
    work, tell your teacher rather than reaching for another one.</p>

    <h3 class="subheading block">The five techniques of Section 7, here</h3>
    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">How each of the five study techniques is used in this tool</caption>
        <thead>
          <tr><th scope="col">Technique</th><th scope="col">How you do it here</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>1 · Summarise from a source</td>
            <td>Paste your notes into the message, or attach the file if the school's setup allows
            attachments, and ask for a summary <em>of that text only</em>.</td>
          </tr>
          <tr>
            <td>2 · Practice questions</td>
            <td>Ask in one message, with the number, the type and where the answers should go. Answer
            on paper before you look.</td>
          </tr>
          <tr>
            <td>3 · Find the gap</td>
            <td>Ask it to question you one at a time. Keep the conversation going rather than starting
            a new one for each question.</td>
          </tr>
          <tr>
            <td>4 · Plan the revision</td>
            <td>Give it the real number of evenings and the real number of minutes. A plan built on
            invented time is useless.</td>
          </tr>
          <tr>
            <td>5 · Contrast</td>
            <td>This tool can search the web and show links with its answers. That helps — and it means
            you now have two things to check, the claim and whether the link really says it.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <h3 class="subheading block">Three cautions specific to this tool</h3>
    <ul class="text-quiet">
      <li><strong>Links are not proof.</strong> When an answer comes with links, open one. A link that
      exists is not the same as a link that says what the answer claims it says. This is the best
      possible way to practise Section 4, because the checking is one click away.</li>
      <li><strong>Check which account is signed in</strong> every time, especially on a shared computer
      or a family device.</li>
      <li><strong>Features move.</strong> Buttons, menu names and what is switched on for your account
      change over time and are decided by the school. If something described here is not where it says,
      that is expected — the techniques in Section 7 do not depend on it.</li>
    </ul>

    <p class="text-quieter">Last checked against the school's configuration in September 2026. If you
    are reading this much later, assume the details have moved.</p>
  </div>
</section>

  <p class="block--tight text-quiet">In Unit 2 you stop asking a machine for text and start giving one
  instructions. It has no patterns to fall back on and no idea what you meant — which turns out to be
  much harder, and much more useful, than it sounds.</p>

<!-- ===================== 1. The machine takes you literally ===================== -->
<section id="s1" class="section-open" data-session="1">
  <span class="label">Section 1</span>
  <h2 class="heading">The machine takes you literally</h2>

  <div class="block">
    <p>In Unit 1 you worked with a machine that guesses: it predicts the most likely continuation, fills
    in whatever you left out, and produces something plausible whatever you type. This unit is about the
    opposite machine, and it is the one that actually runs everything. It guesses nothing. It fills in
    nothing. It does exactly what is written, in the order it is written, and then it stops.</p>

    <p>Have you ever given somebody directions and watched them end up somewhere else entirely? Now
    imagine giving those same directions to something with <strong>no background knowledge at all</strong>:
    it cannot picture where you mean, cannot ask what you meant, and will set off the instant you finish
    speaking.</p>

    <div class="notice">
      <p><strong>The idea the whole of computational thinking rests on.</strong> A computer is
      extraordinarily fast and extraordinarily obedient, and it has zero common sense. Precision is not
      a style choice. It is the only way anything works.</p>
    </div>

    <h3 class="subheading block">What "literally" actually costs you</h3>
    <ul>
      <li><strong>No background knowledge.</strong> It does not know that bottles have lids, that milk
      is a liquid, or that liquids are poured. Nothing is obvious to it, because nothing is anything
      to it.</li>
      <li><strong>No filling in of gaps.</strong> A person who is told to "add the flour" finds the
      flour. A machine told to add the flour has not been told where the flour is, how much, or into
      what.</li>
      <li><strong>No sense of what you obviously did not mean.</strong> If your instructions say
      something absurd, they get carried out absurdly, at full speed, without hesitation.</li>
      <li><strong>Ambiguity always turns into an error.</strong> Not sometimes. Where a person picks
      the sensible reading of two, a machine picks the one that was written.</li>
    </ul>

    <p>None of this makes machines stupid. It makes them <em>exact</em>, and exactness is what lets a
    program do the same thing correctly ten million times without getting bored. The price of that is
    paid by you, in advance, in the writing.</p>
  </div>

  <div class="activity">
    <span class="label">Activity 2.1</span>
    <h3 class="heading-2xs">The human robot</h3>
    <dl>
      <dt>Do</dt><dd>One of you becomes the robot and obeys only what is said, word for word, with no
      interpreting and no helping. The other is the programmer and talks the robot through an everyday
      task. Choose one: pour cereal and milk into a bowl · draw a face on the board · pack a bag for
      tomorrow.</dd>
      <dt>With</dt><dd>The real objects if you have them. The robot keeps their eyes on the task and
      does nothing that was not said out loud.</dd>
      <dt>How</dt><dd>In pairs, 15 minutes, then swap roles and change the task.</dd>
      <dt>Hand in</dt><dd>A <strong>logbook entry</strong> with three conclusions about giving
      instructions to a machine, each one taken from something that actually went wrong in your
      attempt, not from this page.</dd>
      <dt>Marked on</dt><dd>Whether each conclusion names a specific missing piece of information
      — "we never said to open the bottle" — rather than a general feeling like "you have to be clear".
      You will come back to these three conclusions at the end of Unit 3.</dd>
    </dl>
    <p class="text-quiet block--tight">The chaos is not the activity going wrong. The chaos is the
    activity working: every mistake the robot makes is a picture of what a computer does with a badly
    written instruction, and the class laughing is what makes it stick.</p>
  </div>
</section>

<!-- ===================== 2. Decomposition ===================== -->
<section id="s2" class="section-open" data-session="2">
  <span class="label">Section 2</span>
  <h2 class="heading">Decomposition: from one big task to many small ones</h2>

  <div class="block">
    <p>A processor does one tiny operation at a time: add two numbers, compare two values, move
    something from here to there. You cannot hand it "organise a party". So the first move, always, is
    to cut the big thing into pieces small enough to be done. That is
    <span class="term">decomposition</span>, and it is the first step of every algorithm anybody has

    <h3 class="subheading block">Why it is worth the effort</h3>
    <div class="grid-2 block">
      <div>
        <h4 class="heading-2xs">Machines need micro-steps</h4>
        <p class="text-quiet">There is no instruction called "organise a party". There is only a long
        series of things a machine can actually do, and somebody has to write them.</p>
      </div>
      <div>
        <h4 class="heading-2xs">Errors become findable</h4>
        <p class="text-quiet">When something goes wrong in twelve small steps you can say which one.
        When it goes wrong in one big step, all you know is that it went wrong.</p>
      </div>
      <div>
        <h4 class="heading-2xs">Hidden steps come out of hiding</h4>
        <p class="text-quiet">Decomposition drags into the open the things people do without noticing
        — the opening of the bottle, the switching on, the waiting.</p>
      </div>
      <div>
        <h4 class="heading-2xs">Work can be shared</h4>
        <p class="text-quiet">Once a problem is in pieces, four people can take a piece each. That is
        true of a group project and of a program.</p>
      </div>
    </div>

    <h3 class="subheading block">The golden rule</h3>
    <div class="notice">
      <p><strong>No step may contain the word "and".</strong> One constraint, and it does most of the
      teaching on its own. "Wash and cut the vegetables" is not one step, it is two wearing one coat:
      "Wash the vegetables" then "Cut the vegetables". Hunting the word "and" in your own writing trains
      you to see compound actions, which are the enemy of clear instructions and the source of a
      remarkable number of real bugs.</p>
    </div>

    <p>You will meet the same rule again in Unit 3, where it becomes "one instruction per line", and
    again in Unit 5, where a block that tries to do two things simply does not exist.</p>
  </div>

  <div class="activity">
    <span class="label">Activity 2.2</span>
    <h3 class="heading-2xs">Slice the mission</h3>
    <dl>
      <dt>Do</dt><dd>Take one mission and decompose it into at least ten micro-tasks, none of which
      contains the word "and". Missions: organise a birthday party for fifteen people · set up an
      account on a new app · pack your bag the night before an exam · cook a simple pasta dish from
      scratch.</dd>
      <dt>With</dt><dd>One sheet of A3 per pair and a pen. Paper, not a screen: it is faster to redraw
      than to reorganise.</dd>
      <dt>How</dt><dd>In pairs, 20 minutes. Then swap sheets with another pair and add every step you
      think they have assumed without writing.</dd>
      <dt>Hand in</dt><dd>A <strong>task decomposition map</strong>: the mission at the top, the
      micro-tasks branching below it, numbered in the order they have to happen, with the steps another
      pair added marked in a different colour.</dd>
      <dt>Marked on</dt><dd>The number of hidden steps you found — the ones nobody says out loud — and
      whether every task is genuinely one action. A map with the word "and" anywhere on it is not
      finished.</dd>
    </dl>
  </div>
</section>

<!-- ===================== 3. Atomic instructions ===================== -->
<section id="s3" class="section-open" data-session="2">
  <span class="label">Section 3</span>
  <h2 class="heading">One instruction, one action</h2>

  <div class="block">
    <p>Decomposition tells you how many steps there are. This section is about how to write one of them
    so that it can actually be followed. An <span class="term">atomic instruction</span> does one thing
    and one thing only — from the Greek <em>atomos</em>, meaning indivisible: something that cannot be
    cut any further without stopping being what it is.</p>

    <div class="notice">
      <p><strong>Action verb + object + detail.</strong> "Paint" is not an instruction. "Pick up the
      red pencil from the pencil case" is: the verb is <em>pick up</em>, the object is <em>the red
      pencil</em>, and the detail is <em>from the pencil case</em>. Three parts, and you can hear
      immediately when one is missing.</p>
    </div>

    <h3 class="subheading block">The five things that go wrong</h3>
    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">Five faults that stop an instruction being atomic</caption>
        <thead>
          <tr><th scope="col">Fault</th><th scope="col">What it looks like</th><th scope="col">Why a machine stops</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>No action verb</strong></td>
            <td>"Do the washing-up." "Be careful." "Handle the paperwork."</td>
            <td><em>Do</em>, <em>be</em>, <em>handle</em> and <em>sort out</em> name a result, not an
            action. There is nothing to carry out.</td>
          </tr>
          <tr>
            <td><strong>No object</strong></td>
            <td>"Pick up." "Move it." "Make it look nice."</td>
            <td>Act on what? A machine has no idea what "it" refers to unless something named it.</td>
          </tr>
          <tr>
            <td><strong>Too vague</strong></td>
            <td>"Tidy the room." "Improve the drawing."</td>
            <td>There is no version of the world in which the machine can tell whether it has finished.</td>
          </tr>
          <tr>
            <td><strong>Two actions in one</strong></td>
            <td>"Wash and cut the vegetables."</td>
            <td>Two things must be two lines, so that each can be checked, reordered or fixed on its own.</td>
          </tr>
          <tr>
            <td><strong>No criteria, amount or destination</strong></td>
            <td>"Sort the files." "Heat the milk."</td>
            <td>Sorted by what, into where? Heated how much, for how long? The machine will not choose
            for you.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p>Read those five again as a checklist rather than a list, because that is what they are. Every
    instruction you write from now on can be tested against them in about two seconds.</p>
  </div>

  <p class="text-quiet">The checker is deliberately strict about three things only: your rewrite must
  start with an action verb, must name the thing it acts on, and must not contain the word "and".
  Everything else is up to you, and there are many good answers to each line.</p>

  <div class="activity">
    <span class="label">Activity 2.3</span>

    <dl>
      <dt>Do</dt><dd>Write ten atomic instructions of your own, all from one everyday activity, each
      one with a verb, an object and a detail.</dd>
      <dt>With</dt><dd>Your exercise book. Leave the right-hand third of the page empty.</dd>
      <dt>How</dt><dd>On your own, 15 minutes. Then give the book to the person next to you, who writes
      in the empty third what a literal machine would do wrong with each line.</dd>
      <dt>Hand in</dt><dd>An <strong>instruction bank</strong> of ten lines, with your neighbour's
      objections beside them and your corrections underneath. Keep it: you will use it in Unit 3, where
      these same instructions get turned into pseudocode.</dd>
      <dt>Marked on</dt><dd>Whether the ten survive the five-fault checklist above, and whether your
      corrections answer your neighbour's objection instead of arguing with it.</dd>

<!-- ===================== 4. Order and dependencies ===================== -->
<section id="s4" class="section-open" data-session="3">
  <span class="label">Section 4</span>
  <h2 class="heading">Order and dependencies</h2>

  <div class="block">
    <p>You now have a pile of small, precise instructions. In the wrong order they are worth nothing.
    A recipe that says "serve the cake" before "mix the flour" is absurd to you and perfectly
    acceptable to a machine, which will do it and hand you a plate of nothing.</p>

    <p>In computing, instructions run in <span class="term">sequence</span>: one at a time, in the order
    they are written, top to bottom. The order is not a matter of taste. It is fixed by
    <span class="term">dependencies</span>.</p>

    <div class="notice">
      <p><strong>A dependency is when step B cannot start until step A has finished.</strong> You cannot
      log in before the app has loaded. You cannot send the message before you have written it. You
      cannot take the toast out before you put it in. Where there is a dependency, the order is forced;
      where there is not, you are free — and knowing which is which is the skill.</p>
    </div>

  <!-- ---------- Widget 1 · ordenar código desordenado ---------- -->
  <div class="widget" data-widget="order" data-id="order-atm"
       data-ok-note="Now answer the two questions underneath: which steps were forced by a dependency, and which one is a decision somebody made about people."
       data-no-note="A line marked move me breaks a dependency: it uses something that the step before it has not produced yet.">
    <div class="widget__head">
      <h3 class="widget__title">Put the cash machine back in order</h3>
      <p class="widget__intro">Eight steps for taking money out of a cash machine, shuffled. Drag a
      line to move it, or use the arrow buttons — the keyboard works too: tab to a line and press the
      up and down arrow keys.</p>
    </div>

    <ol class="order-list" data-items>
      <li data-order="1">Insert your card</li>
      <li data-order="2">Enter your PIN</li>
      <li data-order="3">Choose "Withdraw cash"</li>
      <li data-order="4">Choose the amount</li>
      <li data-order="5">Confirm the amount</li>
      <li data-order="6">Take your card</li>
      <li data-order="7">Take the cash</li>
      <li data-order="8">Take the receipt</li>
    </ol>

    <div class="btn-row">
      <button class="btn" type="button" data-check>Check the order</button>
      <button class="btn btn--ghost" type="button" data-shuffle>Shuffle again</button>
    </div>
    <p class="widget__result" data-result role="status" aria-live="polite"></p>
  </div>

  <div class="block--tight">
    <p><strong>Two questions about that machine, and the second one is the interesting one.</strong></p>
    <ol>
      <li>Which steps are forced by a dependency? You cannot enter a PIN before there is a card to
      enter it for, and there is nothing to confirm until an amount has been chosen. Those cannot
      move.</li>
      <li>Real cash machines give you the card back <em>before</em> the money, and they were changed to
      work that way on purpose. Why? Nothing forces that order — it is a decision about people, not a
      dependency. Once the cash is in your hand, the task feels finished, and cards get left behind.</li>
    </ol>
    <p class="text-quiet">That is worth remembering when the checker marks your order wrong and you
    think you are right. Some orders are forced by logic, some are chosen by a designer, and being able
    to say which kind you are looking at is more valuable than getting eight ticks.</p>
  </div>

  <div class="activity">
    <span class="label">Activity 2.4</span>
    <h3 class="heading-2xs">The scrambled code</h3>
    <dl>
      <dt>Do</dt><dd>Put a shuffled set of step cards into a working order and write one sentence for
      each card saying why it goes there. Processes: send an email with an attachment · buy something in
      an online shop · take money out of a cash machine.</dd>
      <dt>With</dt><dd>The sealed envelope of cards, a sheet of A3, and a glue stick or tape.</dd>
      <dt>How</dt><dd>Teams of three, 25 minutes. No opening the envelope before the teacher says so.</dd>
      <dt>Hand in</dt><dd>The <strong>justified sequence</strong>: the cards in order with arrows
      between them, a reason written beside every arrow, and the pairs of steps that could safely swap
      marked with a double-headed arrow.</dd>
      <dt>Marked on</dt><dd>The reasons, not the order. "It just goes there" is not a reason. A team
      that finds a genuine pair that could swap, and can say why nothing depends on it, has understood
      more than a team with a perfect order and no explanation.</dd>
    </dl>
  </div>
</section>

<!-- ===================== 5. All four at once ===================== -->
<section id="s5" class="section-open" data-session="3">
  <span class="label">Section 5 · Bridge to Unit 3</span>
  <h2 class="heading">All four at once</h2>

  <div class="block">
    <p>Four ideas, and they are always used in this order: the machine is literal, so decompose the
    task, write each piece atomically, and put the pieces in an order the dependencies allow. Here is
    the whole of this unit applied to one small job.</p>

    <span class="code-label">Attempt 1 · how a person would say it</span>
    <pre class="code code--bad code--wrap">Log in to the school computer and open your homework.</pre>
    <p class="text-quiet">One sentence, two actions, and roughly eight steps hidden inside it. A person
    manages fine. A machine has nothing to work with.</p>

    <span class="code-label">Attempt 2 · decomposed and atomic, in order</span>
    <pre class="code code--good">1  Switch the computer on
2  Wait until the login box appears
3  Type your username in the top box
4  Type your password in the bottom box
5  Press Enter
6  Wait until the desktop appears
7  Open the folder with your name on it
8  Double-click the file called homework</pre>

    <p>Every line has one verb and one object. No line contains "and". Every line depends on the one
    above it, which is why this is the only order that works: there is nothing to type into at step 3
    until step 2 has happened.</p>

    <p>Now look at the shape of what you have written. It is a numbered list of exact commands, run one
    at a time from the top. That is an <span class="term">algorithm</span>, and you have just written
    one — in English, which is where the trouble starts. English lets you write "wait until the login
    box appears" without saying how long, or what to do if it never appears.</p>

    <div class="notice">
      <p><strong>Where this goes next.</strong> Unit 3 gives you a small, strict set of words for
      writing exactly this kind of list — <code>START</code>, <code>READ</code>, <code>DISPLAY</code>,
      <code>SET</code> and a few more — so that a step cannot be vague even if you want it to be. It is
      called <span class="term">pseudocode</span>. Everything you have done in this unit is what goes
      into it: nothing new to learn about thinking, just somewhere precise to write the thinking down.</p>
    </div>
  </div>

  <div class="activity">
    <span class="label">Activity 2.5</span>
    <h3 class="heading-2xs">Hand it over</h3>
    <dl>
      <dt>Do</dt><dd>Write the full instruction list for a task another team will carry out literally,
      in front of the class, doing precisely what is written and nothing else. Tasks: make a paper
      aeroplane · draw a five-pointed star · build a tower of six cups.</dd>
      <dt>With</dt><dd>The materials for your task, in a box, unopened. Your list on one sheet, numbered,
      with no diagrams and no words on it that are not instructions.</dd>
      <dt>How</dt><dd>Teams of three, 20 minutes to write, then 5 minutes each to watch another team
      perform your list. The authors may not speak while it is being carried out.</dd>
      <dt>Hand in</dt><dd>The <strong>instruction list</strong> and, underneath it, the
      <strong>repair list</strong>: every line that had to be fixed after watching, with what was
      missing from it.</dd>
      <dt>Marked on</dt><dd>The repair list above all. Nobody writes a perfect list first time, and a
      team that names eight things it left out has learnt more than a team that insists it was right.
      Keep both lists for Unit 3.</dd>
    </dl>
  </div>
</section>

<!-- ===================== 6. Quiz ===================== -->
<section id="s6" class="section-open" data-session="3">
  <span class="label">Section 6</span>
  <h2 class="heading">Check what you know</h2>
  <p class="block--tight text-quiet">Eight questions. Every answer, right or wrong, tells you why.
  Nothing here is a mark and nobody else sees it.</p>

  <div class="quiz" data-widget="quiz">

    <div class="quiz__q" data-question="q1b">
      <p class="quiz__stem"><span class="quiz__num">1</span>A robot is told "put the milk in the bowl"
      and tries to put the sealed bottle in the bowl. What went wrong?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Nothing is broken. It did exactly what it was told, which is the one thing a machine can always be relied on to do.">The robot is faulty: a working one would have opened the bottle</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Machines are not built to guess, and you would not want one that did. A machine that guessed would be wrong in ways you could never predict.">The robot was not clever enough to guess what was meant</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="The instruction left out a step the writer thought was obvious. Nothing is obvious to a machine: opening the bottle had to be said, because a machine has no background knowledge to fill the gap with.">The instruction left out a step that seemed too obvious to say</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="It followed the instruction perfectly. That is the uncomfortable part: perfect obedience to an imperfect instruction gives you nonsense.">The robot did not understand English well enough to follow it</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q2b">
      <p class="quiz__stem"><span class="quiz__num">2</span>Which of these is an atomic instruction?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Verb, object, detail: pick up · the blue folder · from the second shelf. One action, and you can tell the moment it is finished.">"Pick up the blue folder from the second shelf"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Two actions joined by the word and. It has to become two lines, so that each one can be checked and fixed on its own.">"Open the blue folder and then print the first page"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A result, not an action. &quot;Easy to find&quot; means something different to everyone, and there is no way to tell when it is done. Say exactly what to do with the folder.">"Make the blue folder easy to find"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="An object with no verb. There is nothing here to carry out at all: it names a thing and says nothing about what to do with it.">"The blue folder, on the second shelf, please"</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q3b">
      <p class="quiz__stem"><span class="quiz__num">3</span>Why does the golden rule ban the word "and"
      inside a step?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Length is not the problem. A long instruction with one action is fine; a short one with two actions is not.">Because a step must be short, and every "and" makes it longer</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Machines process the word perfectly well. The rule is for you, not for the machine: it makes a fault in your own writing visible.">Because a machine cannot process the word "and" at all</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="It is not about English at all. The same rule applies in every language and in every programming language.">Because it is poor style: technical writing avoids joining words</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Because the word almost always hides a second action, and two actions on one line cannot be reordered, tested or fixed separately. Banning it is a quick way of catching the fault.">Because it usually means there are two actions on one line</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q4b">
      <p class="quiz__stem"><span class="quiz__num">4</span>You are decomposing "organise a class trip".
      Which of these is a genuine micro-task?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="That is another whole mission, not a step. It decomposes into at least six things: choose a company, find the price, check the date, book it, pay, confirm.">"Sort out all the transport for the day of the trip"</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="One action, one object, and you can tell when it is done. That is the size a step has to be before it is any use.">"Count the pupils who returned the permission slip"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Two actions and a hidden third: writing it, sending it, and knowing who to send it to. It has to be split.">"Write the letter to families and then send it out"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A wish, not a step. There is no action in it and no way of knowing whether it has been carried out.">"Make sure that everything goes well on the day itself"</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q5b">
      <p class="quiz__stem"><span class="quiz__num">5</span>What is a dependency?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Step B cannot start until step A has finished. Dependencies are what fix the order of a sequence — everything else in the order is a choice somebody made.">When one step cannot start until another has finished</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Importance has nothing to do with it. A trivial step can be an absolute dependency, and a vital step can often be moved.">When one step is more important than the others</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Steps that have to happen at the same moment are a different matter. A dependency is about one step having to wait for another to finish.">When two steps have to happen at exactly the same moment</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A repeated step is iteration, which you will meet in Unit 3. It is a different idea altogether.">When a step has to be repeated several times</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q6b">
      <p class="quiz__stem"><span class="quiz__num">6</span>"Heat the milk." Which fault is that?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Heat is a perfectly good action verb. The gap is everything that comes after the object.">No action verb to say what to do with it</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="The milk is the object, and it is named. What is missing is the detail.">No object saying what is to be heated</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="There is only one action here. Add the pouring on the same line and it would be compound as well.">Two separate actions on the same line</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="No criteria, amount or destination. There is a verb and there is an object, but nothing says how much, how hot or for how long — so the machine has no way of knowing when it has finished.">No amount, temperature or time given</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q7b">
      <p class="quiz__stem"><span class="quiz__num">7</span>Your list of steps runs in the wrong order
      and produces nonsense. Where do you look first?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Rewriting from scratch throws away the steps that were right and usually reintroduces the same fault. Find the broken dependency instead.">Start again and rewrite the whole list from scratch, one step at a time</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Find the first step that uses something a later step produces. That is a broken dependency, and it is the commonest ordering fault there is — in this unit and in every program you will ever write.">For a step that uses something that has not happened yet</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Worth doing, but it finds a different fault. The steps here may all be atomic and still be in the wrong order. Look for a step that needs something no earlier step has produced yet.">Check that every step contains exactly one action</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Shuffling at random may work eventually, but you will not know why, and it often breaks something that was fine. Find the broken dependency instead.">Move steps around at random until it looks right</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q8b">
      <p class="quiz__stem"><span class="quiz__num">8</span>What is the difference between the machine
      in Unit 1 and the machine in this unit?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Both produce wrong results, in different ways: one fills a gap with a plausible guess, the other follows a faulty instruction perfectly. Neither is free of mistakes.">One makes mistakes and the other never gets anything wrong</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Both units use ordinary English: the machine in this unit runs written steps in plain language. The difference is in what each machine does with the words, not in which language they are written in.">One works in plain English and the other needs a programming language</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="One predicts the most likely continuation and will fill any gap you leave with something plausible. The other follows instructions literally and fills nothing in. Knowing which one you are talking to decides how you have to write.">One predicts what you meant; the other does exactly what you wrote</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Neither of them understands anything, and that is rather the point of both units. What differs is what each one does with the words you give it.">One understands language and the other only follows rules</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <p class="quiz__score" data-score role="status" aria-live="polite"></p>
    <div class="btn-row no-print">
      <button class="btn btn--ghost btn--small" type="button" data-quiz-reset>Answer them again</button>
    </div>
  </div>
</section>

<hr class="rule" data-session="3">

<!-- ============ Close ============ -->
<section id="send" class="section-open" data-session="3">
  <span class="label">Where you are now</span>
  <h2 class="heading-sm">You can write instructions a machine could follow</h2>
  <p class="lede block">Literal machine, decomposition, atomic instructions, dependencies. Four ideas,
  and between them they turn a task in your head into a list somebody else can carry out without asking
  you a single question.</p>
  <p class="block--tight text-quiet">What you do not have yet is a language strict enough to write it
  in. English will happily let you write a vague step. Unit 3 gives you a dozen keywords that will not,
  and a way of running your own algorithm by hand to prove it works before anybody builds it.</p>
</section>

<!-- ===================== 1. Why pseudocode exists ===================== -->
<section id="s1" class="section-open" data-session="1">
  <span class="label">Section 1</span>
  <h2 class="heading">Why pseudocode exists</h2>

  <div class="block">
    <p>In Unit 2 you wrote instructions for a person who was pretending to be a machine. You found out
    how quickly ordinary language falls apart: "put the milk in the bowl" does not say which bowl, how
    much milk, or whether the lid is on. You fixed that by writing <span class="term">atomic
    instructions</span> — one action per instruction, no hidden steps.</p>

    <p>Now you need somewhere to write those instructions down so that they are precise enough for a
    machine and still readable by you. That place is <span class="term">pseudocode</span>: a way of
    writing an algorithm that follows strict rules but belongs to no programming language in
    particular.</p>

    <p>It helps to picture pseudocode as a rough plan you draw before you build — but what is really
    happening is more useful than that. Pseudocode separates the two hard things in programming so you
    can do them one at a time: <strong>working out what has to happen</strong>, and
    <strong>writing it in the exact words a particular language demands</strong>. Pseudocode is the
    first job only. When you move to blocks in Unit 5, the thinking is already done.</p>

    <div class="notice">
      <p><strong>The rule that makes the whole unit work.</strong> A machine does what is written, not
      what you meant. When your algorithm does something odd, the fault is almost never the machine
      misunderstanding you. It is your instructions saying something you did not notice you had said.</p>
    </div>

<!-- ===================== 2. Level 1 — Sequence ===================== -->
<section id="s2" class="section-open" data-session="1">
  <span class="label">Section 2 · Level 1 of 3</span>
  <h2 class="heading">Sequence: one line at a time, in order</h2>

  <div class="block">
    <p>A <span class="term">sequence</span> is the simplest structure there is: the machine runs line 1,
    then line 2, then line 3, and never changes its mind. Everything else you learn in this unit is
    built on top of it. Here are the five keywords that make a sequence.</p>

    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">The five keywords used to write a sequence in pseudocode</caption>
        <thead>
          <tr><th scope="col">Keyword</th><th scope="col">What it does</th><th scope="col">Example</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><code>START</code></td>
            <td>Marks where the algorithm begins. Nothing happens before it.</td>
            <td><code>START</code></td>
          </tr>
          <tr>
            <td><code>END</code></td>
            <td>Marks where the algorithm stops. Nothing happens after it.</td>
            <td><code>END</code></td>
          </tr>
          <tr>
            <td><code>READ</code></td>
            <td>Takes a value from outside — a person typing, a sensor, a file — and puts it in a
            variable. This is an <span class="term">input</span>.</td>
            <td><code>READ name</code></td>
          </tr>
          <tr>
            <td><code>DISPLAY</code></td>
            <td>Shows a message or a value on screen. This is an <span class="term">output</span>.</td>
            <td><code>DISPLAY "Hello"</code></td>
          </tr>
          <tr>
            <td><code>SET</code></td>
            <td>Works out a value and stores it in a variable. The old value is lost.</td>
            <td><code>SET total = price * 2</code></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="notice">
      <p><strong>A note on <code>STORE</code>.</strong> Some books, and the notes you may have from last
      year, write <code>STORE total = 0</code> instead of <code>SET total = 0</code>. The two mean
      exactly the same thing and neither is wrong. This app writes <code>SET</code> everywhere, so pick
      one and stay with it inside a single algorithm. Mixing them in one algorithm is what confuses a
      reader.</p>
    </div>

    <h3 class="subheading block">A variable is a labelled box</h3>
    <p>A <span class="term">variable</span> is a named place in memory that holds one value at a time.
    It helps to picture it as a labelled box: you write <code>age</code> on the box, and whatever you
    put in is what comes out later. But what is really happening is that the name is a label on a place,
    not on a value — so <code>SET age = 15</code> followed by <code>SET age = 16</code> leaves you with
    one box holding 16. The 15 is gone. A variable remembers only its latest value.</p>

    <p>Give variables names that say what they hold. <code>SET x = 12.5</code> tells the reader nothing;
    <code>SET billTotal = 12.5</code> tells them everything. You will be grateful for this in Section 6,
    when you have to find someone else's bug.</p>

    <h3 class="subheading block">The four rules of writing a sequence</h3>
    <ol>
      <li><strong>Begin with <code>START</code> and finish with <code>END</code>.</strong> An algorithm
      with no boundaries has no defined entry or exit point.</li>
      <li><strong>One instruction per line.</strong> "Ask for the name and greet the user" is two
      actions, so it is two lines.</li>
      <li><strong>Read a value before you use it.</strong> You cannot display <code>name</code> if
      nothing has ever put a value into <code>name</code>.</li>
      <li><strong>Indent by four spaces</strong> every line that sits inside a block. You will meet
      blocks in Section 4; the habit starts now.</li>
    </ol>

    <p class="text-quiet">In pseudocode, <code>*</code> means multiply and <code>/</code> means divide.
    Those are the symbols almost every programming environment uses, and the ones you will find again in
    Unit 5.</p>

    <span class="code-label">Worked example · greeting</span>
    <pre class="code"><span class="kw">START</span>
    <span class="kw">DISPLAY</span> <span class="str">"What is your name?"</span>
    <span class="kw">READ</span> name
    <span class="kw">DISPLAY</span> <span class="str">"Hello, "</span> + name
<span class="kw">END</span></pre>

    <p>Four lines, and every one of them earns its place. Line 2 asks the question — without it the
    person stares at a blank screen. Line 3 puts the answer in a box called <code>name</code>. Line 4
    joins two pieces of text with <code>+</code> and shows the result. Remove any line and the algorithm
    stops working.</p>

    <span class="code-label">Worked example · bill with a tip</span>
    <pre class="code"><span class="kw">START</span>
    <span class="kw">DISPLAY</span> <span class="str">"Enter the bill total in euros:"</span>
    <span class="kw">READ</span> billTotal
    <span class="kw">DISPLAY</span> <span class="str">"Enter the tip percentage:"</span>
    <span class="kw">READ</span> tipPercent
    <span class="kw">SET</span> tip = billTotal * tipPercent / 100
    <span class="kw">SET</span> total = billTotal + tip
    <span class="kw">DISPLAY</span> <span class="str">"Tip: "</span> + tip
    <span class="kw">DISPLAY</span> <span class="str">"Total to pay: "</span> + total
<span class="kw">END</span></pre>

    <p>With a bill of <span class="formula">40.00</span> and a tip of <span class="formula">10%</span>,
    the sixth line works out <span class="formula">40.00 × 10 ÷ 100 = 4.00</span> and the seventh gives
    <span class="formula">40.00 + 4.00 = 44.00</span>. Notice the order: <code>total</code> cannot be
    worked out before <code>tip</code> exists. That is a <span class="term">dependency</span>, and
    dependencies are what fix the order of a sequence. Not taste — dependencies.</p>
  </div>

  <h3 class="subheading section-open">Four mistakes that everybody makes</h3>
  <div class="grid-2 block">
    <div>
      <h4 class="heading-2xs">Forgetting <code>START</code> or <code>END</code></h4>
      <p class="text-quiet">The algorithm has no defined beginning or end, so nobody — machine or
      classmate — knows where to start reading.</p>
    </div>
    <div>
      <h4 class="heading-2xs">Vague variable names</h4>
      <p class="text-quiet"><code>SET x = 3</code> is legal and useless. In two weeks you will not
      remember what <code>x</code> held. Write <code>SET attempts = 3</code>.</p>
    </div>
    <div>
      <h4 class="heading-2xs">Two actions on one line</h4>
      <p class="text-quiet"><code>DISPLAY greeting and READ name</code> is two instructions wearing one
      coat. Split them. This is the "no and" rule from Unit 2.</p>
    </div>
    <div>
      <h4 class="heading-2xs">Using a variable before reading it</h4>
      <p class="text-quiet"><code>DISPLAY name</code> before <code>READ name</code> displays an empty
      box. This is a <span class="term">sequence error</span>, and it is the most common bug of all.</p>
    </div>
  </div>
</section>
