<!-- ===================== 3. The trace table ===================== -->
<section id="s3" class="section-open" data-session="2">
  <span class="label">Section 3 · The technique you will use in every section</span>
  <h2 class="heading">The trace table</h2>

  <div class="block">
    <p>Reading an algorithm and believing it works is not the same as knowing it works. A
    <span class="term">trace table</span> is how you find out. You become the machine: you take one
    line at a time and write down what every variable holds after that line has run.</p>

    <p>One column for each variable, plus one for anything shown on screen. One row for each line that
    runs. Nothing clever, and nothing you cannot do with a pencil. It is the single most useful habit in
    this whole unit, because it turns "it does not work" into "it stops working at line 6".</p>

    <p>Two rules, and they explain almost every mistake people make with trace tables:</p>
    <ol>
      <li><strong>A variable only changes on the line that writes to it.</strong> On every other line
      you copy the value down unchanged. It does not disappear.</li>
      <li><strong>Write a dash (—) when a variable has no value yet.</strong> A box that has never been
      filled is not the same as a box holding zero.</li>
    </ol>

    <span class="code-label">Worked example · the algorithm</span>
    <pre class="code"><span class="cmt">1</span>  <span class="kw">START</span>
<span class="cmt">2</span>      <span class="kw">SET</span> total = 0
<span class="cmt">3</span>      <span class="kw">SET</span> price = 8
<span class="cmt">4</span>      <span class="kw">SET</span> total = total + price
<span class="cmt">5</span>      <span class="kw">SET</span> price = 5
<span class="cmt">6</span>      <span class="kw">SET</span> total = total + price
<span class="cmt">7</span>      <span class="kw">DISPLAY</span> total
<span class="cmt">8</span>  <span class="kw">END</span></pre>

    <span class="code-label">Worked example · the trace</span>
    <div class="table-scroll">
      <table class="trace">
        <caption class="visually-hidden">Completed trace table for the worked example</caption>
        <thead>
          <tr>
            <th scope="col">Step</th><th scope="col">Line</th>
            <th scope="col">total</th><th scope="col">price</th><th scope="col">Output</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="trace__step">1</td><td class="trace__line">SET total = 0</td><td>0</td><td>—</td><td>—</td></tr>
          <tr><td class="trace__step">2</td><td class="trace__line">SET price = 8</td><td>0</td><td>8</td><td>—</td></tr>
          <tr><td class="trace__step">3</td><td class="trace__line">SET total = total + price</td><td>8</td><td>8</td><td>—</td></tr>
          <tr><td class="trace__step">4</td><td class="trace__line">SET price = 5</td><td>8</td><td>5</td><td>—</td></tr>
          <tr><td class="trace__step">5</td><td class="trace__line">SET total = total + price</td><td>13</td><td>5</td><td>—</td></tr>
          <tr><td class="trace__step">6</td><td class="trace__line">DISPLAY total</td><td>13</td><td>5</td><td>13</td></tr>
        </tbody>
      </table>
    </div>

    <p>Look at step 3. The line <code>SET total = total + price</code> reads the old value of
    <code>total</code> (0), adds <code>price</code> (8) and writes 8 back into <code>total</code>. The
    right-hand side is worked out first, and only then does the box change. Step 5 does the same thing
    with the new price, which is why the answer is 13 and not 16: <code>price</code> was changed at
    step 4 and the old 8 is gone for good.</p>
  </div>

<!-- ===================== 4. Level 2 — Selection ===================== -->
<section id="s4" class="section-open" data-session="2">
  <span class="label">Section 4 · Level 2 of 3</span>
  <h2 class="heading">Selection: when the algorithm has to choose</h2>

  <div class="block">
    <p>So far every algorithm you have written runs the same lines in the same order, every time. Real
    ones do not. A cash machine behaves differently when the PIN is wrong. A game behaves differently
    when your health reaches zero. That is <span class="term">selection</span>: the algorithm asks a
    question and takes one path or the other.</p>

    <p>In pseudocode it looks like this, and the shape matters as much as the words:</p>

    <span class="code-label">The shape of a decision</span>
    <pre class="code"><span class="kw">IF</span> condition <span class="kw">THEN</span>
    <span class="cmt">lines that run when the answer is yes</span>
<span class="kw">ELSE</span>
    <span class="cmt">lines that run when the answer is no</span>
<span class="kw">END IF</span></pre>

    <p>Three things are not optional. The <span class="term">condition</span> has to be a question with
    a yes or no answer — never "is it good?", always "is <code>mark</code> 5 or more?". The lines inside
    each branch are <strong>indented by four spaces</strong>, which is how a reader sees at a glance
    what is inside the decision and what comes after it. And every <code>IF</code> is closed by its own
    <code>END IF</code>. Leave that out and nobody can tell where the decision stops.</p>

    <p><code>ELSE</code> is the one part you may leave out, when there is nothing to do in the "no"
    case. Then the algorithm simply carries straight on to the line after <code>END IF</code>.</p>

    <h3 class="subheading block">Writing a condition</h3>
    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">Comparison symbols used in conditions</caption>
        <thead>
          <tr><th scope="col">Symbol</th><th scope="col">Reads as</th><th scope="col">True when</th></tr>
        </thead>
        <tbody>
          <tr><td><code>=</code></td><td>is equal to</td><td><span class="formula">mark = 10</span> and the mark is exactly 10</td></tr>
          <tr><td><code>≠</code></td><td>is not equal to</td><td><span class="formula">answer ≠ "yes"</span> and the answer is anything else</td></tr>
          <tr><td><code>&gt;</code></td><td>is greater than</td><td><span class="formula">age &gt; 13</span> and the age is 14 or more</td></tr>
          <tr><td><code>&lt;</code></td><td>is less than</td><td><span class="formula">credit &lt; 0</span> and the credit is negative</td></tr>
          <tr><td><code>≥</code></td><td>is greater than or equal to</td><td><span class="formula">mark ≥ 5</span> and the mark is 5 or more</td></tr>
          <tr><td><code>≤</code></td><td>is less than or equal to</td><td><span class="formula">attempts ≤ 3</span> and there have been at most three attempts</td></tr>
        </tbody>
      </table>
    </div>

    <p>The difference between <code>&gt;</code> and <code>≥</code> is where an enormous number of real
    bugs live. A mark of exactly 5 passes with <span class="formula">mark ≥ 5</span> and fails with
    <span class="formula">mark &gt; 5</span>. Always test your algorithm with the value sitting exactly
    on the boundary.</p>

    <span class="code-label">Worked example · pass or fail</span>
    <pre class="code"><span class="kw">START</span>
    <span class="kw">DISPLAY</span> <span class="str">"Enter your mark out of 10:"</span>
    <span class="kw">READ</span> mark
    <span class="kw">IF</span> mark &gt;= 5 <span class="kw">THEN</span>
        <span class="kw">DISPLAY</span> <span class="str">"Pass"</span>
    <span class="kw">ELSE</span>
        <span class="kw">DISPLAY</span> <span class="str">"Fail"</span>
    <span class="kw">END IF</span>
<span class="kw">END</span></pre>

    <p class="text-quiet">On paper and on a keyboard, <code>&gt;=</code> and <code>≥</code> mean the
    same thing. Write whichever your hand reaches for, but not both in one algorithm.</p>

    <h3 class="subheading block">More than two paths</h3>
    <p>A decision has exactly two outlets, yes and no. When you need three or more outcomes, you put a
    second decision inside the "no" branch of the first. Each one is closed by its own
    <code>END IF</code>, and the closing happens in reverse order — the inner decision closes first.</p>

    <span class="code-label">Worked example · three outcomes</span>
    <pre class="code"><span class="kw">START</span>
    <span class="kw">READ</span> mark
    <span class="kw">IF</span> mark &gt;= 9 <span class="kw">THEN</span>
        <span class="kw">DISPLAY</span> <span class="str">"Outstanding"</span>
    <span class="kw">ELSE</span>
        <span class="kw">IF</span> mark &gt;= 5 <span class="kw">THEN</span>
            <span class="kw">DISPLAY</span> <span class="str">"Pass"</span>
        <span class="kw">ELSE</span>
            <span class="kw">DISPLAY</span> <span class="str">"Fail"</span>
        <span class="kw">END IF</span>
    <span class="kw">END IF</span>
<span class="kw">END</span></pre>

    <p>Read the indentation, not just the words: the second <code>IF</code> is eight spaces in, which
    tells you it only ever runs when the first condition was false. A mark of 9 never reaches it.</p>
  </div>

  <!-- ---------- Widget 1, second instance ---------- -->
  <div class="widget" data-widget="order" data-id="order-ticket">
    <div class="widget__head">
      <h3 class="widget__title">Rebuild the decision</h3>
      <p class="widget__intro">A cinema charges 5.00 for anyone under 14 and 8.50 for everyone else.
      These lines have been shuffled. Put them back, and watch the indentation: the indented lines
      belong inside the decision, so they cannot end up outside it.</p>
    </div>

    <ol class="order-list" data-items>
      <li data-order="1">START</li>
      <li data-order="2">DISPLAY "How old are you?"</li>
      <li data-order="3">READ age</li>
      <li data-order="4">IF age &lt; 14 THEN</li>
      <li data-order="5">    SET price = 5.00</li>
      <li data-order="6">ELSE</li>
      <li data-order="7">    SET price = 8.50</li>
      <li data-order="8">END IF</li>
      <li data-order="9">DISPLAY "You pay: " + price</li>
      <li data-order="10">END</li>
    </ol>

    <div class="btn-row">
      <button class="btn" type="button" data-check>Check the order</button>
      <button class="btn btn--ghost" type="button" data-shuffle>Shuffle again</button>
    </div>
    <p class="widget__result" data-result role="status" aria-live="polite"></p>
  </div>

  <div class="notice">
    <p><strong>Why this section comes before debugging.</strong> You are about to hunt for bugs in
    someone else's algorithm, and the missing <code>END IF</code> is one of the classics. You cannot
    find a missing <code>END IF</code> in a structure nobody has ever shown you — so now you have seen
    it, written it and put it back together.</p>
  </div>
</section>

<!-- ===================== 5. Level 3 — Iteration ===================== -->
<section id="s5" class="section-open" data-session="3">
  <span class="label">Section 5 · Level 3 of 3</span>
  <h2 class="heading">Iteration: doing the same thing again</h2>

  <div class="block">
    <p>Copying a line out ten times works, until you need it eleven times, or a number of times you do
    not know in advance. <span class="term">Iteration</span> is the structure that repeats a block of
    lines. The block that gets repeated is called a <span class="term">loop</span>.</p>

    <p>You need two kinds, and the difference between them is simply <em>what decides when to stop</em>.</p>

    <h3 class="subheading block">When you know how many times: <code>REPEAT n TIMES</code></h3>
    <span class="code-label">Worked example · a countdown</span>
    <pre class="code"><span class="kw">START</span>
    <span class="kw">SET</span> count = 3
    <span class="kw">REPEAT</span> 3 <span class="kw">TIMES</span>
        <span class="kw">DISPLAY</span> count
        <span class="kw">SET</span> count = count - 1
    <span class="kw">END REPEAT</span>
    <span class="kw">DISPLAY</span> <span class="str">"Go!"</span>
<span class="kw">END</span></pre>

    <p>Three lines are shown on screen — 3, 2, 1 — and then "Go!". The number of passes is fixed before
    the loop starts. Nothing that happens inside can change it.</p>

    <h3 class="subheading block">When you do not: <code>WHILE … DO</code></h3>
    <p>A <code>WHILE</code> loop checks a condition <strong>before every pass</strong>. If the condition
    is true, it runs the block and comes back to check again. As soon as the condition is false, the
    loop ends and the algorithm carries on at the line after <code>END WHILE</code>.</p>

    <span class="code-label">Worked example · three tries at a password</span>
    <pre class="code"><span class="kw">START</span>
    <span class="kw">SET</span> attempts = 0
    <span class="kw">SET</span> unlocked = <span class="str">"no"</span>
    <span class="kw">WHILE</span> attempts &lt; 3 <span class="kw">AND</span> unlocked = <span class="str">"no"</span> <span class="kw">DO</span>
        <span class="kw">DISPLAY</span> <span class="str">"Enter your PIN:"</span>
        <span class="kw">READ</span> pin
        <span class="kw">SET</span> attempts = attempts + 1
        <span class="kw">IF</span> pin = storedPIN <span class="kw">THEN</span>
            <span class="kw">SET</span> unlocked = <span class="str">"yes"</span>
        <span class="kw">END IF</span>
    <span class="kw">END WHILE</span>
    <span class="kw">IF</span> unlocked = <span class="str">"yes"</span> <span class="kw">THEN</span>
        <span class="kw">DISPLAY</span> <span class="str">"Welcome."</span>
    <span class="kw">ELSE</span>
        <span class="kw">DISPLAY</span> <span class="str">"Card retained."</span>
    <span class="kw">END IF</span>
<span class="kw">END</span></pre>

    <p>This is a real cash machine, written in ten lines. Notice that the loop has a decision inside it
    and a decision after it, each indented to show where it belongs, and each closed by its own
    <code>END IF</code>. Notice too that <code>attempts</code> goes up on every pass — that line is what
    guarantees the loop eventually stops.</p>

    <h3 class="subheading block">The infinite loop</h3>
    <p>An <span class="term">infinite loop</span> is a loop whose condition never becomes false. The
    algorithm never reaches the line after it. This is not a rare accident: it is the classic beginner
    bug, and you will write one this year.</p>

    <div class="split block">
      <div>
        <span class="code-label">Never ends</span>
        <pre class="code code--bad"><span class="kw">SET</span> count = 1
<span class="kw">WHILE</span> count &lt;= 5 <span class="kw">DO</span>
    <span class="kw">DISPLAY</span> count
<span class="kw">END WHILE</span></pre>
        <p class="text-quiet">Nothing inside the loop ever changes <code>count</code>, so the condition
        <span class="formula">count ≤ 5</span> is true forever. The screen fills with 1.</p>
      </div>
      <div>
        <span class="code-label">Ends after five passes</span>
        <pre class="code code--good"><span class="kw">SET</span> count = 1
<span class="kw">WHILE</span> count &lt;= 5 <span class="kw">DO</span>
    <span class="kw">DISPLAY</span> count
    <span class="kw">SET</span> count = count + 1
<span class="kw">END WHILE</span></pre>
        <p class="text-quiet">One extra line, and the condition is now able to become false. Every
        <code>WHILE</code> you write needs something inside it that moves towards the exit.</p>
      </div>
    </div>

    <p>There is a famous joke about the instructions on a bottle of shampoo — "lather, rinse, repeat" —
    which, read exactly as written, is an infinite loop. It is funny because it is precisely the mistake
    a machine would make: the instruction never says when to stop, and a machine never decides that for
    itself.</p>
  </div>

  <!-- ---------- Widget 2, second instance ---------- -->
  <div class="widget" data-widget="trace" data-id="trace-while">
    <div class="widget__head">
      <h3 class="widget__title">Trace a loop, pass by pass</h3>
      <p class="widget__intro">When a loop is involved, a trace table has one row per
      <strong>pass</strong> through the loop. The condition is checked at the start of every pass —
      including the one where it turns out to be false, which is the pass that ends the loop. Pass 1 is
      done for you. Write <code>yes</code> or <code>no</code> in the condition column.</p>
    </div>

    <pre class="code"><span class="cmt">1</span>  <span class="kw">START</span>
<span class="cmt">2</span>      <span class="kw">SET</span> count = 1
<span class="cmt">3</span>      <span class="kw">SET</span> total = 0
<span class="cmt">4</span>      <span class="kw">WHILE</span> count &lt;= 3 <span class="kw">DO</span>
<span class="cmt">5</span>          <span class="kw">SET</span> total = total + count
<span class="cmt">6</span>          <span class="kw">SET</span> count = count + 1
<span class="cmt">7</span>      <span class="kw">END WHILE</span>
<span class="cmt">8</span>      <span class="kw">DISPLAY</span> total
<span class="cmt">9</span>  <span class="kw">END</span></pre>

    <div class="table-scroll">
      <table class="trace">
        <caption class="visually-hidden">Trace table with one row per pass through the loop</caption>
        <thead>
          <tr>
            <th scope="col">Pass</th>
            <th scope="col">count at the start</th>
            <th scope="col">count ≤ 3?</th>
            <th scope="col">total after the pass</th>
            <th scope="col">count after the pass</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="trace__step">1</td>
            <td data-fixed="true">1</td><td data-fixed="true">yes</td>
            <td data-fixed="true">1</td><td data-fixed="true">2</td>
          </tr>
          <tr>
            <td class="trace__step">2</td>
            <td data-answer="2" data-label="Pass 2, count at the start"></td>
            <td data-answer="yes|true|y" data-label="Pass 2, condition"></td>
            <td data-answer="3" data-label="Pass 2, total after the pass"></td>
            <td data-answer="3" data-label="Pass 2, count after the pass"></td>
          </tr>
          <tr>
            <td class="trace__step">3</td>
            <td data-answer="3" data-label="Pass 3, count at the start"></td>
            <td data-answer="yes|true|y" data-label="Pass 3, condition"></td>
            <td data-answer="6" data-label="Pass 3, total after the pass"></td>
            <td data-answer="4" data-label="Pass 3, count after the pass"></td>
          </tr>
          <tr>
            <td class="trace__step">4</td>
            <td data-answer="4" data-label="Pass 4, count at the start"></td>
            <td data-answer="no|false|n" data-label="Pass 4, condition"></td>
            <td data-answer="6" data-label="Pass 4, total after the pass"></td>
            <td data-answer="4" data-label="Pass 4, count after the pass"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="btn-row">
      <button class="btn" type="button" data-check>Check my trace</button>
      <button class="btn btn--ghost" type="button" data-clear>Clear</button>
      <button class="btn btn--ghost" type="button" data-reveal>Show the answer</button>
    </div>
    <p class="widget__result" data-result role="status" aria-live="polite"></p>
    <p class="text-quiet block--tight">Pass 4 never runs the lines inside the loop, because the
    condition is already false when it is checked. That is why <code>total</code> and <code>count</code>
    do not change on that row — and why line 8 displays the last value your table shows for
    <code>total</code>.</p>
  </div>
</section>

<!-- ===================== 6. Debugging ===================== -->
<section id="s6" class="section-open" data-session="3">
  <span class="label">Section 6</span>
  <h2 class="heading">Debugging: reading what you wrote, not what you meant</h2>

  <div class="block">
    <p>Every programmer writes algorithms with bugs in them. A <span class="term">bug</span> is an error
    in the algorithm, and <span class="term">debugging</span> is the systematic business of finding and
    fixing one. It is not a sign that you are bad at this. It is most of the job.</p>

    <p>What makes debugging hard is that you read your own algorithm as you intended it. The machine
    reads it as it is written. A trace table is the tool that forces you to read it the second way, and
    that is why you learnt it before you got here.</p>

    <h3 class="subheading block">The four kinds of bug</h3>
    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">The four kinds of bug, with a symptom and an example of each</caption>
        <thead>
          <tr><th scope="col">Kind</th><th scope="col">What has gone wrong</th><th scope="col">How you notice</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="term">syntax error</span></td>
            <td>A keyword is misspelt or a structure is left open — <code>DISPALY</code>, or an
            <code>IF</code> with no <code>END IF</code>.</td>
            <td>The algorithm cannot even be followed. A human compiler stops at that line.</td>
          </tr>
          <tr>
            <td><span class="term">logic error</span></td>
            <td>Every line is legal and the algorithm runs to the end, but the answer is wrong —
            <code>&gt;</code> where you needed <code>≥</code>.</td>
            <td>Only a trace table with well-chosen test values finds it. The most dangerous kind.</td>
          </tr>
          <tr>
            <td><span class="term">sequence error</span></td>
            <td>The lines are right but the order is wrong, so a dependency is broken — using a variable
            before it is read.</td>
            <td>An empty value turns up where you expected a number.</td>
          </tr>
          <tr>
            <td><span class="term">missing step</span></td>
            <td>An instruction was never written at all — nothing ever increases the counter in a
            <code>WHILE</code>.</td>
            <td>The algorithm gets stuck, or stops early, or produces nonsense.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <h3 class="subheading block">How to debug, in three steps</h3>
    <ol>
      <li><strong>Read the whole thing first.</strong> Never fix as you read. Work out what the
      algorithm is supposed to do before you hunt for what it does.</li>
      <li><strong>Trace it with a simple test value.</strong> Choose something easy to check by hand,
      and something exactly on a boundary. Write the table.</li>
      <li><strong>Fix one bug, then trace again.</strong> A fix can create a new bug. One change, one
      trace, every time.</li>
    </ol>

    <h3 class="subheading section-open">A broken algorithm: the vending machine</h3>
    <p>This algorithm is supposed to take a selection, take the coins, hand over the item and give the
    change. It has five bugs. Read it all the way through before you look for them.</p>

    <span class="code-label">The buggy version</span>
    <pre class="code code--bad"><span class="cmt">1</span>  <span class="kw">START</span>
<span class="cmt">2</span>      <span class="kw">DISPLAY</span> <span class="str">"Select your item:"</span>
<span class="cmt">3</span>      <span class="kw">SET</span> selection
<span class="cmt">4</span>      <span class="kw">DISPLAY</span> <span class="str">"Insert coins:"</span>
<span class="cmt">5</span>      <span class="kw">SET</span> coinsInserted
<span class="cmt">6</span>      <span class="kw">IF</span> coinsInserted &gt;= itemPrice
<span class="cmt">7</span>          <span class="kw">SET</span> change = coinsInserted - itemPrice
<span class="cmt">8</span>          <span class="kw">DISPLAY</span> <span class="str">"Here is your item."</span>
<span class="cmt">9</span>          <span class="kw">DISPLAY</span> <span class="str">"Your change is: "</span> + change
<span class="cmt">10</span> <span class="kw">END</span></pre>

    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">The five bugs in the vending machine algorithm</caption>
        <thead>
          <tr><th scope="col">Line</th><th scope="col">Bug</th><th scope="col">Kind</th><th scope="col">Why it breaks</th></tr>
        </thead>
        <tbody>
          <tr><td>3 and 5</td><td><code>SET</code> used where the value comes from outside</td><td>syntax error</td><td><code>SET</code> needs a value on the right. Taking a value from a person is <code>READ</code>.</td></tr>
          <tr><td>before 6</td><td><code>itemPrice</code> is never given a value</td><td>missing step</td><td>The condition compares the coins against an empty box, so its answer means nothing.</td></tr>
          <tr><td>6</td><td><code>THEN</code> is missing</td><td>syntax error</td><td>Without it the line is not a complete decision.</td></tr>
          <tr><td>after 9</td><td>no <code>ELSE</code></td><td>missing step</td><td>Put in too little money and the machine says nothing at all and keeps your coins.</td></tr>
          <tr><td>after 9</td><td>no <code>END IF</code></td><td>syntax error</td><td>Nothing says where the decision stops, so nobody can tell what is inside it.</td></tr>
        </tbody>
      </table>
    </div>

    <span class="code-label">The fixed version</span>
    <pre class="code code--good"><span class="kw">START</span>
    <span class="kw">DISPLAY</span> <span class="str">"Select your item:"</span>
    <span class="kw">READ</span> selection
    <span class="kw">SET</span> itemPrice = priceOf(selection)
    <span class="kw">DISPLAY</span> <span class="str">"Insert coins:"</span>
    <span class="kw">READ</span> coinsInserted
    <span class="kw">IF</span> coinsInserted &gt;= itemPrice <span class="kw">THEN</span>
        <span class="kw">SET</span> change = coinsInserted - itemPrice
        <span class="kw">DISPLAY</span> <span class="str">"Here is your item: "</span> + selection
        <span class="kw">DISPLAY</span> <span class="str">"Your change is: "</span> + change
    <span class="kw">ELSE</span>
        <span class="kw">DISPLAY</span> <span class="str">"Not enough money. Returning your coins."</span>
    <span class="kw">END IF</span>
<span class="kw">END</span></pre>

    <p><code>priceOf(selection)</code> stands for "look the price up somewhere". You will meet the real
    version of that idea later; for now it is enough that the algorithm says clearly where the value
    comes from, instead of pretending it was always there.</p>
  </div>

  <div class="activity">
    <span class="label">Activity 3.2</span>
    <h3 class="heading-2xs">Paper escape room — the broken algorithm</h3>
    <dl>
      <dt>Do</dt><dd>Find the five bugs hidden in the algorithm in your envelope, correct them, and
      write a bug report that names each one.</dd>
      <dt>With</dt><dd>The envelope from your teacher, one sheet of paper per team, and a trace table
      for at least one of the five bugs.</dd>
      <dt>How</dt><dd>Teams of three, in 25 minutes.</dd>
      <dt>Hand in</dt><dd>A <strong>bug report</strong>: five entries, each giving the line number, the
      kind of bug from the table above, what went wrong, and how you fixed it.</dd>
      <dt>Marked on</dt><dd>Whether each entry names the right kind of bug and explains the effect, not
      just the fix. "Missing <code>END IF</code>" is half an answer; "missing <code>END IF</code>, so
      the last two lines run even when the condition is false" is a whole one.</dd>
    </dl>
  </div>
</section>

<!-- ============ 7. The same algorithm, three ways ============ -->
<section id="s7" class="section-open" data-session="4">
  <span class="label">Section 7 · Bridge to Units 4 and 5</span>
  <h2 class="heading">The same algorithm, three ways</h2>

  <div class="block">
    <p>A flowchart is not a different algorithm, and neither is a program. They are three ways of
    writing down the same thinking. Here is the pass-or-fail decision from Section 4, in all three — so
    that when Unit 4 asks you to draw a diamond, you already know what is inside it.</p>

    <div class="split block">
      <div>
        <span class="code-label">1 · As pseudocode</span>
        <pre class="code"><span class="kw">START</span>
    <span class="kw">READ</span> mark
    <span class="kw">IF</span> mark &gt;= 5 <span class="kw">THEN</span>
        <span class="kw">DISPLAY</span> <span class="str">"Pass"</span>
    <span class="kw">ELSE</span>
        <span class="kw">DISPLAY</span> <span class="str">"Fail"</span>
    <span class="kw">END IF</span>
<span class="kw">END</span></pre>
      </div>

      <div>
        <span class="code-label">2 · As a flowchart · Unit 4</span>

               aria-labelledby="flow-title flow-desc">

            If yes, display Pass. If no, display Fail. Both paths join and reach End.</desc>

              </marker>
            </defs>

               marker-end="url(#flow-arrow)" stroke-linecap="round">

              <path d="M73,260 V296 H230 V322"></path>

            </g>
            <g fill="none" stroke="currentColor" stroke-width="1.5">

    <span class="code-label">3 · As blocks · Unit 5</span>
    <div class="blocks" role="img"
         aria-label="The same algorithm built from coloured programming blocks: when the program starts, ask for the mark and wait, then an if-else block testing whether the answer is 5 or more, saying Pass in the first branch and Fail in the second.">
      <div class="blk blk--event">when the program starts</div>
      <div class="blk blk--io">ask <span class="blk__slot">"Enter your mark out of 10:"</span> and wait</div>
      <div class="blk blk--io">set <span class="blk__slot">mark</span> to <span class="blk__slot">answer</span></div>
      <div class="blk blk--ctrl">if <span class="blk__slot">mark ≥ 5</span> then</div>
      <div class="blk blk--io blk--nested">say <span class="blk__slot">"Pass"</span></div>
      <div class="blk blk--ctrl">else</div>
      <div class="blk blk--io blk--nested">say <span class="blk__slot">"Fail"</span></div>
      <div class="blk blk--ctrl">end</div>
    </div>

    <p class="block--tight">Count the lines: the pseudocode has eight and so does the block version. The
    indentation you have been insisting on is the same thing as a block sitting inside the jaws of
    another block — the shape of the blocks makes it impossible to forget the <code>END IF</code>,
    because the block draws it for you.</p>

    <div class="notice">
      <p><strong>Where this goes next.</strong> Unit 4 turns this into flowcharts properly, with the
      three structures you now know: sequence, selection and iteration. Unit 5 turns it into something
      that actually runs. Neither of them asks you to think about the problem again — you did that
      here.</p>
    </div>

<section id="s8" class="section-open" data-session="always">
  <span class="label">Section 8</span>
  <h2 class="heading">Team missions</h2>

  <div class="block">
    <p>Everything from Unit 2 and Unit 3 now goes into one piece of work: decomposition, atomic
    instructions, sequence, selection, iteration and a trace table to prove it. Your team picks one
    mission and writes the full algorithm on a large sheet of card. Another team will read it line by
    line and try to break it.</p>

        <p class="text-quiet">Withdrawing money, from card to receipt. Three attempts at the PIN and
        then the card is kept; a balance check before any money is handed over. The loop from Section 5
        is your starting point, not your finished answer.</p>

        given a warning, or blocked. Decide what happens on appeal and when a person — not the
        algorithm — has to look at it.</p>

        <h3 class="heading-2xs block--tight">Mission 4 · Split the bill</h3>
        <p class="text-quiet">A group meal, an optional tip and an unknown number of people. Read the
        number of diners, loop to add up what each one owes, and display the share. The simplest
        mission, and the easiest to get exactly right.</p>

    <div class="activity">
      <span class="label">Activity 3.3</span>
      <h3 class="heading-2xs">Algorithm hackathon</h3>
      <dl>
        <dt>Do</dt><dd>Write the complete algorithm for your chosen mission in pseudocode, and trace it
        with two different test cases — one ordinary, one awkward.</dd>
        <dt>With</dt><dd>One large sheet of card, a marker pen, and the reference card in Section 9.</dd>
        <dt>How</dt><dd>Teams of three, in one 50-minute session: 5 minutes reading the mission,
        10 decomposing, 20 writing, 10 tracing, 5 tidying up for display.</dd>
        <dt>Hand in</dt><dd>The <strong>algorithm poster</strong>, with your names, a title, correct
        indentation, and the two trace tables in a corner of the card.</dd>
        <dt>Marked on</dt><dd>Completeness (every path ends somewhere), precision (one action per line,
        keywords used correctly, every block closed) and correct sequence (nothing used before it
        exists). The awkward test case is worth as much as the ordinary one.</dd>
      </dl>
    </div>

    <div class="activity">
      <span class="label">Activity 3.4</span>
      <h3 class="heading-2xs">The algorithm fair</h3>
      <dl>
        <dt>Do</dt><dd>Visit three posters that are not yours. Read each algorithm line by line as a
        human compiler and trace it with your own test value.</dd>
        <dt>With</dt><dd>Sticky notes. One presenter stays with each poster and may record suggestions
        but may not change the algorithm during the fair.</dd>
        <dt>How</dt><dd>Whole class, 30 minutes, then 10 minutes back at your own poster.</dd>
        <dt>Hand in</dt><dd>Three <strong>bug reports</strong> on sticky notes, each naming the line,
        the kind of bug and a suggested fix. A report that says only "this is wrong" does not count.</dd>
        <dt>Marked on</dt><dd>Whether your report is specific enough that the other team can act on it
        without asking you what you meant.</dd>
      </dl>
    </div>

<!-- ============ 9. Reference card ============ -->
<section id="s9" class="section-open" data-session="always">
  <span class="label">Section 9</span>
  <h2 class="heading">Pseudocode reference card</h2>
  <p class="block--tight text-quiet">One page, everything you need. Print it, fold it and keep it in
  your exercise book — you will use it in Units 4 and 5 as well.</p>

  <div class="btn-row no-print">
    <button class="btn" type="button" data-print-refcard>Print the reference card</button>
  </div>

  <div class="refcard-page">
    <div class="refcard">
      <h3 class="heading-2xs">Pseudocode reference card · 2.º ESO</h3>

      <div class="refcard__grid">
        <div class="refcard__group">
          <h4>Sequence</h4>
          <dl>
            <dt>START</dt><dd>Where the algorithm begins</dd>
            <dt>END</dt><dd>Where it stops</dd>
            <dt>READ x</dt><dd>Take a value from outside into <em>x</em></dd>
            <dt>DISPLAY x</dt><dd>Show a value or a message</dd>
            <dt>SET x = …</dt><dd>Work out a value and store it in <em>x</em></dd>
          </dl>
        </div>

        <div class="refcard__group">
          <h4>Selection</h4>
          <dl>
            <dt>IF … THEN</dt><dd>Opens a decision</dd>
            <dt>ELSE</dt><dd>What to do when the answer is no. Optional</dd>
            <dt>END IF</dt><dd>Closes the decision. Never optional</dd>
          </dl>
        </div>

        <div class="refcard__group">
          <h4>Iteration</h4>
          <dl>
            <dt>REPEAT n TIMES</dt><dd>Repeat exactly <em>n</em> times</dd>
            <dt>END REPEAT</dt><dd>Closes it</dd>
            <dt>WHILE … DO</dt><dd>Repeat while the condition is true</dd>
            <dt>END WHILE</dt><dd>Closes it</dd>
          </dl>
        </div>

        <div class="refcard__group">
          <h4>Comparing</h4>
          <dl>
            <dt>=</dt><dd>is equal to</dd>
            <dt>≠</dt><dd>is not equal to</dd>
            <dt>&gt; &nbsp; &lt;</dt><dd>greater than · less than</dd>
            <dt>≥ &nbsp; ≤</dt><dd>or equal to</dd>
            <dt>AND &nbsp; OR</dt><dd>join two conditions</dd>
          </dl>
        </div>

        <div class="refcard__group">
          <h4>Arithmetic</h4>
          <dl>
            <dt>+ &nbsp; -</dt><dd>add · subtract</dd>
            <dt>* &nbsp; /</dt><dd>multiply · divide</dd>
            <dt>+</dt><dd>also joins text: <em>"Hello, " + name</em></dd>
          </dl>
        </div>

        <div class="refcard__group">
          <h4>The four kinds of bug</h4>
          <dl>
            <dt>syntax</dt><dd>Misspelt keyword, block left open</dd>
            <dt>logic</dt><dd>Runs fine, wrong answer</dd>
            <dt>sequence</dt><dd>Right lines, wrong order</dd>
            <dt>missing step</dt><dd>An instruction was never written</dd>
          </dl>
        </div>
      </div>

      <div class="refcard__grid" style="margin-top:24px">
        <div class="refcard__group">
          <h4>The rules</h4>
          <ol class="text-quiet" style="font-size:15px">
            <li>Begin with START, finish with END</li>
            <li>One action per line</li>
            <li>Read a value before you use it</li>
            <li>Indent four spaces inside a block</li>
            <li>Close every block you open</li>
            <li>Name variables so a stranger understands them</li>
          </ol>
        </div>
        <div class="refcard__group">
          <h4>Trace table</h4>
          <ol class="text-quiet" style="font-size:15px">
            <li>One column per variable, plus one for the output</li>
            <li>One row per line that runs — or per pass, in a loop</li>
            <li>A variable changes only on the line that writes to it</li>
            <li>Copy every other value down unchanged</li>
            <li>A dash means "no value yet". It is not zero</li>
            <li>Test the value exactly on the boundary</li>
          </ol>
        </div>
      </div>

      <p class="text-quieter" style="margin-top:18px;font-size:13px">Technology and Digitalisation ·
      2.º ESO · Unit 3, Writing Pseudocode</p>
    </div>
  </div>
</section>

<!-- ============ 10. Quiz ============ -->
<section id="s10" class="section-open" data-session="4">
  <span class="label">Section 10</span>
  <h2 class="heading">Check what you know</h2>
  <p class="block--tight text-quiet">Eight questions. Every answer, right or wrong, tells you why.
  Nothing here is a mark and nobody else sees it.</p>

  <div class="quiz" data-widget="quiz">

    <div class="quiz__q" data-question="q1b">
      <p class="quiz__stem"><span class="quiz__num">1</span>Which line has to come before
      <code>DISPLAY "Hello, " + name</code> for the algorithm to work?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="That asks the question but never keeps the answer. DISPLAY only shows things on the screen; nothing here puts a value into the box called name.">DISPLAY "What is your name?"</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="That fills the box with 0, so the greeting would say &quot;Hello, 0&quot;. The box needs the person's real name, and the only line that brings in a value from outside is READ.">SET name = 0</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="DISPLAY name only shows what is already in the box. It never fills it, so this would display an empty value twice instead of once.">DISPLAY name</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="READ name is what puts a value into the box called name. Until something writes to it, the box is empty and the greeting has nothing to join on to.">READ name</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q2b">
      <p class="quiz__stem"><span class="quiz__num">2</span>After <code>SET total = 0</code>, then
      <code>SET total = total + 7</code>, then <code>SET total = total + 3</code>, what does
      <code>total</code> hold?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="3 is what you get if you think each SET replaces the box with the number on the line. It does not: total + 3 uses whatever total already held.">3</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="7 is the value after the second line. The third line runs too, and it adds 3 more.">7</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Each line works out the right-hand side first and writes the result back: 0, then 0 + 7 = 7, then 7 + 3 = 10.">10</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="73 is what you would get by joining 7 and 3 as if they were text. SET total = total + 3 adds numbers: 0 + 7 + 3.">73</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q3b">
      <p class="quiz__stem"><span class="quiz__num">3</span>An algorithm says
      <code>IF mark &gt; 5 THEN DISPLAY "Pass"</code>. A student has a mark of exactly 5. What happens?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="There is no ELSE in this line, so there is nothing to display in the no case.">"Fail" is displayed, because 5 is not a pass</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="The condition is strictly greater than, so 5 is not greater than 5 and the condition is false. This is the classic boundary bug — and it is a logic error, because the algorithm runs perfectly and still gets it wrong.">Nothing is displayed, because the condition is false</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="That would happen with mark &gt;= 5. The symbol on this line does not include the boundary value.">"Pass" is displayed, because 5 is enough to pass</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Nothing stops here. A decision with no ELSE simply carries on at the line after END IF.">The algorithm stops with an error, as 5 matches neither case</button></li>
      </ul>

    </div>

    <div class="quiz__q" data-question="q4b">
      <p class="quiz__stem"><span class="quiz__num">4</span>Why does this loop never end?
      <code>SET n = 1</code> · <code>WHILE n &lt;= 5 DO</code> · <code>DISPLAY n</code> ·
      <code>END WHILE</code></p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="Nothing inside the loop changes n, so the condition 1 ≤ 5 is true on every pass, forever. Every WHILE needs a line inside it that moves towards the exit.">Nothing inside the loop changes the value of <code>n</code></button></li>
        <li><button class="quiz-option" type="button"

        <li><button class="quiz-option" type="button"
            data-feedback="Changing the comparison only changes how many times the loop would run if it ended. It never ends because n never changes, whichever comparison you use.">The condition should say <code>n &lt; 5</code>, not <code>n &lt;= 5</code></button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="With only one line inside the loop there is nothing to put in a different order. The loop is stuck because nothing ever moves n towards the exit.">The <code>DISPLAY</code> line is in the wrong place in the loop</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q5b">
      <p class="quiz__stem"><span class="quiz__num">5</span>An algorithm runs from START to END with no
      trouble at all, and gives the wrong total. What kind of bug is that?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="A syntax error would stop a human compiler at the faulty line. This algorithm reaches END, so its keywords and structures are fine.">A syntax error</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="A logic error: every line is legal, so nothing complains, and only a trace table with well-chosen test values will show you where the value first goes wrong. It is the most dangerous kind precisely because it hides.">A logic error</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A missing step usually shows up as an algorithm that gets stuck, stops early or produces nonsense. This one runs smoothly to END, which is the signature of a logic error.">A missing step</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A sequence error is one particular way of producing a wrong answer, but you cannot tell from the description alone whether the order is at fault. Logic error is the name for the symptom described.">A sequence error</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q6b">
      <p class="quiz__stem"><span class="quiz__num">6</span>In a trace table, what do you write in the
      column for <code>price</code> on a line that does not mention <code>price</code>?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="Leaving it blank suggests the box is empty, which it is not. Blank and zero and 'unchanged' are three different things, and mixing them up is what makes a trace table useless.">Leave the cell blank until price changes</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Zero is a value like any other. Writing it here would mean a line had set price to zero, and none did.">Write 0 until the line changes price</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="A dash means the variable has never been given a value. Once it has one, it keeps it.">Put a dash to show nothing has happened</button></li>
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="You copy the value down unchanged. A variable keeps whatever it holds until a line writes to it — that is exactly what memory does.">Copy the value from the row above</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q7b">
      <p class="quiz__stem"><span class="quiz__num">7</span>What is <code>END IF</code> for?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button" data-correct
            data-feedback="It marks where the decision stops, so the reader knows which lines are inside it and which run either way. Leave it out and the last lines of the branch appear to belong to everybody.">It says where the decision stops</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="END on its own ends the algorithm. END IF ends only the decision, and the algorithm carries on at the next line.">It ends the whole algorithm</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="That is what ELSE does. END IF comes after the ELSE branch, not instead of it.">It gives the answer for the no case</button></li>
        <li><button class="quiz-option" type="button"
            data-feedback="Indentation helps a human read the structure, but it is not what closes it. A block needs both: the indentation and the closing keyword.">It is optional, because indentation shows it</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <div class="quiz__q" data-question="q8b">
      <p class="quiz__stem"><span class="quiz__num">8</span>You are writing an algorithm that keeps
      asking for a password until the person gets it right. Which structure do you need?</p>
      <ul class="quiz__options">
        <li><button class="quiz-option" type="button"
            data-feedback="An IF asks once and moves on. It can decide whether the password was right, but it cannot ask again.">An <code>IF … THEN</code> on its own</button></li>
        <li><button class="quiz-option" type="button"

            data-feedback="REPEAT n TIMES needs the number of passes fixed before the loop starts. Here it depends on what the person types, so the number is not known.">A <code>REPEAT n TIMES</code> loop</button></li>
      </ul>
      <p class="quiz__feedback" data-feedback-box hidden></p>
    </div>

    <p class="quiz__score" data-score role="status" aria-live="polite"></p>
