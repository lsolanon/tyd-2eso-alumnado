<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technology and Digitalisation · 2.º ESO</title>
<meta name="description" content="Technology and Digitalisation for 2.º ESO — ten units, offline, in a single file.">
<style>/* =========================================================================
   App TyD 2.º ESO — Hoja de estilo única
   Sistema visual «Dala» (Diseño/DESIGN_TyD.md), con las tres resoluciones
   de la fase 4 del plan aplicadas y comentadas donde se apartan del sistema.
   ========================================================================= */

/* ---------- 1. Tokens ---------------------------------------------------- */

:root {
  /* Colour — tal cual el sistema Dala */
  --color-void:          #000000;
  --color-bone-white:    #ffffff;
  --color-ash-gray:      #9a9a9a;
  --color-silver-mist:   #bdbdbd;
  --color-electric-iris: #8052ff;
  --color-saffron-spark: #ffb829;
  --color-deep-verdant:  #15846e;

  /* Grises de apoyo derivados, con contraste medido sobre #000000
     #ffffff 21.0:1 · #bdbdbd 11.2:1 · #9a9a9a 7.5:1 · #ffb829 12.1:1
     #8052ff 4.6:1 (solo como fondo de botón con texto blanco, a 16px/600)
     #7bd88f 11.5:1 (acierto) · #ff8a7a 8.4:1 (fallo) — no se usa el color solo */
  --color-correct:       #7bd88f;
  --color-wrong:         #ff8a7a;

  /* Línea de 1 px. Resolución 3 de la fase 4: la delimitación existe, pero
     SOLO en superficies interactivas y tablas de datos. */
  --hairline:            rgba(255, 255, 255, 0.08);
  --hairline-strong:     rgba(255, 255, 255, 0.16);
  --surface-faint:       rgba(255, 255, 255, 0.03);

  /* Tipografía. PPNeueMontreal no es libre; Inter es el sustituto que marca
     el sistema. La app funciona sin conexión, así que no se carga ninguna
     fuente remota: si Inter está instalada se usa, y si no cae al stack
     del sistema, que conserva la geometría neogrotesca. */
  --font-sans: 'Inter', 'Inter var', system-ui, -apple-system, BlinkMacSystemFont,
               'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas,
               'Liberation Mono', monospace;

  /* Escala tipográfica */
  --text-caption:      12px;
  --text-nav-label:    14px;
  --text-ui:           16px;   /* fase 4, tensión 2: etiquetas de botón */
  --text-body:         24px;   /* fase 4, tensión 2: cuerpo de lectura */
  --text-lede:         24px;
  --text-heading-2xs:  24px;
  --text-heading-xs:   27px;
  --text-subheading:   36px;
  --text-heading-sm:   42px;
  --text-heading:      48px;
  --text-heading-lg:   78px;
  --text-display:      113px;

  --weight-extralight: 200;
  --weight-light:      300;   /* fase 4, tensión 2 */
  --weight-regular:    400;
  --weight-semibold:   600;

  /* Espaciado, base 6 px */
  --space-6:   6px;
  --space-12:  12px;
  --space-18:  18px;
  --space-24:  24px;
  --space-30:  30px;
  --space-36:  36px;
  --space-60:  60px;
  --space-78:  78px;
  --space-96:  96px;
  --space-120: 120px;

  /* Ritmos. Resolución 1 de la fase 4: dos densidades declaradas. */
  --rhythm-open:    var(--space-78);  /* portada y aperturas de tema */
  --rhythm-read:    var(--space-36);  /* cuerpo de lectura */
  --measure:        65ch;             /* medida de línea */

  --radius:        24px;
  --radius-full:   9999px;
  --radius-small:  12px;

  --page-max:      1280px;
  --nav-width:     288px;
}

/* ---------- 2. Base ------------------------------------------------------ */

*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--color-void);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--color-void);
  color: var(--color-bone-white);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  font-weight: var(--weight-light);
  line-height: 1.65;
  font-feature-settings: 'ss01' on;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img { max-width: 100%; height: auto; display: block; }

a {
  color: var(--color-saffron-spark);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
}
a:hover { color: var(--color-bone-white); }

/* Foco visible en todo lo que recibe foco. Ámbar sobre negro: 12.1:1. */
:focus-visible {
  outline: 2px solid var(--color-saffron-spark);
  outline-offset: 3px;
  border-radius: 4px;
}
:focus:not(:focus-visible) { outline: none; }

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  background: var(--color-electric-iris);
  color: var(--color-bone-white);
  padding: var(--space-12) var(--space-24);
  border-radius: var(--radius);
  font-size: var(--text-ui);
  font-weight: var(--weight-semibold);
}
.skip-link:focus { left: var(--space-18); top: var(--space-18); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* ---------- 3. Tipografía ------------------------------------------------ */

h1, h2, h3, h4, h5, h6 {
  font-weight: var(--weight-regular);
  color: var(--color-bone-white);
  margin: 0;
  text-wrap: balance;
}

.display {
  font-size: clamp(46px, 9vw, var(--text-display));
  line-height: 1.02;
  letter-spacing: -0.04em;
}
.heading-lg {
  font-size: clamp(38px, 6.5vw, var(--text-heading-lg));
  line-height: 1.06;
  letter-spacing: -0.04em;
}
.heading {
  font-size: clamp(32px, 4.4vw, var(--text-heading));
  line-height: 1.1;
  letter-spacing: -0.035em;
}
.heading-sm {
  font-size: clamp(28px, 3.6vw, var(--text-heading-sm));
  line-height: 1.15;
  letter-spacing: -0.03em;
}
.subheading {
  font-size: clamp(25px, 2.8vw, var(--text-subheading));
  line-height: 1.2;
  letter-spacing: -0.02em;
}
.heading-xs { font-size: var(--text-heading-xs); line-height: 1.2; letter-spacing: -0.015em; }
.heading-2xs { font-size: var(--text-heading-2xs); line-height: 1.25; letter-spacing: -0.02em; }

/* Etiqueta ámbar en versalitas: el marcador de sección del sistema. */
.label {
  display: block;
  font-size: var(--text-nav-label);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-saffron-spark);
  margin-bottom: var(--space-18);
}
.label--quiet { color: var(--color-ash-gray); }

/* Entradilla: aquí sí vive el peso 200 del sistema. */
.lede {
  font-size: clamp(20px, 2.2vw, var(--text-lede));
  font-weight: var(--weight-extralight);
  line-height: 1.45;
  color: var(--color-bone-white);
  max-width: 46ch;
}

p { margin: 0 0 var(--space-18); max-width: var(--measure); }
p:last-child { margin-bottom: 0; }

strong { font-weight: var(--weight-semibold); color: var(--color-bone-white); }
em { font-style: italic; color: var(--color-bone-white); }

.text-quiet    { color: var(--color-silver-mist); }
.text-quieter  { color: var(--color-ash-gray); }
.text-accent   { color: var(--color-saffron-spark); }

/* El término técnico, la primera vez que aparece. */
.term {
  color: var(--color-saffron-spark);
  font-weight: var(--weight-semibold);
}

ul, ol { max-width: var(--measure); padding-left: 1.35em; margin: 0 0 var(--space-18); }
li { margin-bottom: var(--space-12); }
li::marker { color: var(--color-ash-gray); }

blockquote {
  margin: var(--space-36) 0;
  padding-left: var(--space-24);
  border-left: 2px solid var(--color-saffron-spark);
  font-weight: var(--weight-extralight);
  font-size: var(--text-lede);
  line-height: 1.45;
  max-width: 44ch;
}

/* Fórmulas con HTML y Unicode. Cero LaTeX, cero librería. */
/* Antes iba siempre en una sola línea (nowrap). Al subir el tamaño de letra
   del contenido (15/09/2026, legibilidad en el proyector de 65"), una fórmula
   larga dentro de una columna estrecha podía desbordar la página entera
   (hallazgo equivalente a A87, pero en fórmulas). Envuelve como texto normal:
   una fórmula corta sigue cabiendo en una línea, y solo una larga se reparte. */
.formula {
  font-family: var(--font-mono);
  font-size: 1.02em;
  color: var(--color-bone-white);
  white-space: normal;
  overflow-wrap: break-word;
}
.formula sub, .formula sup { font-size: 0.72em; }

/* ---------- 4. Disposición ----------------------------------------------- */

.app { display: flex; min-height: 100vh; }

.content {
  flex: 1 1 auto;
  min-width: 0;
  padding: var(--space-60) var(--space-36) var(--space-120);
}

.wrap { max-width: var(--page-max); margin: 0 auto; }
.wrap--reading { max-width: 820px; }

/* Ritmo abierto: portadas y aperturas de sección. */
.section-open { margin-top: var(--rhythm-open); }
/* Ritmo de lectura: el cuerpo. */
.block { margin-top: var(--rhythm-read); }
.block--tight { margin-top: var(--space-24); }

.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-60);
  align-items: start;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--space-36);
  max-width: var(--page-max);
}

.rule {
  border: 0;
  border-top: 1px solid var(--hairline);
  margin: var(--rhythm-open) 0;
  max-width: var(--page-max);
}

figure { margin: var(--space-36) 0; max-width: 720px; }
/* Las fotografías/ilustraciones sueltas (sin más clase) se limitan de alto
   además de ancho: una imagen vertical no debe dominar la pantalla más que
   una horizontal. `.dwg`, `.flow` y `.match-card` no llevan elementos img
   (van en SVG), así que este selector nunca las toca (petición de Luis,
   15/09/2026). */
figure img {
  border-radius: var(--radius);
  max-width: 100%;
  max-height: 60vh;
  width: auto;
  height: auto;
}
/* El pie de foto es contenido, no un adorno: mismo tamaño y color que un
   párrafo, no una etiqueta pequeña y gris. `.dwg figcaption`, más abajo,
   sigue marcando el suyo en gris — son leyendas técnicas, no prosa. */
figcaption {
  margin-top: var(--space-12);
  font-size: var(--text-body);
  line-height: 1.65;
  font-weight: var(--weight-light);
  color: var(--color-bone-white);
  max-width: var(--measure);
}

/* ---------- 5. Navegación ------------------------------------------------ */

.nav {
  flex: 0 0 var(--nav-width);
  width: var(--nav-width);
  padding: var(--space-36) var(--space-24);
  border-right: 1px solid var(--hairline);
  position: sticky;
  top: 0;
  align-self: flex-start;
  max-height: 100vh;
  overflow-y: auto;
}

.nav__brand {
  display: flex;
  align-items: center;
  gap: var(--space-12);
  margin-bottom: var(--space-36);
  border: 0;
  color: var(--color-bone-white);
}
.nav__mark { width: 22px; height: 22px; flex: 0 0 22px; }
.nav__wordmark {
  font-size: var(--text-ui);
  font-weight: var(--weight-semibold);
  letter-spacing: -0.01em;
}

.nav__list { list-style: none; margin: 0; padding: 0; max-width: none; }
.nav__item { margin: 0; }

.nav__link {
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: baseline;
  gap: var(--space-6);
  padding: 9px var(--space-12);
  border: 0;
  border-radius: var(--radius-small);
  color: var(--color-ash-gray);
  font-size: var(--text-nav-label);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.02em;
  line-height: 1.3;
  text-transform: none;
}
.nav__link:hover { color: var(--color-bone-white); background: var(--surface-faint); }
.nav__link[aria-current='page'] { color: var(--color-bone-white); background: var(--surface-faint); }
.nav__num { color: var(--color-ash-gray); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nav__link[aria-current='page'] .nav__num { color: var(--color-saffron-spark); }

/* Unidad aún no abierta (data-pending, puesto por app.js cuando el <template data-theme="…">
   no está en el HTML compilado — build.py --student, CONVENCIONES.md §4ter.3bis). Un candado
   antes del título y algo menos de énfasis que un enlace disponible, con los mismos colores
   Dala que el resto del menú: sin candado propio en el sistema, se usa un carácter de candado
   como contenido generado, en el mismo gris que el número y el resto del texto en reposo. El
   segundo <span> del enlace es el título (el primero es el número, el tercero el punto de
   progreso): no lleva clase propia, así que se selecciona por posición. */
.nav__link[data-pending] { opacity: 0.6; }
.nav__link[data-pending]:hover,
.nav__link[data-pending]:focus-visible { opacity: 0.85; }
.nav__link[data-pending] > span:nth-of-type(2)::before {
  content: "\1F512";
  display: inline-block;
  margin-right: var(--space-6);
  font-size: 0.8em;
  vertical-align: 1px;
}

/* Punto de progreso. Nunca solo color: lleva título y texto accesible. */
.nav__dot {
  width: 8px; height: 8px; border-radius: var(--radius-full);
  background: transparent;
  border: 1px solid var(--hairline-strong);
  align-self: center;
}
.nav__dot--done { background: var(--color-saffron-spark); border-color: var(--color-saffron-spark); }

.nav__foot { margin-top: var(--space-36); padding-top: var(--space-24); border-top: 1px solid var(--hairline); }

.nav__notice {
  font-size: var(--text-caption);
  line-height: 1.5;
  color: var(--color-ash-gray);
  margin-bottom: var(--space-12);
  max-width: none;
}

.nav__toggle { display: none; }

/* ---------- 6. Botones --------------------------------------------------- */

/* Acción primaria. Única superficie violeta de la app.
   Fase 4: la etiqueta sube a 16 px / 600 porque #8052ff da 4.6:1 y a 14 px
   quedaba al límite de AA. */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-6);
  background: var(--color-electric-iris);
  color: var(--color-bone-white);
  border: 1px solid var(--color-electric-iris);
  border-radius: var(--radius-full);
  padding: 13px 24px;
  font-family: inherit;
  font-size: var(--text-ui);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.01em;
  line-height: 1.2;
  cursor: pointer;
  text-decoration: none;
}
.btn:hover { background: #9370ff; border-color: #9370ff; color: var(--color-bone-white); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* Acción secundaria: sin relleno, con la línea de 1 px de la resolución 3. */
.btn--ghost {
  background: transparent;
  border-color: var(--hairline-strong);
  color: var(--color-bone-white);
}
.btn--ghost:hover { background: var(--surface-faint); border-color: var(--color-bone-white); }

.btn--small { padding: 9px 16px; font-size: var(--text-nav-label); }

.btn-row { display: flex; flex-wrap: wrap; gap: var(--space-12); align-items: center; margin-top: var(--space-24); }

/* ---------- 7. Pseudocódigo ---------------------------------------------- */

.code {
  font-family: var(--font-mono);
  font-size: 20px;
  line-height: 1.75;
  color: var(--color-bone-white);
  background: var(--surface-faint);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-small);
  padding: var(--space-24);
  margin: var(--space-24) 0;
  overflow-x: auto;
  max-width: 720px;
  white-space: pre;
  tab-size: 4;
}
/* Los prompts son prosa: se parten en varias líneas en vez de desplazarse. */
.code--wrap { white-space: pre-wrap; overflow-wrap: break-word; }
/* Dentro de una columna de .split, una línea larga de pseudocódigo se sale.
   .code--dense la encaja sin desplazamiento horizontal y sin partirla. */
.code--dense { font-size: 18px; line-height: 1.7; padding: var(--space-18); }
.code--bad { border-color: rgba(255, 138, 122, 0.35); }
.code--good { border-color: rgba(123, 216, 143, 0.35); }

.kw { color: var(--color-saffron-spark); font-weight: var(--weight-semibold); }
.var { color: var(--color-bone-white); }
.str { color: var(--color-silver-mist); }
.cmt { color: var(--color-ash-gray); font-style: italic; }

/* Palabra clave dentro de un párrafo. Hasta el 15/09/2026 iba siempre en una
   sola línea (nowrap); al subir el tamaño de letra del contenido para el
   proyector de 65", una frase de varias palabras dentro de una columna
   estrecha (p. ej. .grid-2) podía desbordar la página entera. Ahora envuelve
   como texto normal: una palabra clave corta sigue cabiendo en una línea sin
   partirse, y solo una frase larga se reparte en dos. */
code, .kw-inline {
  font-family: var(--font-mono);
  font-size: 0.92em;
  color: var(--color-saffron-spark);
  white-space: normal;
  overflow-wrap: break-word;
}

/* El nowrap de arriba protege una expresión corta como REPEAT n TIMES, pero
   un identificador largo sin espacios —un nombre de fichero, una ruta, una
   URL— no tenía por dónde partirse y desbordaba la página entera en una
   pantalla de 400 px (hallazgo A87). Desde que el código en línea ya no lleva
   nowrap por defecto (15/09/2026), `code.long` es en la práctica un refuerzo:
   parte incluso dentro de una palabra, no solo entre palabras. */
code.long { white-space: normal; overflow-wrap: anywhere; }

.code-label {
  display: inline-block;
  font-size: var(--text-caption);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-ash-gray);
  margin-bottom: calc(-1 * var(--space-12));
  margin-top: var(--space-24);
}

/* ---------- 8. Tablas de datos ------------------------------------------- */

.table-scroll { overflow-x: auto; margin: var(--space-24) 0; max-width: var(--page-max); }

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 21px;
  line-height: 1.5;
}
th, td {
  text-align: left;
  padding: var(--space-12) var(--space-18);
  border-bottom: 1px solid var(--hairline);
  vertical-align: top;
}
thead th {
  font-size: var(--text-caption);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-saffron-spark);
  border-bottom-color: var(--hairline-strong);
}
tbody tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

/* ---------- 9. Widget: ordenar código desordenado ------------------------ */

.widget {
  margin: var(--space-36) 0;
  padding: var(--space-30);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  max-width: 820px;
}
.widget__head { margin-bottom: var(--space-18); }
.widget__title { font-size: var(--text-heading-2xs); letter-spacing: -0.02em; }
.widget__intro { font-size: 21px; color: var(--color-silver-mist); margin: var(--space-12) 0 0; }

.order-list { list-style: none; margin: var(--space-18) 0 0; padding: 0; max-width: none; }

.order-item {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  align-items: center;
  gap: var(--space-12);
  margin: 0 0 var(--space-6);
  padding: var(--space-12) var(--space-18);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-small);
  background: var(--surface-faint);
  font-family: var(--font-mono);
  font-size: 19px;
  line-height: 1.5;
  cursor: grab;
}
.order-item:active { cursor: grabbing; }
.order-item[aria-grabbed='true'] { border-color: var(--color-electric-iris); }
.order-item--over { border-color: var(--color-saffron-spark); }
.order-item--ok { border-color: rgba(123, 216, 143, 0.55); }
.order-item--no { border-color: rgba(255, 138, 122, 0.55); border-style: dashed; }

.order-item__handle {
  color: var(--color-ash-gray);
  display: inline-flex;
  align-items: center;
  user-select: none;
}
.order-item__mark {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: var(--weight-semibold);
  letter-spacing: 0.06em;
}
.order-item--ok .order-item__mark { color: var(--color-correct); }
.order-item--no .order-item__mark { color: var(--color-wrong); }

.order-move {
  display: flex; gap: 4px;
}
.order-move button {
  background: transparent;
  border: 1px solid var(--hairline-strong);
  color: var(--color-bone-white);
  border-radius: 8px;
  width: 30px; height: 30px;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  font-family: inherit;
}
.order-move button:hover { background: var(--surface-faint); }

/* ---------- 10. Widget: tabla de traza ----------------------------------- */

.trace { width: 100%; font-family: var(--font-mono); font-size: 19px; }
.trace th, .trace td { padding: var(--space-6) var(--space-12); }
.trace thead th { font-family: var(--font-sans); }
.trace__step { color: var(--color-ash-gray); white-space: nowrap; }
.trace__line { color: var(--color-silver-mist); white-space: nowrap; }

.trace input {
  width: 100%;
  min-width: 74px;
  background: transparent;
  border: 1px solid var(--hairline-strong);
  border-radius: 8px;
  padding: 7px 10px;
  color: var(--color-bone-white);
  font-family: var(--font-mono);
  font-size: 19px;
}
.trace input::placeholder { color: rgba(255, 255, 255, 0.25); }
/* El estado nunca se comunica solo con color: el acierto lleva línea continua
   y el fallo línea discontinua y más gruesa, además del recuento en texto. */
.trace input[data-state='ok'] { border-color: var(--color-correct); border-style: solid; }
.trace input[data-state='no'] {
  border-color: var(--color-wrong);
  border-style: dashed;
  border-width: 2px;
}
.trace td[data-fixed='true'] { color: var(--color-ash-gray); }

.widget__result {
  margin-top: var(--space-18);
  font-size: 21px;
  font-weight: var(--weight-regular);
  line-height: 1.5;
  max-width: var(--measure);
}
.widget__result--ok { color: var(--color-correct); }
.widget__result--no { color: var(--color-wrong); }

/* ---------- 11. Quiz ------------------------------------------------------ */

.quiz { margin: var(--space-36) 0; max-width: 820px; }
.quiz__q {
  padding: var(--space-24) 0;
  border-top: 1px solid var(--hairline);
}
.quiz__stem { font-size: 24px; font-weight: var(--weight-regular); margin-bottom: var(--space-18); max-width: var(--measure); }
.quiz__num { color: var(--color-saffron-spark); font-weight: var(--weight-semibold); margin-right: var(--space-6); }

.quiz__options { list-style: none; margin: 0; padding: 0; max-width: none; display: grid; gap: var(--space-6); }
.quiz__options li { margin: 0; }

.quiz-option {
  display: flex;
  align-items: flex-start;
  gap: var(--space-12);
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-small);
  padding: var(--space-12) var(--space-18);
  color: var(--color-bone-white);
  font-family: inherit;
  font-size: 21px;
  font-weight: var(--weight-light);
  line-height: 1.5;
  cursor: pointer;
}
.quiz-option:hover:not([disabled]) { background: var(--surface-faint); border-color: var(--color-bone-white); }
.quiz-option[disabled] { cursor: default; }
.quiz-option__key {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--color-ash-gray);
  padding-top: 2px;
}
.quiz-option--chosen-ok { border-color: var(--color-correct); }
.quiz-option--chosen-no { border-color: var(--color-wrong); }
.quiz-option--reveal { border-color: rgba(123, 216, 143, 0.75); }
.quiz-option__tag {
  margin-left: auto;
  align-self: center;
  font-size: var(--text-caption);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-correct);
  white-space: nowrap;
}

.quiz__feedback {
  margin-top: var(--space-12);
  padding: var(--space-12) var(--space-18);
  border-left: 2px solid var(--hairline-strong);
  font-size: 21px;
  line-height: 1.55;
  max-width: var(--measure);
}
.quiz__feedback--ok { border-left-color: var(--color-correct); }
.quiz__feedback--no { border-left-color: var(--color-wrong); }
.quiz__verdict { font-weight: var(--weight-semibold); }
.quiz__verdict--ok { color: var(--color-correct); }
.quiz__verdict--no { color: var(--color-wrong); }

.quiz__score {
  margin-top: var(--space-24);
  padding-top: var(--space-18);
  border-top: 1px solid var(--hairline);
  font-size: 21px;
  color: var(--color-silver-mist);
}

/* ---------- 12. Actividad ------------------------------------------------- */

.activity {
  margin: var(--space-36) 0;
  padding: var(--space-30);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  max-width: 820px;
}
.activity dl { margin: var(--space-18) 0 0; display: grid; grid-template-columns: max-content 1fr; gap: var(--space-6) var(--space-24); }
.activity dt {
  font-size: var(--text-caption);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-ash-gray);
  padding-top: 5px;
}
.activity dd { margin: 0; font-size: 21px; line-height: 1.55; }

/* ---------- 13. Aviso ----------------------------------------------------- */

.notice {
  margin: var(--space-24) 0;
  padding: var(--space-18) var(--space-24);
  border: 1px solid var(--hairline);
  border-left: 2px solid var(--color-saffron-spark);
  border-radius: var(--radius-small);
  font-size: 21px;
  line-height: 1.55;
  color: var(--color-silver-mist);
  max-width: 720px;
}
.notice strong { color: var(--color-bone-white); }

/* ---------- 14. Portada --------------------------------------------------- */

/* La constelación vive en su propia columna de la retícula: nunca cae
   detrás del texto, que es la condición que le pone la fase 4 del plan. */
.cover {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: var(--space-60);
  align-items: center;
  padding: var(--space-96) 0 var(--rhythm-open);
}
.cover__canvas {
  order: 2;
  width: 100%;
  height: min(560px, 58vh);
  pointer-events: none;
}
.cover__inner { order: 1; max-width: 720px; }
.cover__meta {
  margin-top: var(--rhythm-open);
  display: flex; flex-wrap: wrap; gap: var(--space-36);
  font-size: var(--text-caption);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ash-gray);
}

/* Apertura de tema: mismo criterio, el lienzo en su propia celda. */
.theme-open { padding-bottom: var(--rhythm-open); }
.theme-open__hero {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
  gap: var(--space-60);
  align-items: center;
}
.theme-open__intro { order: 1; }
.theme-open__num {
  font-size: var(--text-caption);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--color-saffron-spark);
  margin-bottom: var(--space-18);
}
.theme-open__canvas {
  order: 2;
  width: 100%;
  height: min(320px, 34vh);
  pointer-events: none;
}

.toc { list-style: none; margin: var(--rhythm-read) 0 0; padding: 0; max-width: 720px; }
.toc li { margin: 0; border-top: 1px solid var(--hairline); }
.toc a {
  display: flex; justify-content: space-between; gap: var(--space-24);
  padding: var(--space-18) 0;
  color: var(--color-bone-white);
  border: 0;
  font-size: 23px;
}
.toc a:hover { color: var(--color-saffron-spark); }
.toc__n { color: var(--color-ash-gray); font-variant-numeric: tabular-nums; }

/* Pie de tema: marcar como completado, ir al siguiente. */
.theme-foot {
  margin-top: var(--rhythm-open);
  padding-top: var(--space-36);
  border-top: 1px solid var(--hairline);
  max-width: 820px;
}

/* ---------- 15. Tarjeta de referencia imprimible -------------------------- */

.refcard {
  margin: var(--space-36) 0;
  padding: var(--space-30);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  max-width: 920px;
}
.refcard__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-24) var(--space-36);
  margin-top: var(--space-24);
}
.refcard__group h4 {
  font-size: var(--text-caption);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-saffron-spark);
  margin-bottom: var(--space-12);
}
.refcard__group dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px var(--space-18); }
.refcard__group dt { font-family: var(--font-mono); font-size: 14px; color: var(--color-bone-white); white-space: nowrap; }
.refcard__group dd { margin: 0; font-size: 19px; line-height: 1.45; color: var(--color-silver-mist); }

/* ---------- 15b. Bloques (representación del entorno del tema 5) --------- */

.flow { max-width: 520px; }
.flow svg { width: 100%; height: auto; }

.blocks {
  display: grid;
  gap: 4px;
  max-width: 520px;
  margin: var(--space-24) 0;
  font-family: var(--font-sans);
  font-size: 19px;
}
.blk {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 10px var(--space-18);
  border: 1px solid var(--hairline-strong);
  border-left-width: 3px;
  border-radius: 10px;
  background: var(--surface-faint);
  line-height: 1.4;
}
.blk--event { border-left-color: var(--color-saffron-spark); }
.blk--io    { border-left-color: var(--color-electric-iris); }
.blk--ctrl  { border-left-color: var(--color-deep-verdant); }
.blk--nested { margin-left: var(--space-24); }
.blk__slot {
  display: inline-block;
  padding: 2px 10px;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-full);
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--color-bone-white);
}

/* ---------- 16. Adaptación a pantallas estrechas -------------------------- */

@media (max-width: 1080px) {
  .split { grid-template-columns: minmax(0, 1fr); gap: var(--space-36); }
  .cover, .theme-open__hero { grid-template-columns: 1fr; gap: var(--space-36); }
  .cover__canvas, .theme-open__canvas { display: none; }
}

@media (max-width: 860px) {
  :root { --rhythm-open: var(--space-60); --text-body: 22px; }
  .app { display: block; }
  .nav {
    position: static; width: auto; max-height: none;
    border-right: 0; border-bottom: 1px solid var(--hairline);
    padding: var(--space-18);
  }
  .nav__toggle {
    display: inline-flex; align-items: center; gap: var(--space-6);
    background: transparent; border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-full); color: var(--color-bone-white);
    padding: 9px 16px; font-family: inherit; font-size: var(--text-nav-label);
    font-weight: var(--weight-semibold); cursor: pointer;
  }
  .nav__brand { margin-bottom: var(--space-18); }
  .nav__panel[hidden] { display: none; }
  .content { padding: var(--space-36) var(--space-18) var(--space-96); }
  .widget, .activity, .refcard { padding: var(--space-18); }
  .activity dl { grid-template-columns: 1fr; gap: 2px var(--space-12); }
  .activity dd { margin-bottom: var(--space-12); }
}

/* ---------- 17. Movimiento ------------------------------------------------ */

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- 17bis. Barra de sesiones --------------------------------------
   El filtro sesión a sesión de §4ter. Solo existe donde sessions.json declara
   sesiones. El estado no se da nunca solo con color: la sesión puesta se
   nombra en el texto de abajo, que es además el que anuncia el cambio. El
   foco lo pinta el :focus-visible general, ámbar sobre negro a 12.1:1. */

.sessions {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: var(--space-12) var(--space-18); max-width: 820px;
}
.sessions__label { margin-bottom: 0; }
.sessions__row { display: flex; flex-wrap: wrap; gap: var(--space-6); }
.sessions__btn {
  display: inline-flex; justify-content: center; min-width: 52px;
  background: transparent; border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-full); color: var(--color-bone-white);
  padding: 9px 18px; cursor: pointer; font-family: inherit; line-height: 1.2;
  /* 16 px y 600: es como el morado del sistema llega a 4.6:1 en blanco. */
  font-size: var(--text-ui); font-weight: var(--weight-semibold);
}
.sessions__btn:hover { background: var(--surface-faint); border-color: var(--color-bone-white); }
.sessions__btn[aria-pressed="true"] {
  background: var(--color-electric-iris); border-color: var(--color-electric-iris);
}
.sessions__now {
  flex-basis: 100%; margin: 0; line-height: 1.5;
  color: var(--color-ash-gray); font-size: var(--text-nav-label);
}

/* Bajo 860 px, etiqueta y botones a línea completa. Los 12 px de relleno son
   los que ponen el botón en 45 px de alto: el mínimo táctil son 44. */
@media (max-width: 860px) {
  .sessions__label, .sessions__row { flex-basis: 100%; }
  .sessions__btn { padding: 12px 18px; }
}

/* ---------- 18. Impresión ------------------------------------------------- */

@media print {
  @page { margin: 14mm; }

  html, body { background: #ffffff; color: #000000; }
  body { font-size: 11pt; font-weight: 400; line-height: 1.45; }

  .nav, .cover__canvas, .theme-open__canvas, .btn-row, .theme-foot,
  .skip-link, .order-move, .no-print { display: none !important; }

  .app { display: block; min-height: 0; }
  .content { padding: 0; }
  #main { min-height: 0; }

  h1, h2, h3, h4 { color: #000000; page-break-after: avoid; }
  .display { font-size: 28pt; }
  .heading-lg { font-size: 22pt; }
  .heading { font-size: 18pt; }
  .heading-sm { font-size: 15pt; }
  .subheading { font-size: 13pt; }
  .label, .theme-open__num, thead th, .refcard__group h4, .activity dt { color: #000000; }
  .lede { font-weight: 400; color: #000000; }
  .text-quiet, .text-quieter, figcaption, .widget__intro, .activity dd { color: #333333; }
  .term, .kw, code, .kw-inline, a { color: #000000; }
  /* strong y em heredaban el blanco del tema oscuro: en papel desaparecían.
     Se veía sobre todo en la tarjeta de referencia y en los párrafos
     .text-quiet, donde una palabra en negrita salía en blanco sobre blanco
     y dejaba un hueco (hallazgo A88). */
  strong, em { color: #000000; }
  /* .notice strong y .refcard dd strong ganan por especificidad, así que
     hay que nombrarlos. */
  .notice strong, .notice em, .refcard strong, .activity strong,
  .widget strong, .quiz strong, .route strong { color: #000000; }

  a { border-bottom: 0; }

  .code, .widget, .activity, .refcard, .notice, .quiz-option, .order-item, .trace input {
    background: #ffffff;
    border-color: #999999;
    color: #000000;
  }
  .code { page-break-inside: avoid; }
  .trace input { min-height: 20pt; }

  th, td { border-bottom-color: #999999; }
  figure { page-break-inside: avoid; }

  .flow svg { color: #000000; }
  .flow__label text { fill: #6b4a00; }
  .blk, .blk__slot { background: #ffffff; border-color: #999999; color: #000000; }

  /* La tarjeta de referencia se imprime sola, en una página: se oculta todo
     el tema menos la rama que lleva a la tarjeta, marcada desde app.js. */
  body.print-refcard #view > * > * { display: none !important; }
  body.print-refcard #view > * > .print-only { display: block !important; }
  body.print-refcard .print-only > *:not(.refcard-page) { display: none !important; }
  body.print-refcard .theme-foot { display: none !important; }
  /* La tarjeta tiene que caber en una cara. Se aprieta el ritmo y se fuerza
     el negro en los términos, que en pantalla son blancos. */
  .refcard { page-break-inside: avoid; border: 0; padding: 0; font-size: 9.5pt; }
  .refcard__grid { grid-template-columns: 1fr 1fr; gap: 12px 28px; margin-top: 12px; }
  .refcard__grid[style] { margin-top: 12px !important; }
  .refcard h3 { font-size: 14pt; margin-bottom: 4px; }
  .refcard__group h4 { font-size: 8pt; letter-spacing: 0.1em; margin-bottom: 5px; }
  .refcard__group dl { gap: 3px 12px; }
  .refcard__group dt { font-size: 8.5pt; color: #000000; }
  .refcard__group dd { font-size: 9pt; line-height: 1.3; color: #222222; }
  .refcard__group ol { font-size: 9pt !important; line-height: 1.3; margin: 0; padding-left: 1.1em; }
  .refcard__group ol li { margin-bottom: 3px; color: #222222; }
  .refcard p { font-size: 8pt !important; margin-top: 10px !important; }
}

/* ---------- 15. Widget: cazador de instrucciones defectuosas -------------
   Tema 2. Dos comprobaciones distintas por línea: qué falla (etiquetas) y
   la reescritura (reglas mecánicas). El estado nunca se da solo con color:
   cada línea lleva su veredicto en texto. */

.hunt { list-style: none; margin: var(--space-18) 0 0; padding: 0; max-width: none; }

.hunt__item {
  margin: 0 0 var(--space-12);
  padding: var(--space-18);
  border: 1px solid var(--hairline-strong);
  border-left-width: 3px;
  border-radius: var(--radius-small);
  background: var(--surface-faint);
}
.hunt__item--ok { border-left-color: var(--color-correct); }
.hunt__item--no { border-left-color: var(--color-wrong); }

.hunt__bad {
  margin: 0;
  max-width: none;
  font-family: var(--font-mono);
  font-size: 20px;
  color: var(--color-bone-white);
}
.hunt__cross {
  color: var(--color-wrong);
  font-weight: var(--weight-semibold);
  margin-right: var(--space-12);
}

.hunt__tags { display: flex; flex-wrap: wrap; gap: var(--space-6); margin-top: var(--space-12); }
.hunt__tag {
  font-family: inherit;
  font-size: 14px;
  line-height: 1.2;
  padding: 8px 14px;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--color-silver-mist);
  cursor: pointer;
}
.hunt__tag:hover { border-color: var(--color-bone-white); color: var(--color-bone-white); }
.hunt__tag[aria-pressed='true'] {
  border-color: var(--color-saffron-spark);
  color: var(--color-saffron-spark);
  font-weight: var(--weight-semibold);
}
/* La respuesta revelada se marca con texto además de con el borde. */
.hunt__tag--answer { border-style: dashed; border-color: var(--color-correct); }
.hunt__tag--answer::after { content: ' · applies'; color: var(--color-correct); font-size: 12px; }

.hunt__rewrite { margin-top: var(--space-12); }
.hunt__label {
  display: block;
  font-size: var(--text-caption);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-ash-gray);
  margin-bottom: var(--space-6);
}
.hunt__rewrite input {
  width: 100%;
  background: var(--color-void);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-small);
  color: var(--color-bone-white);
  font-family: var(--font-mono);
  font-size: 19px;
  padding: 10px var(--space-12);
}
.hunt__rewrite input::placeholder { color: rgba(255, 255, 255, 0.25); }
.hunt__rewrite input:focus-visible { outline: 2px solid var(--color-saffron-spark); outline-offset: 2px; }

.hunt__note {
  margin: var(--space-12) 0 0;
  max-width: none;
  font-size: 19px;
  color: var(--color-silver-mist);
  font-style: italic;
}
.hunt__verdict {
  margin: var(--space-12) 0 0;
  max-width: none;
  font-size: 19px;
  line-height: 1.5;
  color: var(--color-silver-mist);
}
.hunt__verdict--ok { color: var(--color-correct); }
.hunt__verdict--no { color: var(--color-wrong); }

@media print {
  .hunt__item { border: 1px solid #999999 !important; background: #ffffff !important; }
  .hunt__bad, .hunt__note, .hunt__verdict { color: #000000 !important; }
  .hunt__tag { border: 1px solid #999999 !important; color: #000000 !important; }
  .hunt__tag--answer::after { content: ''; }
  .hunt__rewrite input { border: 1px solid #999999 !important; background: #ffffff !important; min-height: 20pt; }
  .hunt__label { color: #000000 !important; }
}

/* ---------- 19. Widget: emparejar pseudocódigo con diagrama ---------------
   Tema 4. Los cuatro diagramas se presentan como tarjetas con letra y el
   alumnado elige una letra por algoritmo. Ni arrastrar ni líneas que cruzan:
   botones, que ya funcionan con teclado y con lector de pantalla. El estado
   nunca se da solo con color: cada línea lleva su veredicto en texto. */

.match__cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: var(--space-18);
  margin: var(--space-18) 0 var(--space-36);
}
.match-card {
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-small);
  padding: var(--space-18);
  background: var(--surface-faint);
  margin: 0;
}
.match-card__letter {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--text-caption);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-saffron-spark);
  margin-bottom: var(--space-12);
}
.match-card svg { width: 100%; height: auto; color: var(--color-silver-mist); }

.match { list-style: none; margin: var(--space-18) 0 0; padding: 0; max-width: none; }
.match__item {
  margin: 0 0 var(--space-18);
  padding: var(--space-18);
  border: 1px solid var(--hairline);
  border-left: 3px solid var(--hairline-strong);
  border-radius: var(--radius-small);
}
.match__item--ok { border-left-color: var(--color-correct); }
.match__item--no { border-left-color: var(--color-wrong); }
.match__item .code { margin: 0; }

.match__opts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); margin-top: var(--space-12); }
.match__lead {
  font-size: var(--text-nav-label);
  color: var(--color-ash-gray);
  margin-right: var(--space-6);
}
.match__opt {
  min-width: 44px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-full);
  color: var(--color-silver-mist);
  font-family: var(--font-mono);
  font-size: var(--text-ui);
  font-weight: var(--weight-semibold);
  cursor: pointer;
}
.match__opt:hover { border-color: var(--color-bone-white); color: var(--color-bone-white); }
.match__opt[aria-pressed='true'] {
  background: var(--color-saffron-spark);
  border-color: var(--color-saffron-spark);
  color: var(--color-void);
}
.match__opt--answer { border-style: dashed; border-color: var(--color-correct); color: var(--color-correct); }

.match__verdict {
  margin: var(--space-12) 0 0;
  font-size: 20px;
  line-height: 1.5;
  color: var(--color-ash-gray);
  max-width: var(--measure);
}
.match__verdict--ok { color: var(--color-correct); }
.match__verdict--no { color: var(--color-wrong); }

@media print {
  .match-card, .match__item, .match__opt {
    background: #ffffff;
    border-color: #999999;
    color: #000000;
  }
  .match-card svg { color: #000000; }
  .match__opt[aria-pressed='true'] { background: #dddddd; color: #000000; }
  .match__verdict { color: #333333; }
}

/* ---------- 18. Dibujo técnico (tema 7) ----------------------------------
   Las figuras de expresión gráfica son SVG en línea, no imágenes: pesan
   menos y se ven nítidas en el proyector (CONVENCIONES.md §4.3). Heredan
   currentColor, así que la hoja de impresión las pasa a negro con una sola
   regla y el mismo dibujo sirve en pantalla y en papel.
   -------------------------------------------------------------------------- */

.dwg { margin: var(--space-36) 0; max-width: 720px; color: var(--color-silver-mist); }
.dwg svg { width: 100%; height: auto; display: block; }
.dwg--narrow { max-width: 420px; }
.dwg--wide { max-width: 920px; }
.dwg figcaption { color: var(--color-ash-gray); }
/* Un .dwg dentro de una tarjeta del widget de emparejar o de un elemento de
   la lista no lleva su propio margen: lo pone la tarjeta. */
.match-card .dwg, .match__item .dwg { margin: 0; max-width: none; }

/* Trazos normalizados. El grosor relativo entre línea gruesa y fina es la
   norma (ISO 128: la fina, la mitad de la gruesa), y se respeta aquí. */
.dwg .thick  { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.dwg .thin   { fill: none; stroke: currentColor; stroke-width: 0.9; }
.dwg .hidden-edge { fill: none; stroke: currentColor; stroke-width: 0.9; stroke-dasharray: 5 3; }
.dwg .centre { fill: none; stroke: currentColor; stroke-width: 0.9; stroke-dasharray: 10 3 2 3; }
.dwg .dim    { fill: none; stroke: var(--color-saffron-spark); stroke-width: 0.9; }
/* Opacas a propósito: los pictóricos se pintan de lejos a cerca (algoritmo
   del pintor) y una cara traslúcida deja ver las aristas que tapa. */
.dwg .face   { fill: #0c0c0c; stroke: none; }
.dwg .face--lit { fill: #1c1c1c; stroke: none; }
.dwg .glass  { fill: none; stroke: var(--color-electric-iris); stroke-width: 0.9; stroke-dasharray: 4 4; }
/* Puntas de flecha: el marcador no hereda el stroke del trazo que lo usa,
   así que el color va en la punta. */
.dwg .tip     { fill: currentColor; stroke: none; }
.dwg .tip-dim { fill: var(--color-saffron-spark); stroke: none; }

.dwg text { fill: currentColor; font-family: var(--font-sans); font-size: 11px; font-weight: var(--weight-regular); }
.dwg .t-dim   { fill: var(--color-saffron-spark); font-family: var(--font-mono); font-size: 11px; }
.dwg .t-name  { fill: var(--color-bone-white); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.dwg .t-small { font-size: 9.5px; fill: var(--color-ash-gray); }

/* Rejilla de vistas: es la disposición del primer diedro, así que la
   posición de cada celda es contenido, no decoración. */
.views {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-18) var(--space-24);
  max-width: 640px;
  margin: var(--space-24) 0;
}
.views > * { margin: 0; }
.views__cell { border: 1px solid var(--hairline); border-radius: var(--radius-small); padding: var(--space-12); }
.views__cell h4 {
  font-size: var(--text-caption); font-weight: var(--weight-semibold);
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--color-ash-gray); margin: 0 0 var(--space-6);
}
.views__cell--empty { border-style: dashed; display: flex; align-items: center; }
.views__cell--empty p { font-size: 14px; color: var(--color-ash-gray); margin: 0; }

/* Rutas de ayuda (tema 6, módulo de seguridad en la red). Una ficha por
   vía, con el dato de contacto en monoespaciada para que se lea de lejos. */
.routes { display: grid; gap: var(--space-12); margin: var(--space-24) 0; max-width: 820px; }
.route {
  border: 1px solid var(--hairline);
  border-left: 2px solid var(--color-electric-iris);
  border-radius: var(--radius-small);
  padding: var(--space-18) var(--space-24);
}
.route__who { font-size: 21px; font-weight: var(--weight-semibold); color: var(--color-bone-white); margin: 0; }
.route__how { font-family: var(--font-mono); font-size: 23px; color: var(--color-saffron-spark); margin: var(--space-6) 0 0; }
.route__what { font-size: 20px; line-height: 1.5; color: var(--color-silver-mist); margin: var(--space-6) 0 0; max-width: 62ch; }

@media (max-width: 860px) {
  .views { grid-template-columns: minmax(0, 1fr); }
  .route { padding: var(--space-12) var(--space-18); }
}

@media print {
  .dwg { color: #000000; break-inside: avoid; page-break-inside: avoid; }
  .dwg .face { fill: #ffffff; }
  .dwg .face--lit { fill: #ededed; }
  .dwg .dim, .dwg .t-dim, .dwg .tip-dim { stroke: #6b4a00; fill: #6b4a00; }
  .dwg .dim { fill: none; }
  .dwg .tip { fill: #000000; }
  .dwg .glass { stroke: #777777; }
  .dwg .t-name { fill: #000000; }
  .dwg .t-small { fill: #333333; }
  .dwg figcaption { color: #333333; }
  .views__cell { border: 1px solid #999999 !important; }
  .views__cell h4, .views__cell--empty p { color: #000000 !important; }
  .route {
    border: 1px solid #999999 !important;
    background: #ffffff !important;
    break-inside: avoid; page-break-inside: avoid;
  }
  .route__who { color: #000000 !important; }
  .route__how { color: #000000 !important; }
  .route__what { color: #222222 !important; }
}

/* ---------- 20. Fórmulas compuestas, ejemplos resueltos y glosario --------
   Añadido en el prompt 6 (temas 8, 9 y 10). Cierra A66: las 176 fórmulas de
   la fuente se componen con HTML y Unicode, sin KaTeX ni MathJax, para que
   el fichero siga funcionando sin conexión.                                */

.formula--block {
  display: block;
  white-space: normal;
  font-size: 25px;
  line-height: 2.1;
  margin: var(--space-24) 0;
  max-width: var(--measure);
}

/* Fracción de dos pisos sin librería: dos cajas apiladas y una raya. */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  margin: 0 0.28em;
  line-height: 1.3;
}
.frac__n { padding: 0 0.4em 1px; }
.frac__d { padding: 1px 0.4em 0; border-top: 1px solid currentColor; }

/* Ejemplo resuelto. Misma caja que .activity, con el filo violeta que en el
   resto de la app marca «esto lo hace el libro», no «esto lo haces tú». */
.worked {
  margin: var(--space-36) 0;
  padding: var(--space-30);
  border: 1px solid var(--hairline);
  border-left: 2px solid var(--color-electric-iris);
  border-radius: var(--radius);
  max-width: 820px;
}
.worked h3 { margin-bottom: var(--space-12); }
.worked p { margin-bottom: var(--space-12); }
.worked p:last-child { margin-bottom: 0; }
.worked .formula--block { margin: var(--space-18) 0; }

/* Glosario buscable (fase 6.5 del plan). El mismo componente sirve para el
   glosario de un tema y para el glosario global de la app.                */
.glossary__search { display: block; margin: var(--space-18) 0 var(--space-24); }
.glossary__search input {
  width: 100%;
  max-width: 420px;
  font-family: inherit;
  font-size: 21px;
  color: var(--color-bone-white);
  background: var(--surface-faint);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-small);
  padding: var(--space-12) var(--space-18);
}
.glossary__search input::placeholder { color: var(--color-ash-gray); }

.glossary__list { margin: 0; display: block; }
.glossary__item {
  display: block;
  padding: var(--space-12) 0;
  border-top: 1px solid var(--hairline);
}
.glossary__item[hidden] { display: none !important; }
.glossary__item dt {
  font-size: 23px;
  font-weight: var(--weight-semibold);
  color: var(--color-saffron-spark);
  margin: 0;
}
.glossary__item dd {
  margin: var(--space-6) 0 0;
  font-size: 21px;
  line-height: 1.55;
  color: var(--color-silver-mist);
  max-width: 66ch;
}
.glossary__unit {
  display: inline-block;
  font-size: var(--text-caption);
  font-weight: var(--weight-semibold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ash-gray);
  margin-left: var(--space-12);
  vertical-align: 1px;
}

@media (max-width: 860px) {
  .formula--block { font-size: 22px; }
  .worked { padding: var(--space-18); }
}

@media print {
  .formula--block, .frac { color: #000000; }
  .worked {
    border: 1px solid #999999 !important;
    background: #ffffff !important;
    color: #000000;
    break-inside: avoid; page-break-inside: avoid;
  }
  .worked strong, .worked em { color: #000000; }
  .glossary__search { display: none !important; }
  .glossary__item { break-inside: avoid; page-break-inside: avoid; border-top-color: #cccccc; }
  .glossary__item dt { color: #000000; }
  .glossary__item dd, .glossary__unit { color: #222222; }

  /* Hallazgo A92, encontrado imprimiendo las tres unidades nuevas. Tres
     grupos de elementos heredaban el blanco del tema oscuro y salían en
     blanco sobre blanco. Los tres vienen del andamiaje del prompt 2 y
     afectan a los diez temas, igual que A86 y A88:
       · el índice de la apertura — .toc a lo pinta en pantalla y gana por
         especificidad al 'a { color: #000 }' del bloque de impresión;
       · .formula y sus sub/sup, que se estrenaron en el tema 1 y son ahora
         el cuerpo de la aritmética de los temas 9 y 10;
       · los botones, que en papel no se pueden pulsar pero sí se leen.     */
  .toc a, .toc a span, .toc__n { color: #000000; }
  .formula, .formula sub, .formula sup, .frac, .frac__n, .frac__d { color: #000000; }
  .match-card__letter { color: #000000; }
  .btn, .btn--ghost, .order-move button {
    color: #000000 !important;
    background: #ffffff !important;
    border-color: #999999 !important;
  }
}


/* ---------- 24. Impresión: el último barrido de color ---------------------
   Cuarta pasada de la familia A86 / A88 / A92, y la primera hecha con medida
   en lugar de con lectura: 678 combinaciones de texto y fondo en pantalla y
   550 en impresión, calculadas sobre el fichero compilado.

   En pantalla no falla ninguna; el mínimo es 4.6:1, el blanco sobre el
   violeta de los botones, que es la tensión que el plan ya había anticipado.

   En papel quedaban catorce grupos con el gris o el ámbar del tema oscuro
   sobre blanco, entre 1.73:1 y 2.81:1. Tres de ellos no son adorno: las
   cadenas y los comentarios del pseudocódigo, el cuerpo entero de la tabla
   de traza —que es la hoja de trabajo del tema 3— y los subíndices de las
   fórmulas dentro de tablas, sin los cuales Ae y Ar son la misma letra.

   Este bloque va al final del fichero a propósito. El primer @media print
   está en la sección 14, antes de las secciones de widgets, así que una
   regla suya perdía por orden contra .match__lead o .hunt__cross, que se
   declaran después con la misma especificidad: el arreglo se aplicaba a la
   mitad de los casos y la medida lo dijo. Hallazgo A94.               */

@media print {
  .str, .trace__line, .trace td, .trace th, .quiz__num, .hunt__cross,
  td sub, td sup, th sub, th sup { color: #000000; }
  /* Las celdas dadas de la tabla de traza llevan selector de atributo, que
     gana por especificidad a .trace td: hay que nombrarlas igual. */
  .trace td[data-fixed='true'] { color: #333333; }

  .cmt, .code-label, .quiz__score, .quiz-option__key, .match__lead,
  .trace__step, .cover__meta span { color: #333333; }
}


/* ---------- 20. Impresión con una sesión puesta ---------------------------
   Al final del fichero por el mismo motivo que el bloque 19: tiene que ganar
   por orden. Con una sesión activa se imprime solo esa sesión. La tarjeta de
   referencia sigue saliendo sola: app.js le quita el hidden antes de print()
   y se lo devuelve después. */

@media print {
  .sessions { display: none !important; }
  #view [hidden] { display: none !important; }
  body.print-refcard #view > * > .print-only { display: block !important; }
}

    <p>A tyrannosaur on a bicycle, on Mars, in a helmet and goggles. Nobody sat down and painted it.

    <p>It is tempting to call that machine a brain. Resist it, because the metaphor will make every
    later part of this unit harder to understand. Here is the sentence this whole unit is built on,
    and it will not change:</p>

    <div class="notice">
      <p><strong>The model has learnt patterns from an enormous amount of text, and it predicts the
      most likely continuation.</strong> That is the mechanism. Not thinking, not knowing, not looking
      anything up — predicting what usually comes next.</p>
    </div>

    <p>You already do a small version of this. If somebody starts a sentence with "the capital of
    France is…", you finish it without any effort. Now imagine a machine that has done that with a
    quantity of text no person could read in a thousand lifetimes, and that has become extremely good
    at it. Ask it a question and it does not search for the answer. It produces the words that most
    often follow a question of that shape.</p>

    <p>That single fact explains almost everything you will meet later: why the answers sound so
    fluent, why they are so often right, why they are sometimes confidently and completely wrong, and
    why you have to check.</p>

    <h3 class="subheading block">Three words to be careful with</h3>
    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">Words often used about AI, and what is actually happening</caption>
        <thead>
          <tr><th scope="col">People say</th><th scope="col">What is happening</th><th scope="col">Why the difference matters</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>The AI <em>knows</em> that…</td>
            <td>The patterns in its training data make that answer the likely one.</td>
            <td>Knowing implies a source you could go back to. There is none.</td>
          </tr>
          <tr>
            <td>The AI <em>understands</em> my question</td>
            <td>Your words change which continuation is most likely.</td>
            <td>This is why small changes to your prompt change the answer so much.</td>
          </tr>
          <tr>
            <td>The AI <em>thinks</em> that…</td>
            <td>It produces text of the shape "I think that…" because people do.</td>
            <td>There is no opinion behind it to disagree with, and no memory of being wrong.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="text-quiet">A <span class="term">model</span> is the piece of software that does the
    predicting, and it is the word this unit uses. <span class="term">Training data</span> is
    everything it learnt the patterns from.</p>
  </div>
</section>

<hr class="rule" data-session="1">

<!-- ===================== 2. Three kinds of AI ===================== -->
<section id="s2" class="section-open" data-session="1">
  <span class="label">Section 2</span>
  <h2 class="heading">Three kinds of AI, and the ones you already use</h2>

  <div class="block">
    <p>"AI" is not one thing, and the chatbot is the newest and noisiest member of a much older family.
    You have been using artificial intelligence for years without calling it that. Three kinds are
    worth telling apart, because they fail in completely different ways.</p>

    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">Three kinds of artificial intelligence, with how each one works and where you meet it</caption>
        <thead>
          <tr>
            <th scope="col">Kind</th><th scope="col">How it decides</th>
            <th scope="col">Where you meet it</th><th scope="col">How it goes wrong</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="term">rule-based system</span></td>
            <td>A person wrote the rules, one by one. If this, then that.</td>
            <td>The spellchecker's grammar warnings, a thermostat, the ticket machine, a chess program
            of the 1990s.</td>
            <td>It only ever does what somebody thought of in advance. Meet a case nobody wrote a rule
            for and it does nothing sensible.</td>
          </tr>
          <tr>
            <td><span class="term">machine learning</span></td>
            <td>Nobody wrote the rules. The system was shown thousands of labelled examples and worked
            out the pattern itself.</td>
            <td>The spam filter, the videos your app recommends next, face unlock, automatic
            translation, the map app's arrival time.</td>
            <td>It repeats whatever pattern was in the examples, including the ones nobody wanted it
            to learn.</td>
          </tr>
          <tr>
            <td><span class="term">generative AI</span></td>
            <td>Machine learning, aimed at producing something new: the most likely continuation of
            what it has been given.</td>
            <td>Chatbots, image generators, the sentence your phone suggests before you type it.</td>
            <td>It produces something plausible whether or not anything true exists to say. See
            Section 3.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p>Notice the nesting: generative AI is a kind of machine learning, and machine learning is a kind
    of artificial intelligence. A rule-based system is not machine learning at all — no learning
    happens in it. So the sentence "I do not use AI" is almost certainly false, and it is worth knowing
    which sort you are using before you trust it.</p>

    <div class="notice">
      <p><strong>Count them for a minute.</strong> Between waking up and arriving at school, how many
      of the three did you use? Unlocking a phone with your face, a recommended video, a translated
      caption, a spam message that never reached you, a route that avoided a traffic jam. None of those
      is a chatbot, and all of them are AI.</p>
    </div>

    <p class="text-quiet">The rest of this unit is about the third kind, because that is the one that
    writes things for you, and the one where being wrong is easiest to miss.</p>
  </div>
</section>

<hr class="rule" data-session="1">

<!-- ===================== 3. Why it gets things wrong ===================== -->
<section id="s3" class="section-open" data-session="1">
  <span class="label">Section 3</span>
  <h2 class="heading">Why it gets things wrong</h2>

  <div class="block">
    <p>"Sometimes AI makes mistakes, so check it" is a rule you can memorise and still not believe.
    Here is the reason, and once you have it, checking stops being a chore somebody imposed on you and
    starts being obvious.</p>

    <p>The model predicts the most likely continuation. <strong>Likely is not the same as true.</strong>
    A sentence can be a perfect fit for the pattern — right shape, right vocabulary, right confident
    tone — and describe something that never happened. The model is not choosing between "true" and
    "false", because it has no way to tell them apart. It is choosing what usually comes next.</p>

    <p>So it optimises for <span class="term">plausible</span>, and nothing else. When there is plenty
    of text about your question, the plausible answer and the true answer are usually the same
    sentence, and the model looks brilliant. When there is little text, or the question is about
    something local, recent, numerical or very specific, they come apart — and the model does not
    hesitate, slow down, or warn you. It has no mechanism for that.</p>

    <div class="notice">
      <p><strong>Hallucination.</strong> When a model states something invented as though it were a
      fact, that is called a <span class="term">hallucination</span>. You will meet the word outside
      this classroom, so it is worth having straight: it does not mean the model is broken, or lying.
      Lying needs an intention. This is the machine doing exactly what it was built to do — producing
      the most likely-looking text — in a case where the likely-looking text is not true.</p>
    </div>

    <h3 class="subheading block">A real case, and how sixty seconds would have caught it</h3>
    <p>In February 2023 Google advertised its new chatbot, Bard. In the advertisement it was asked what
    discoveries from the James Webb Space Telescope you could tell a nine-year-old about, and it
    answered, among other things, that the telescope had taken <em>the very first picture of a planet
    outside our own solar system</em>.</p>

    <p>That is false, and not slightly. The first direct image of a planet outside the solar system was
    taken in <span class="formula">2004</span>, by the Very Large Telescope of the European Southern
    Observatory, in Chile. The planet is called <span class="formula">2M1207 b</span>. The James Webb
    Space Telescope was not launched until <span class="formula">2021</span>.</p>

    <p>Read the wrong sentence again and notice what makes it dangerous. It is grammatical, confident,
    the right length, and about the right telescope. Nothing in the writing gives it away. Astronomers
    spotted it within hours — not by thinking harder, but by checking, which took one look at a
    published image with a date on it.</p>

    <p class="text-quieter">Sources: European Southern Observatory, release <span class="formula">eso0515</span>,
    "Yes, it is the Image of an Exoplanet" (2005), and the ESO image of 2M1207 b (2004); NASA's page for
    2M1207 b, "first image of an exoplanet". The Bard advertisement and its error were reported widely
    in the press on 8 February 2023.</p>

    <h3 class="subheading block">Where models are weakest</h3>
    <div class="grid-2 block">
      <div>
        <h4 class="heading-2xs">Anything local</h4>
        <p class="text-quiet">Your school, your town, your teacher, the bus timetable. Very little text
        exists about them, so the model fills the gap with something that sounds right.</p>
      </div>
      <div>
        <h4 class="heading-2xs">Numbers and dates</h4>
        <p class="text-quiet">Heights, populations, years, prices. A wrong number reads exactly like a
        right one, which is why it survives so long in a piece of homework.</p>
      </div>
      <div>
        <h4 class="heading-2xs">Sources and quotations</h4>
        <p class="text-quiet">Ask for a book, a page or a link and you may get a perfectly formed
        reference to something that does not exist. The shape of a reference is easy to predict.</p>
      </div>
      <div>
        <h4 class="heading-2xs">Anything after its training</h4>
        <p class="text-quiet">A model learnt from text gathered up to some date. Ask about last week
        and, unless the tool searches the web for you, it is predicting, not reporting.</p>
      </div>
    </div>
  </div>
</section>

<!-- ===================== 4. Checking an answer ===================== -->
<section id="s4" class="section-open" data-session="1">
  <span class="label">Section 4 · The habit this unit exists for</span>
  <h2 class="heading">Checking an answer</h2>

  <div class="block">
    <p>Everything above is theory until you do this once. Checking is not reading the answer again more
    carefully — you cannot catch a hallucination by rereading, because there is nothing in the text to

    <h3 class="subheading block">What counts as a source</h3>
    <ol>
      <li><strong>Somebody is responsible for it.</strong> A publisher, an institute, a school, an
      author with a name. "The internet said so" is not a source; a page belonging to a named
      organisation is.</li>
      <li><strong>It exists outside the answer you are checking.</strong> Asking the same model "are
      you sure?" is not checking. It will predict the most likely continuation of that question too,
      which is usually an apology followed by a different answer, right or wrong.</li>
      <li><strong>You can point at it.</strong> Page 74 of the textbook. The label on the classroom
      wall. The official site of the town council. If you cannot say where you looked, you have not
      checked.</li>
    </ol>

    <p>The best sources in a school are often in the room. A textbook, a map, an atlas, the periodic
    table on the wall, the school's own website, the timetable stuck to the door. None of them needs a
    connection, and all of them beat a second opinion from the same model.</p>

    <div class="notice">
      <p><strong>The sixty-second rule.</strong> Before you copy any concrete fact out of an AI answer
      into your work — a number, a date, a name, a place, a quotation — spend a minute finding it
      somewhere else. If you cannot find it anywhere in a minute, that is not proof it is wrong. It is
      a good reason not to write it down as though it were right.</p>
    </div>

    <h3 class="subheading block">What a filled-in check looks like</h3>
    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">Example of one completed row of a verification sheet</caption>
        <thead>
          <tr>
            <th scope="col">What you asked</th><th scope="col">What it answered</th>
            <th scope="col">How sure it sounded</th><th scope="col">Source you checked</th>
            <th scope="col">Verdict</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>How many pupils are there in my school?</td>
            <td>Gave a number, with a sentence about the school being a large secondary school.</td>
            <td>Completely sure. No hedging at all.</td>
            <td>The school's own website, "the school" page, read in class.</td>
            <td>Wrong. It had no way of knowing, and it never said so.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="text-quiet">The most useful column is the third one. Learning that a wrong answer can
    sound exactly as sure as a right one is the whole point of the exercise.</p>
  </div>

  <div class="activity">
    <span class="label">Activity 1.1</span>
    <h3 class="heading-2xs">Three facts, three sources</h3>
    <dl>
      <dt>Do</dt><dd>Ask an AI tool for three concrete facts, then check each one against a real source
      and record what you find. The three must be of different kinds: <strong>one you can check with
      something in this room</strong> (a textbook page, the periodic table, a map, the school website),
      <strong>one that is a number</strong> (a date, a height, a distance, a population), and
      <strong>one about your town or your school</strong>.</dd>
      <dt>With</dt><dd>The verification sheet, an institutional school account on the tool the school
      has enabled (see Annexe A), and at least one source that is physically in the room.</dd>
      <dt>How</dt><dd>In pairs, 30 minutes: 10 asking, 15 checking, 5 writing up. One of you types, the
      other writes the sheet, and you swap after the first fact.</dd>
      <dt>Hand in</dt><dd>A completed <strong>verification sheet</strong> with three rows: what you
      asked, what it answered, how sure it sounded, the source you checked with its name and where you
      found it, the verdict, and the corrected version where it was wrong.</dd>
      <dt>Marked on</dt><dd>Whether each source is a real, named source you could point somebody else
      at; whether the verdict follows from the source rather than from your impression; and whether the
      correction is right. Finding that all three answers were correct is a perfectly good result, as
      long as you can show how you know.</dd>
    </dl>
    <p class="text-quiet block--tight">Two rules while you do it. Do not type anybody's personal
    details into the tool, your own included — not names of classmates, not marks, not addresses.
    And do not ask it anything you would not ask out loud in this classroom.</p>
  </div>
</section>

<!-- ===================== 5. Asking well ===================== -->
<section id="s5" class="section-open" data-session="2">
  <span class="label">Section 5</span>
  <h2 class="heading">Asking well: the five parts of a prompt</h2>

  <div class="block">
    <p>A <span class="term">prompt</span> is the message you send to the model. Since the model
    predicts the continuation of what you give it, what you give it decides almost everything. A vague
    prompt is not answered vaguely by accident: a vague opening has an enormous number of likely
    continuations, and you get an average of all of them.</p>

    <p>Five parts, and they are worth learning in this order because that is roughly the order in which
    leaving one out hurts.</p>

    <div class="table-scroll">
      <table>
        <caption class="visually-hidden">The five parts of a prompt: role, task, audience, context and format</caption>
        <thead>
          <tr><th scope="col">Part</th><th scope="col">The question it answers</th><th scope="col">Example</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>R</strong> — Role</td>
            <td>Who should it write as?</td>
            <td>"Act as my 2.º ESO maths teacher."</td>
          </tr>
          <tr>
            <td><strong>T</strong> — Task</td>
            <td>What exactly do you want done? One task, one verb.</td>
            <td>"Explain how to solve a linear equation."</td>
          </tr>
          <tr>
            <td><strong>A</strong> — Audience</td>
            <td>Who is going to read the answer?</td>
            <td>"For a 13-year-old who has never seen one before."</td>
          </tr>
          <tr>
            <td><strong>C</strong> — Context</td>
            <td>What is the situation? What do you already have, already know, and need it for?</td>
            <td>"I have a test on Thursday, I can already work with fractions, and I get stuck the
            moment there are letters on both sides."</td>
          </tr>
          <tr>
            <td><strong>F</strong> — Format</td>
            <td>What should the answer look like?</td>
            <td>"Numbered steps, then one worked example, then two questions for me to try. Under 150
            words."</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="notice">
      <p><strong>Audience and context are not the same thing, and it is the commonest mix-up.</strong>
      The <em>audience</em> is who reads it: your class, a nine-year-old sibling, an examiner. The
      <em>context</em> is the situation around the task: what you already know, what you have tried,
      what you have got, what it is for, and any limit you have to respect. Two prompts can have the
      same audience and completely different contexts — and the second one is what makes the answer fit
      you rather than fit anybody.</p>
    </div>

    <h3 class="subheading block">The same request, twice</h3>

    <span class="code-label">Thin prompt</span>
    <pre class="code code--bad code--wrap">Explain the water cycle.</pre>

    <p class="text-quiet">You will get a competent, general paragraph. It is not wrong. It is simply
    not for you, not for anything, and not in any particular shape — which is exactly what you asked
    for.</p>

    <span class="code-label">The same request with all five parts</span>
    <pre class="code code--good code--wrap"><span class="cmt">R</span>  Act as a geography teacher.
<span class="cmt">T</span>  Explain the water cycle.
<span class="cmt">A</span>  For a 13-year-old in 2.º ESO.
<span class="cmt">C</span>  I have a test on Friday. I already know evaporation and
   condensation; I keep confusing infiltration with run-off.
<span class="cmt">F</span>  Five stages, one short sentence each, then a two-line
   comparison of infiltration and run-off. No more than 120 words.</pre>

    <p>You do not have to lay it out with letters down the side. Written as one paragraph it works just
    as well. The letters are a checklist for while you are learning, not a format the machine
    requires.</p>

    <h3 class="subheading block">Three prompts that waste your time</h3>
    <div class="grid-2 block">
      <div>
        <h4 class="heading-2xs">Everything at once</h4>
        <p class="text-quiet">"Make me a revision guide, flashcards, a quiz and a video script about
        climate change." Four tasks in one prompt gets you four mediocre answers. Ask for one, get it
        right, then ask for the next.</p>
      </div>
      <div>
        <h4 class="heading-2xs">A mood instead of a request</h4>
        <p class="text-quiet">"I hate this topic, make it easier." The model has nothing to work with.
        Say what is hard: "Explain why the Cold War started, in everyday words, for someone my age."</p>
      </div>
      <div>
        <h4 class="heading-2xs">No format at all</h4>
        <p class="text-quiet">"Tell me about World War Two." You will get an essay when you wanted a
        list, or a list when you wanted an explanation. Say which, and say how long.</p>
      </div>
      <div>
        <h4 class="heading-2xs">Asking it to be right</h4>
        <p class="text-quiet">"Give me only true facts." This changes nothing. There is no switch
        inside the model between true and false — that is what Section 3 was about. Checking is still
        your job.</p>
      </div>
    </div>
  </div>
</section>

<!-- ===================== 6. The second try ===================== -->
<section id="s6" class="section-open" data-session="2">
  <span class="label">Section 6 · The part almost everybody skips</span>
  <h2 class="heading">The second try</h2>

  <div class="block">
    <p>Most people write one prompt, read the answer, decide the tool is either amazing or useless, and
    stop. That is like handing in the first draft of everything you ever write.</p>

    <p>The first answer is a draft. <span class="term">Iterating</span> means improving it by saying
    what is wrong with it — not repeating the request louder, and not starting again from nothing. The

      <figcaption>Writing the prompt is not the skill. Reading the answer and knowing exactly what is
      wrong with it — that is the skill, and it is the same one you use on your own work.</figcaption>
    </figure>

    <h3 class="subheading block">Three rounds on one prompt</h3>

    <span class="code-label">Round 1 · you ask</span>
    <pre class="code code--wrap">Act as a science teacher. Explain how a lever multiplies force,
for a 13-year-old in 2.º ESO, in under 150 words.</pre>
    <p class="text-quiet">What comes back is decent and general, and uses a see-saw. You have already
    done see-saws.</p>

    <span class="code-label">Round 2 · you say what is wrong</span>
    <pre class="code code--wrap">Too abstract, and I already understand see-saws. Use a pair of
pliers instead, give me the actual numbers for a 15 cm handle and
a 3 cm jaw, and keep it to five sentences.</pre>
    <p class="text-quiet">Notice the shape of that message: <strong>what is wrong</strong>, then
    <strong>what to do instead</strong>. No "please can you", no repeating the original prompt.</p>

    <span class="code-label">Round 3 · you push it further</span>
    <pre class="code code--wrap">Good. Now turn the last two sentences into three questions with
answers, so I can test myself. Make the third one harder than
anything you have said so far.</pre>
    <p class="text-quiet">Three short messages, and you have a tailored explanation and a self-test.
    The first prompt could never have produced this, because you did not know what you wanted until you
    saw what you did not want.</p>

    <div class="notice">
      <p><strong>Four things worth saying on the second try.</strong> "Shorter, and cut the
      introduction." · "You have used a word I do not know: replace it and explain it." · "Give me the
      opposite argument as strongly as you can." · "Which part of that answer are you least sure about,
      and what would I have to check?" The last one does not make the answer true — but it does tend to
      point you at the sentence worth checking first.</p>
    </div>
  </div>
</section>

<!-- ===================== 7. Five ways to study with it ===================== -->
<section id="s7" class="section-open" data-session="2">
  <span class="label">Section 7 · Techniques, not products</span>
  <h2 class="heading">Five ways to study with it</h2>

  <div class="block">

    techniques have survived every one of them so far, because they are about how you study, not about
    which button you press. If you want the one this school has enabled, that is Annexe A, and it is
    the only part of this unit tied to a product.</p>
